// ============================================================
// Calcul de la situation locative mois par mois
// Retourne un tableau de lignes avec : mois, annee, attendu, recu, solde (peut être négatif = crédit)
// Seuls les mois à solde non nul sont retournés (ou tous si includeAll=true)
function calcDetteLigne(tenant, moisCourant, anneeCourante, includeAll){
  const MOIS_LIST=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const isComm=tenant.type_bail==='commercial';
  const loyerHT=parseFloat(tenant.loyer_ref||0);
  const chargesHT=parseFloat(tenant.charges||0);
  const loyerMensuel=isComm
    ?Math.round((loyerHT*1.2+chargesHT*1.2)*100)/100
    :Math.round((loyerHT+chargesHT)*100)/100;
  if(!loyerMensuel||typeof S==='undefined')return{lignes:[],detteFinale:0};

  const DETTE_DEPUIS=new Date(2026,0,1);
  const entree=tenant.date_entree?new Date(tenant.date_entree):null;
  const debut=entree&&entree>DETTE_DEPUIS?entree:DETTE_DEPUIS;

  // Solde au 1er janvier 2026 (ou date d'entrée si après) saisi manuellement
  let solde=Math.round((parseFloat(tenant.dette||0))*100)/100;
  const lignes=[];

  let y=debut.getFullYear(),m=debut.getMonth();
  // On s'arrête au mois courant INCLUS (ou mois précédent si moisCourant défini),
  // sans dépasser la date de sortie du locataire si elle est renseignée (un locataire
  // parti ne doit plus accumuler de loyer dû après son départ).
  const moisCourantNum=moisCourant?MOIS_LIST.indexOf(moisCourant):-1;
  let stopY=anneeCourante||new Date().getFullYear();
  let stopM=moisCourantNum>=0?moisCourantNum:(new Date().getMonth());
  const sortie=tenant.date_sortie?new Date(tenant.date_sortie):null;
  if(sortie){
    const sortieY=sortie.getFullYear(),sortieM=sortie.getMonth();
    if(sortieY<stopY||(sortieY===stopY&&sortieM<stopM)){stopY=sortieY;stopM=sortieM;}
  }

  while(y<stopY||(y===stopY&&m<=stopM)){
    const moisNom=MOIS_LIST[m];
    const moisNum=m+1;
    // Exclure le mois du document courant (sera traité séparément)
    if(moisCourant&&moisNom===moisCourant&&y===anneeCourante){m++;if(m>11){m=0;y++;}continue;}
    const p=S.rentPayments.find(x=>x.tenant_id===tenant.id&&x.annee===y&&x.mois===moisNom);
    const recu=p?Math.round(((p.locataire_part||0)+(p.caf||0))*100)/100:0;
    const remise=p?Math.round((p.remise||0)*100)/100:0;
    // Loyer attendu ce mois = loyer mensuel référence - remise éventuelle
    const attenduCeMois=Math.max(0,Math.round((loyerMensuel-remise)*100)/100);
    const soldePrecedent=solde;
    solde=Math.round((solde+attenduCeMois-recu)*100)/100;
    if(includeAll||Math.abs(solde)>0.01){
      lignes.push({
        mois:moisNom,annee:y,mois_num:moisNum,
        attendu:attenduCeMois,recu,remise,remise_motif:p?.remise_motif||'',
        soldePrecedent:Math.round(soldePrecedent*100)/100,
        solde:Math.round(solde*100)/100,
        saisi:!!p,
        estCredit:solde<-0.01,
        estSolde:Math.abs(solde)<0.01
      });
    }
    m++;if(m>11){m=0;y++;}
  }
  return{lignes,detteFinale:Math.round(solde*100)/100};
}

function csvRow(cells){ return cells.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(';'); }
function downloadCsv(filename, rows){
  const bom='﻿';
  const blob=new Blob([bom+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

function exportFacturesExcel(compte){
  const year=S.facturesYear||new Date().getFullYear();
  const filtered=S.factures.filter(f=>{
    if(f.date&&!f.date.startsWith(String(year)))return false;
    if(compte==='savadur'&&f.compte!=='savadur')return false;
    if(compte==='perso'&&f.compte!=='perso')return false;
    return true;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const fmt=n=>n?parseFloat(n).toFixed(2).replace('.',','):'0,00';
  const rows=[
    csvRow(['FACTURES DÉPENSES — '+(compte==='savadur'?'J&A SAVADUR':compte==='perso'?'Personnel':'Tous comptes')+' — '+year]),
    csvRow(['Date','Fournisseur','Catégorie','Bien','BT lié','Description','Compte','HT (€)','TVA (%)','TTC (€)','Rapprochée','Lien Drive']),
    ...filtered.map(f=>{
      const wo=f.wo_id?S.workOrders.find(w=>w.id===f.wo_id):null;
      return csvRow([
        f.date?new Date(f.date).toLocaleDateString('fr-FR'):'',
        f.fournisseur||'',f.categorie||'',f.bien||'',
        wo?wo.title:'',f.description||'',
        f.compte==='savadur'?'J&A SAVADUR':'Personnel',
        fmt(f.montant_ht),f.taux_tva||0,fmt(f.montant_ttc),
        estPaye(f)?'Oui':'Non',f.url_drive||''
      ]);
    }),
    csvRow([]),
    csvRow(['','','','','','','TOTAL TTC','','',filtered.reduce((s,f)=>s+parseFloat(f.montant_ttc||0),0).toFixed(2).replace('.',',')])
  ];
  downloadCsv('Factures_'+(compte==='savadur'?'SAVADUR':compte==='perso'?'Perso':'Toutes')+'_'+year+'.csv', rows);
}

      }),

function exportBilanExcel(){
  const year=S.facturesYear||new Date().getFullYear();
  const fmt=n=>n?parseFloat(n).toFixed(2).replace('.',','):'0,00';
  // Revenus SAVADUR
  const revenus=S.rentPayments.filter(p=>{

    const t=S.tenants.find(x=>x.id===p.tenant_id);
    return t&&dubailFilter(t.logement||'');
  }).reduce((s,p)=>s+parseFloat(p.loyer||0),0);

  const btSavadur=S.workOrders.filter(w=>w.paid&&w.date?.startsWith(String(year))&&(()=>{const tr=w.topo_ref;return tr&&dubailFilter(tr.propName||'');})());
  const depBT=btSavadur.reduce((s,w)=>s+parseFloat(w.cost||0),0);
  const totalDep=depFact+depBT;
  const resultat=revenus-totalDep;

  // Detail by bien
  const biens=S.topology.properties.filter(p=>dubailFilter(p.name));
  const rows=[
    csvRow(['BILAN J&A SAVADUR — '+year]),
    csvRow([]),
    csvRow(['REVENUS LOCATIFS']),
    csvRow(['Locataire','Logement','Loyers perçus']),
    ...S.tenants.filter(t=>t.actif!==false&&dubailFilter(t.logement||'')).map(t=>{
      const total=S.rentPayments.filter(p=>p.tenant_id===t.id&&p.annee===year&&p.paye).reduce((s,p)=>s+parseFloat(p.loyer||0),0);
      return csvRow([t.nom,t.logement||'',fmt(total)]);
    }),
    csvRow(['','TOTAL REVENUS',fmt(revenus)]),
    csvRow([]),
    csvRow(['DÉPENSES — FACTURES']),
    csvRow(['Date','Fournisseur','Catégorie','Bien','TTC','Rapprochée']),
    ...factures.sort((a,b)=>new Date(a.date)-new Date(b.date)).map(f=>
      csvRow([f.date?new Date(f.date).toLocaleDateString('fr-FR'):'',f.fournisseur||'',f.categorie||'',f.bien||'',fmt(f.montant_ttc),estPaye(f)?'Oui':'Non'])
    ),
    csvRow(['','TOTAL FACTURES','','',fmt(depFact)]),
    csvRow([]),
    csvRow(['DÉPENSES — BONS DE TRAVAUX RÉGLÉS']),
    csvRow(['Date','BT','Bien','Coût TTC']),
    ...btSavadur.sort((a,b)=>new Date(a.date)-new Date(b.date)).map(w=>
      csvRow([w.date?new Date(w.date).toLocaleDateString('fr-FR'):'',w.title||'',w.topo_ref?.propName||'',fmt(w.cost)])
    ),
    csvRow(['','TOTAL BT','','',fmt(depBT)]),
    csvRow([]),
    csvRow(['══════════════════']),
    csvRow(['TOTAL REVENUS','','',fmt(revenus)]),
    csvRow(['TOTAL DÉPENSES','','',fmt(totalDep)]),
    csvRow(['RÉSULTAT NET','','',fmt(resultat)]),
  ];
  downloadCsv('Bilan_SAVADUR_'+year+'.csv', rows);
  alert('Export terminé !\n\nRevenus : '+fmt(revenus)+' €\nDépenses : '+fmt(totalDep)+' €\nRésultat net : '+fmt(resultat)+' €');
}

    <td colspan="6">TOTAL</td>

    <td></td>
    <td style="text-align:right">${fmt2(totalTTC)}</td>
    <td colspan="2"></td>
  </tr>`;

  // ── Sheet 2 : Revenus locatifs SAVADUR ──
  xlsContent += '<tr><td></td></tr><tr><td></td></tr>';
  xlsContent += '<tr><td colspan="8" style="font-weight:bold;font-size:14px;background:#185FA5;color:white">REVENUS LOCATIFS J&A SAVADUR — '+(S.factYear||new Date().getFullYear())+'</td></tr>';
  xlsContent += '<tr><td></td></tr>';
  xlsContent += '<tr style="background:#333;color:white"><td><b>Locataire</b></td><td><b>Logement</b></td><td><b>Mois</b></td><td><b>Année</b></td><td><b>Loyer TTC (€)</b></td><td><b>Part CAF (€)</b></td><td><b>Part locataire (€)</b></td><td><b>Date paiement</b></td></tr>';

  xlsContent+=`<tr style="background:#FFEBEE"><td><b>Factures dépenses (SAVADUR)</b></td><td style="text-align:right;color:red">${fmt2(totalDepSav)} €</td><td></td><td></td></tr>`;
  xlsContent+=`<tr style="background:#FFEBEE"><td><b>Coûts BT réglés (Dubail)</b></td><td style="text-align:right;color:red">${fmt2(btCostsSav)} €</td><td></td><td></td></tr>`;
  xlsContent+=`<tr style="background:#FFF9E6"><td><b>Total dépenses</b></td><td style="text-align:right;color:red;font-weight:bold">${fmt2(totalDepTotal)} €</td><td></td><td></td></tr>`;
  xlsContent+=`<tr style="background:${bilan>=0?'#1D9E75':'#D32F2F'};color:white"><td><b>RÉSULTAT NET</b></td><td style="text-align:right;font-weight:bold;font-size:14px">${fmt2(bilan)} €</td><td></td><td></td></tr>`;

  xlsContent+='</table></body></html>';

  const blob=new Blob([xlsContent],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='GMAO_Export_'+(S.factYear||'Tout')+'_'+(fTab==='savadur'?'SAVADUR':fTab==='perso'?'Perso':'Toutes')+'.xls';
  a.click();
}

  const nextDue=mt.type==='periodic'?mt.next_due:mt.due_date;

  const overdue=daysLeft!==null&&daysLeft<0;
  root.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f3;font-family:Arial,sans-serif;padding:20px;box-sizing:border-box">
    <div style="background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:400px;width:100%;overflow:hidden">
      <div style="background:#1D9E75;padding:24px;text-align:center">
        <div style="font-size:40px">✅</div>
        <div style="color:#fff;font-size:20px;font-weight:700;margin-top:8px">Validation rapide</div>
        <div style="color:rgba(255,255,255,.8);font-size:13px;margin-top:4px">GMAO Pro <span style="font-size:9px;opacity:0.5">v4</span></div>
      </div>
      <div style="padding:24px">
        <div style="font-size:18px;font-weight:600;margin-bottom:4px">${mt.name}</div>
        <div style="color:#888;font-size:13px;margin-bottom:16px">${asset?'🔧 '+asset.name:(mt.bien||'')}</div>
        ${mt.description?`<div style="background:#f5f5f3;border-radius:8px;padding:12px;font-size:13px;color:#555;margin-bottom:16px">${mt.description}</div>`:''}
        ${nextDue?`<div style="background:${overdue?'#FDEDEC':'#E8F5E9'};border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:20px">
          ${overdue?'⚠ En retard de '+(-daysLeft)+' jour(s)':'📅 Échéance dans '+daysLeft+' jour(s)'}
          — ${new Date(nextDue).toLocaleDateString('fr-FR')}
        </div>`:''}
        <div style="margin-bottom:16px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">Réalisé par (optionnel)</label>
          <input id="qr-by" placeholder="Votre nom ou société" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box">
        </div>
        <div style="margin-bottom:20px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">Note / Observation (optionnel)</label>
          <textarea id="qr-note" placeholder="Ex: RAS, vitres nettoyées, nettoyage complet effectué..." rows="3" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;resize:vertical"></textarea>
        </div>
        <div style="margin-bottom:16px">
          <label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">🔐 Code PIN *</label>
          <input id="qr-pin" type="password" inputmode="numeric" placeholder="Code PIN à 4 chiffres" maxlength="6"
            style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:18px;box-sizing:border-box;text-align:center;letter-spacing:8px">
          <div id="qr-pin-error" style="color:#E24B4A;font-size:12px;margin-top:4px;display:none">Code PIN incorrect</div>
        </div>
        <button onclick="handleQRDone('${mtId}')" style="width:100%;background:#1D9E75;color:#fff;border:none;padding:14px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:12px">
          ✓ Confirmer — C'est fait !
        </button>
        <a href="/" style="display:block;text-align:center;color:#888;font-size:13px;text-decoration:none">Annuler — Retour à GMAO Pro</a>
      </div>
    </div>
  </div>`;
}

async function handleQRDone(mtId){
  const mt=S.maintenanceTemplates.find(x=>x.id===mtId);
  if(!mt)return alert('Gamme introuvable');
  
  // Check PIN
  const pin=document.getElementById('qr-pin')?.value.trim();
  const pinError=document.getElementById('qr-pin-error');
  // Get PIN from app_config or use default 1234
  const configPin=(await sb.from('app_config').select('value').eq('key','qr_pin').single())?.data?.value||'1234';
  if(!pin){if(pinError)pinError.style.display='';pinError.textContent='Code PIN requis';return;}
  if(pin!==configPin){
    if(pinError){pinError.style.display='';pinError.textContent='Code PIN incorrect — réessayez';}
    document.getElementById('qr-pin').value='';
    document.getElementById('qr-pin').focus();
    return;
  }
  if(pinError)pinError.style.display='none';
  
  const by=document.getElementById('qr-by')?.value.trim()||'QR Code';
  const note=document.getElementById('qr-note')?.value.trim()||'';
  const today=new Date().toISOString().split('T')[0];
  
  // Calculate next due date
  let nextDue=null;
  if(mt.type==='periodic'&&mt.period_days){
    const d=new Date();d.setDate(d.getDate()+mt.period_days);
    nextDue=d.toISOString().split('T')[0];
  }
  
  // Update in Supabase
  const upd={last_done:today};
  if(nextDue)upd.next_due=nextDue;
  const {error}=await sb.from('maintenance_templates').update(upd).eq('id',mtId);
  if(error){alert('Erreur : '+error.message);return;}
  Object.assign(mt,upd);
  
  // Add journal entry if work_orders exist for this mt
  // Send confirmation email to admin
  try{
    if(BREVO_API_KEY){
      const asset=S.assets.find(a=>a.id===mt.asset_id);
      const html=`<div style="font-family:sans-serif;max-width:500px;margin:0 auto">
        <div style="background:#1D9E75;padding:20px;border-radius:8px 8px 0 0">
          <h2 style="color:#fff;margin:0">✅ Gamme validée via QR Code</h2>
        </div>
        <div style="background:#fff;padding:20px;border:1px solid #e5e5e0;border-top:none;border-radius:0 0 8px 8px">
          <p><strong>Gamme :</strong> ${mt.name}</p>
          <p><strong>Équipement :</strong> ${asset?.name||mt.bien||'—'}</p>
          <p><strong>Réalisé par :</strong> ${by}</p>
          <p><strong>Date :</strong> ${new Date().toLocaleDateString('fr-FR')}</p>
          ${note?`<p><strong>Observation :</strong> ${note}</p>`:''}
          ${nextDue?`<p><strong>Prochaine échéance :</strong> ${new Date(nextDue).toLocaleDateString('fr-FR')}</p>`:''}
        </div>
      </div>`;
      await fetch('https://api.brevo.com/v3/smtp/email',{
        method:'POST',
        headers:{'api-key':BREVO_API_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({sender:{name:'GMAO Pro',email:'antoinejosse56@gmail.com'},
          to:[{email:'antoinejosse56@gmail.com',name:'Antoine JOSSE'}],
          subject:`✅ ${mt.name} — Validé par ${by}`,htmlContent:html})
      });
    }
  }catch(e){console.warn('Email QR confirmation failed:',e.message);}
  
  // Show success page
  const root=document.getElementById('root');
  root.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f3;font-family:Arial,sans-serif;padding:20px">
    <div style="text-align:center;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px;max-width:360px;width:100%">
      <div style="font-size:64px">✅</div>
      <div style="font-size:22px;font-weight:700;color:#1D9E75;margin:16px 0 8px">C'est enregistré !</div>
      <div style="color:#555;margin-bottom:8px"><strong>${mt.name}</strong></div>
      <div style="color:#888;font-size:13px;margin-bottom:24px">Validé le ${new Date().toLocaleDateString('fr-FR')} par ${by}</div>
      ${nextDue?`<div style="background:#E8F5E9;border-radius:8px;padding:10px;font-size:13px;color:#2e7d32;margin-bottom:24px">📅 Prochaine échéance : ${new Date(nextDue).toLocaleDateString('fr-FR')}</div>`:''}
      <a href="/" style="background:#1D9E75;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">Retour à GMAO Pro</a>
    </div>
  </div>`;
}


loadAll().then(async()=>{
  // Handle URL params
  const urlParams=new URLSearchParams(window.location.search);
  const qrAction=urlParams.get('action');
  const qrMtId=urlParams.get('mt');
  const emplacementParam=urlParams.get('emplacement');
  if(qrAction==='done'&&qrMtId){
    renderQRConfirm(qrMtId);
    return;
  }
  if(emplacementParam){
    // Navigate to tools tab showing this emplacement
    S.eTab='emplacements';
    S.activeTab='outils';
    render();
    // Show a popup with tools and consommables for this emplacement
    setTimeout(()=>{
      const tools=S.tools.filter(t=>t.location===emplacementParam);
      const csos=S.consommables.filter(c=>c.emplacement===emplacementParam);
      const rng=(S.rangements||[]).find(r=>r.nom===emplacementParam);
      let html='<div style="padding:20px;font-family:Arial,sans-serif;max-width:500px;margin:0 auto">';
      html+='<h2 style="font-size:20px;margin-bottom:4px">'+emplacementParam+'</h2>';
      if(rng?.description)html+='<p style="color:#666;margin-bottom:16px">'+rng.description+'</p>';
      if(tools.length){
        html+='<h3 style="font-size:14px;color:#555;margin-bottom:8px">🔧 Outils ('+tools.length+')</h3>';
        html+='<ul style="list-style:none;padding:0;margin-bottom:16px">';
        tools.forEach(t=>html+='<li style="padding:6px 0;border-bottom:1px solid #eee">'+t.name+'<span style="float:right;color:#888;font-size:12px">'+t.status+'</span></li>');
        html+='</ul>';
      }
      if(csos.length){
        html+='<h3 style="font-size:14px;color:#555;margin-bottom:8px">📦 Consommables ('+csos.length+')</h3>';
        html+='<ul style="list-style:none;padding:0">';
        csos.forEach(c=>html+='<li style="padding:6px 0;border-bottom:1px solid #eee">'+c.nom+'<span style="float:right;color:#888;font-size:12px">Stock: '+c.stock+' '+c.unite+'</span></li>');
        html+='</ul>';
      }
      if(!tools.length&&!csos.length)html+='<p style="color:#888;text-align:center;padding:20px">Aucun article dans cet emplacement</p>';
      html+='<a href="'+window.location.origin+window.location.pathname+'" style="display:block;text-align:center;margin-top:16px;padding:10px;background:#1D9E75;color:#fff;border-radius:6px;text-decoration:none;font-weight:600">→ Ouvrir GMAO Pro</a>';
      html+='</div>';
      document.getElementById('root').innerHTML=html;
    },100);
    return;
  }
  // Auto-login if saved credentials exist
  const savedEmail=localStorage.getItem('gmao_saved_email')||'';
  const savedPass=localStorage.getItem('gmao_saved_pass')||'';
  if(savedEmail&&savedPass&&!S.currentUser){
    const user=S.users.find(u=>u.email===savedEmail&&u.password===savedPass);
    if(user){S.currentUser=user;console.log('Auto-login:',user.email);}
  }
  S.loans.filter(l=>!l.returned).forEach(l=>{
    const t=S.tools.find(x=>x.id===l.tool_id);
    if(t&&t.status==='available'){t.status='loaned';sb.from('tools').update({status:'loaned'}).eq('id',l.tool_id);}
  });
  render();
  setTimeout(()=>checkAndSendAlerts(),3000);
});

// PWA Service Worker — only on GitHub Pages
if("serviceWorker" in navigator && location.hostname.includes('github.io')){
  navigator.serviceWorker.register("/GMAO/sw.js").catch(e=>console.log("SW:",e));
}

// Handle quick launch from PWA shortcuts
const urlParams=new URLSearchParams(window.location.search);
const quickNav=urlParams.get("quick");
if(quickNav){
  const navMap={compteur:"compteurs",loyer:"locatif",creche:"famille",ecole:"famille",
    travaux:"workorders",outil:"tools",resa:"reservations"};
  if(navMap[quickNav]){
    S.view=navMap[quickNav];
    if(quickNav==="creche")S.familleTab="creche";
    if(quickNav==="ecole")S.familleTab="ecole";
  }
}

// Raccourci PWA "Baux & États des lieux" (voir manifest.json) - ouvre
// directement le mode terrain (renderFieldApp) une fois connecte, sans
// passer par l'accueil mobile puis la vue desktop complete.
if(urlParams.get("field"))S.fieldMode=true;

// Handle QR code scans (?tool=id, ?cso=id, ?emplacement=name)
const toolParam=urlParams.get("tool");
const csoParam=urlParams.get("cso");
const empParam=urlParams.get("emplacement");
if(toolParam||csoParam||empParam){
  loadAll().then(function(){
    if(toolParam){
      S.view="tools";
      S.qrTool=toolParam;
    } else if(csoParam){
      S.view="consommables";
      S.qrCso=csoParam;
    } else if(empParam){
      const loc=decodeURIComponent(empParam);
      const rng=(S.rangements||[]).find(r=>r.nom===loc);
      S.view="rangements";
      if(rng){S.rngInventFor=rng.id;S.inventState={};}
    }
    render();
    // Scroll/highlight the item after render
    setTimeout(function(){
      const id=toolParam||csoParam;
      if(id){
        const el=document.querySelector('[data-id="'+id+'"],[data-tool="'+id+'"],[data-cso="'+id+'"]');
        if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="3px solid #185FA5";}
      }
      if(empParam){
        const el=document.querySelector('[data-rng="'+decodeURIComponent(empParam)+'"]');
        if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="3px solid #185FA5";}
      }
    },500);
  });
}
</script>
