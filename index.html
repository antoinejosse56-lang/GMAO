    const cfg=m.edlConfig||{nb_chambres:1,nb_sdb:1,nb_wc:0,inc_entree:true,inc_sejour:true,inc_cuisine:true,autres:[]};
    html=`${mhd('🧩 Configuration des pièces — '+(t.logement||''))}
    <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Cette structure sera mémorisée sur la fiche du logement et réutilisée automatiquement pour tous les états des lieux suivants de ce logement (sortie de ce locataire, entrée des locataires futurs).</p>
    <div class="form-group"><label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" ${cfg.inc_entree?'checked':''} onchange="S.modal.edlConfig={...S.modal.edlConfig,inc_entree:this.checked}"> Entrée / Couloir</label></div>
    <div class="form-group"><label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" ${cfg.inc_sejour?'checked':''} onchange="S.modal.edlConfig={...S.modal.edlConfig,inc_sejour:this.checked}"> Séjour - Salle à manger</label></div>
    <div class="form-group"><label style="display:flex;align-items:center;gap:8px;font-weight:400"><input type="checkbox" ${cfg.inc_cuisine?'checked':''} onchange="S.modal.edlConfig={...S.modal.edlConfig,inc_cuisine:this.checked}"> Cuisine</label></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="form-group"><label>Chambres</label><input type="number" min="0" max="10" value="${cfg.nb_chambres}" onchange="S.modal.edlConfig={...S.modal.edlConfig,nb_chambres:parseInt(this.value)||0}"></div>
      <div class="form-group"><label>Salles de bain</label><input type="number" min="0" max="5" value="${cfg.nb_sdb}" onchange="S.modal.edlConfig={...S.modal.edlConfig,nb_sdb:parseInt(this.value)||0}"></div>
      <div class="form-group"><label>WC séparés</label><input type="number" min="0" max="5" value="${cfg.nb_wc}" onchange="S.modal.edlConfig={...S.modal.edlConfig,nb_wc:parseInt(this.value)||0}"></div>
    </div>
    <div class="sec" style="margin-top:10px;margin-bottom:6px">Pièces libres <span style="font-size:11px;color:var(--text2);text-transform:none;font-weight:400">(local, réserve, bureau...)</span></div>
    ${cfg.autres.map((a,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px">
      <input value="${(a||'').replace(/"/g,'&quot;')}" placeholder="Ex: Local, Réserve" oninput="S.modal.edlConfig.autres[${i}]=this.value" style="flex:1">
      <button type="button" class="btn btn-d btn-sm" onclick="S.modal.edlConfig={...S.modal.edlConfig,autres:S.modal.edlConfig.autres.filter((_,idx)=>idx!==${i})};render()">✕</button>
    </div>`).join('')}
    <button type="button" class="btn btn-sm" onclick="S.modal.edlConfig={...S.modal.edlConfig,autres:[...S.modal.edlConfig.autres,'']};render()">+ Ajouter une pièce libre</button>
    <div style="margin-top:16px">
      <button type="button" class="btn btn-p" id="btn-edlconfig-valider" style="width:100%">✓ Valider et commencer l'état des lieux</button>
    </div>`;
  }

  if(m.type==='edl-form'){
    const t=m.tenant||{};
    const edl=m.edl||{};
    const isSortie=m.edlType==='sortie';
    const entreeRef=edl.linkedEntree||null;
    const logFicheE=t.logement?findLogementFiche(t.logement):null;
    // Assurance habitation : bloque la signature (comme les diagnostics sur
    // le bail) tant qu'aucune attestation n'est enregistree pour ce
    // locataire, avec le meme mecanisme de contournement volontaire
    // (case + motif obligatoire, trace dans les observations du document
    // final). Applique aux deux types (entree/sortie) par simplicite : une
    // fois renseignee ou contournee a l'entree, la sortie n'est de toute
    // facon plus bloquee.
    const hasAssurance=!!t.assurance_url;
    const assuranceOverrideChecked=!!edl._assuranceOverride;
    const assuranceOverrideReason=(edl._assuranceOverrideReason||'').trim();
    const canSaveEdl=(!isSortie||!!entreeRef)&&(hasAssurance||(assuranceOverrideChecked&&assuranceOverrideReason));
    const refData=(itemKey)=>entreeRef?(entreeRef.data||{})[itemKey]:null;
    const itemRow=(room,itemKey)=>{
      const key=room.key+'.'+itemKey;
      const domKey=room.key+'-'+itemKey;
      const existing=(edl.data||{})[key]||{};
      const photos=(edl.photos&&edl.photos[key])||[];
      const ref=isSortie?refData(key):null;
      return `<div style="border:0.5px solid var(--border2);border-radius:var(--radius);padding:8px;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="font-size:12px;font-weight:500;min-width:150px">${EDL_ITEM_CATALOG[itemKey]||itemKey}
            ${ref?`<div style="font-size:10px;color:var(--text2);font-weight:400">Entrée : ${ref.etat||'—'}${ref.description?' — '+ref.description:''}</div>`:''}
          </div>
          <select id="edl-etat-${domKey}" style="padding:4px 6px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px">
            <option value="">—</option>
            ${EDL_ETATS.map(e=>`<option value="${e}" ${existing.etat===e?'selected':''}>${e} — ${EDL_ETAT_LABELS[e]}</option>`).join('')}
          </select>
          <button type="button" class="btn btn-sm" onclick="document.getElementById('edl-photofile-${domKey}').click()">📷 <span id="edl-photo-count-${domKey}">${photos.length||''}</span></button>
          <input type="file" accept="image/*" capture="environment" id="edl-photofile-${domKey}" data-edl-photo="${key}" style="display:none">
        </div>
        <input id="edl-desc-${domKey}" value="${(existing.description||'').replace(/"/g,'&quot;')}" placeholder="Description / détails..." style="width:100%;margin-top:6px;padding:4px 6px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px">
        <div id="edl-thumbs-${domKey}" style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">
          ${photos.map(p=>`<img src="${p.url}" style="width:36px;height:36px;object-fit:cover;border-radius:4px;cursor:pointer" onclick="window.open('${p.url}','_blank')">`).join('')}
        </div>
      </div>`;
    };
    html=`${mhd((isSortie?'📋 État des lieux de SORTIE':"📋 État des lieux d'ENTRÉE")+(t.nom?' — '+t.nom:''))}
    ${isSortie&&!entreeRef?`<div class="alert-r">⚠ Aucun état des lieux d'entrée trouvé pour ce locataire — impossible de comparer. Générez d'abord l'état des lieux d'entrée.</div>`:''}
    ${!hasAssurance?`<div class="alert-r" id="edl-assurance-alert">
      ⚠ Aucune attestation d'assurance habitation enregistrée pour ce locataire.
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
        <button type="button" class="btn btn-sm" onclick="document.getElementById('edl-assurance-file').click()">📷 Ajouter l'attestation</button>
        <input type="file" accept="image/*,application/pdf" capture="environment" id="edl-assurance-file" data-assurance-upload="${t.id}" style="display:none">
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:0.5px solid #F7C1C1">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;font-weight:500">
          <input type="checkbox" id="edl-assurance-override" ${assuranceOverrideChecked?'checked':''} onchange="S.modal.edl={...S.modal.edl,_assuranceOverride:this.checked};render()">
          Passer outre volontairement (cas de force majeure)
        </label>
        ${assuranceOverrideChecked?`<div class="form-group" style="margin-top:6px">
          <label style="font-size:11px">Motif (obligatoire — sera indiqué dans les observations)</label>
          <input id="edl-assurance-override-reason" value="${assuranceOverrideReason}" oninput="S.modal.edl={...S.modal.edl,_assuranceOverride:true,_assuranceOverrideReason:this.value};var ok=${(!isSortie||!!entreeRef)?'true':'false'}&&this.value.trim().length>0;var pb=document.getElementById('btn-preview-edl'),sb2=document.getElementById('btn-save-edl');if(pb)pb.disabled=!ok;if(sb2)sb2.disabled=!ok;">
        </div>`:''}
      </div>
    </div>`:''}
    <div class="g2c">
      <div class="form-group"><label>Date</label><input id="edl-date" type="date" value="${edl.date||new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>Logement</label><input value="${t.logement||''}" readonly style="background:var(--bg2)"></div>
    </div>
    <div class="g2c">
      <div class="form-group"><label>Locataire</label><input value="${t.nom||''}" readonly style="background:var(--bg2)">
        ${isSortie?`<input id="edl-nouvelle-adresse" placeholder="Nouvelle adresse (si état des lieux de sortie)" style="width:100%;margin-top:4px">`:''}
      </div>
      <div class="form-group"><label>Bailleur</label><input value="J&A SAVADUR — Antoine JOSSE" readonly style="background:var(--bg2)"></div>
    </div>

    <div class="sec" style="margin:10px 0 6px">🚰 Compteurs et relevés</div>
    <div class="g2c">
      <div class="form-group"><label>Électricité — N° compteur</label><input id="edl-elec-num" value="${edl.compteurs?.elec_num||''}"></div>
      <div class="form-group"><label>Électricité — Relevé</label><input id="edl-elec-releve" value="${edl.compteurs?.elec_releve||''}"></div>
    </div>
    ${logFicheE?.gaz_present!==false?`<div class="g2c">
      <div class="form-group"><label>Gaz — N° compteur</label><input id="edl-gaz-num" value="${edl.compteurs?.gaz_num||''}"></div>
      <div class="form-group"><label>Gaz — Relevé</label><input id="edl-gaz-releve" value="${edl.compteurs?.gaz_releve||''}"></div>
    </div>`:''}
    <div class="g2c">
      <div class="form-group"><label>Eau — Relevé froide (m³)</label><input id="edl-eau-froide" type="number" step="0.001" value="${edl.compteurs?.eau_froide||''}"></div>
      <div class="form-group"><label>Eau — Relevé chaude (m³)</label><input id="edl-eau-chaude" type="number" step="0.001" value="${edl.compteurs?.eau_chaude||''}" ${logFicheE?.eau_chaude==='Collective'?'disabled placeholder="Collective"':''}></div>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:-6px;margin-bottom:10px">Chauffage ${logFicheE?.chauffage||'—'} · Eau chaude ${logFicheE?.eau_chaude||'—'} (depuis la fiche du logement)</div>

    <div class="sec" style="margin:10px 0 6px">🔑 Clés et accès</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
      <div class="form-group"><label>Clés immeuble</label><input id="edl-cles-immeuble" type="number" min="0" value="${edl.cles?.cles_immeuble||0}"></div>
      <div class="form-group"><label>Boîtes aux lettres</label><input id="edl-cles-bal" type="number" min="0" value="${edl.cles?.boites_lettres||0}"></div>
      <div class="form-group"><label>Badge / clé portail</label><input id="edl-cles-badge" type="number" min="0" value="${edl.cles?.badge_portail||0}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
      <div class="form-group"><label>Clés porte d'entrée</label><input id="edl-cles-porte" type="number" min="0" value="${edl.cles?.cles_porte||0}"></div>
      <div class="form-group"><label>Clés cave</label><input id="edl-cles-cave" type="number" min="0" value="${edl.cles?.cles_cave||0}"></div>
      <div class="form-group"><label>Parking</label><input id="edl-cles-parking" type="number" min="0" value="${edl.cles?.parking||0}"></div>
    </div>
    <div class="g2c">
      <div class="form-group"><label>Autre — libellé</label><input id="edl-cles-autre-label" value="${edl.cles?.autre_label||''}"></div>
      <div class="form-group"><label>Autre — nombre</label><input id="edl-cles-autre-nb" type="number" min="0" value="${edl.cles?.autre_nb||0}"></div>
    </div>

    <div class="sec" style="margin:12px 0 6px">🏠 État des pièces</div>
    ${(edl.structure||[]).map(room=>`<div style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;margin-bottom:4px">${room.label}</div>
      ${room.items.map(itemKey=>itemRow(room,itemKey)).join('')}
    </div>`).join('')}

    <div class="form-group"><label>📝 Observations ou réserves</label>
      <textarea id="edl-observations" rows="3" placeholder="Remarques générales, réserves..." style="width:100%;padding:8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;resize:vertical">${edl.observations||''}</textarea>
    </div>

    <div class="sec" style="margin:10px 0 6px">✍ Paraphe et signature</div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">Le paraphe sera reproduit sur toutes les pages du document (et des photos annexées). La signature sera apposée à la fin.</p>
    <div class="g2c">
      <div class="form-group">
        <label>Paraphe du bailleur</label>
        <canvas id="edl-paraphe-bailleur" width="200" height="60" style="border:0.5px solid var(--border2);border-radius:var(--radius);background:#fff;max-width:100%;height:auto;cursor:crosshair;display:block;touch-action:none"></canvas>
        <button type="button" class="btn btn-sm" style="margin-top:4px" onclick="clearSig('edl-paraphe-bailleur')">↺ Effacer</button>
      </div>
      <div class="form-group">
        <label>Paraphe du locataire</label>
        <canvas id="edl-paraphe-locataire" width="200" height="60" style="border:0.5px solid var(--border2);border-radius:var(--radius);background:#fff;max-width:100%;height:auto;cursor:crosshair;display:block;touch-action:none"></canvas>
        <button type="button" class="btn btn-sm" style="margin-top:4px" onclick="clearSig('edl-paraphe-locataire')">↺ Effacer</button>
      </div>
    </div>
    <div class="g2c" style="margin-top:8px">
      <div class="form-group">
        <label>Signature du bailleur</label>
        <canvas id="edl-sig-bailleur" width="200" height="70" style="border:0.5px solid var(--border2);border-radius:var(--radius);background:#fff;max-width:100%;height:auto;cursor:crosshair;display:block;touch-action:none"></canvas>
        <button type="button" class="btn btn-sm" style="margin-top:4px" onclick="clearSig('edl-sig-bailleur')">↺ Effacer</button>
      </div>
      <div class="form-group">
        <label>Signature du locataire</label>
        <canvas id="edl-sig-locataire" width="200" height="70" style="border:0.5px solid var(--border2);border-radius:var(--radius);background:#fff;max-width:100%;height:auto;cursor:crosshair;display:block;touch-action:none"></canvas>
        <button type="button" class="btn btn-sm" style="margin-top:4px" onclick="clearSig('edl-sig-locataire')">↺ Effacer</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button type="button" class="btn btn-sm" id="btn-preview-edl" style="flex:1" ${!canSaveEdl?'disabled':''}>👁 Prévisualiser</button>
      <button type="button" class="btn btn-sm btn-p" id="btn-save-edl" style="flex:1" ${!canSaveEdl?'disabled':''}>✓ Enregistrer l'état des lieux signé</button>
    </div>
    ${mf}`;
  }

  if(m.type==='field-documents'){
    // Version autonome des cartes "Fiche du logement" + "Diagnostics" de
    // topoAssetPanel (Topologie), pour y acceder depuis le mode terrain sans
    // naviguer l'arbre des biens. Reutilise les memes helpers/handlers
    // (findLogementFiche, logementDiagStatus, data-add-bien-doc,
    // data-del-bien-doc, data-edit-logement-fiche) deja cables globalement.
    const t=m.tenant||{};
    const logFicheD=t.logement?findLogementFiche(t.logement):null;
    const diagList=t.logement?logementDiagStatus(t.logement):[];
    html=`${mhd('📄 Documents — '+(t.nom||'')+(t.logement?' — '+t.logement:''))}
    <div class="sec" style="margin-bottom:8px">🏠 Fiche du logement</div>
    ${!logFicheD?`<div class="alert-r">
      ⚠ Fiche du logement non renseignée.
      <button type="button" class="btn btn-sm" style="margin-top:6px" data-edit-logement-fiche="${(t.logement||'').replace(/"/g,'&quot;')}">Renseigner la fiche du logement</button>
    </div>`:`<div style="background:var(--bg2);padding:10px 12px;border-radius:var(--radius);font-size:12px;line-height:1.7;margin-bottom:6px">
      ${logFicheD.adresse||t.logement}${logFicheD.appt?', '+logFicheD.appt:''}${logFicheD.etage?' · '+logFicheD.etage:''}<br>
      ${logFicheD.type_logement?logFicheD.type_logement+' · ':''}${logFicheD.type_habitat||'—'} · ${logFicheD.regime||'—'}<br>
      ${logFicheD.surface?logFicheD.surface+' m²':'Surface —'} · ${logFicheD.nb_pieces||'—'} pièce(s) · Chauffage ${logFicheD.chauffage||'—'} · Eau chaude ${logFicheD.eau_chaude||'—'}<br>
      Gaz : ${logFicheD.gaz_present===true?'Oui':logFicheD.gaz_present===false?'Non':'Inconnu'}
    </div>
    <button type="button" class="btn btn-sm" style="margin-bottom:6px" data-edit-logement-fiche="${(t.logement||'').replace(/"/g,'&quot;')}">✎ Modifier</button>`}

    <div class="sec" style="margin-top:12px;margin-bottom:8px">📎 Diagnostics</div>
    <div style="margin-bottom:6px">
      ${diagList.map(d=>`<div class="row">
        <div class="fg"><div class="fgs" style="font-size:12px${d.missing||d.expired?';color:var(--red)':''}">${d.label}${d.missing?' <span class="badge bred" style="font-size:9px">Manquant</span>':d.expired?' <span class="badge bred" style="font-size:9px">Expiré</span>':' <span class="badge bgreen" style="font-size:9px">Valide</span>'}</div>
        ${d.doc?`<div class="fgsub">${dateLabel(d.doc.date)}${d.doc.date_expiry?' · expire '+dateLabel(d.doc.date_expiry):''}</div>`:''}</div>
        ${d.doc?.document_url?`<a href="${d.doc.document_url}" target="_blank" class="btn btn-sm">👁 Voir</a>`:''}
        ${d.doc?`<button type="button" class="btn btn-d btn-sm" data-del-bien-doc="${d.doc.id}">✕</button>`:''}
      </div>`).join('')}
    </div>
    <button type="button" class="btn btn-sm btn-p" data-add-bien-doc="${(t.logement||'').replace(/"/g,'&quot;')}">+ Ajouter un document</button>

    <div class="sec" style="margin-top:16px;margin-bottom:8px">🪪 Pièces d'identité <span style="font-size:11px;color:var(--text2);text-transform:none;font-weight:400">(locataire(s) et garant, plusieurs photos possibles)</span></div>
    <div id="identite-photos-list" style="margin-bottom:6px">
      ${(t.identite_photos||[]).map(p=>identitePhotoRowHtml(t.id,p)).join('')}
    </div>
    <button type="button" class="btn btn-sm btn-p" onclick="document.getElementById('identite-photofile').click()">📷 Ajouter une photo</button>
    <input type="file" accept="image/*" capture="environment" id="identite-photofile" data-identite-upload="${t.id}" style="display:none">

    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" id="mc2">Fermer</button></div>`;
  }

  if(m.type==='bail-form'){
    const t=m.tenant||{};
    // Les caracteristiques fixes du logement et les diagnostics ne sont plus
    // ressaisis ici : ils viennent de la fiche du bien/zone (Topologie),
    // seule source pour ces informations, communes a tous les locataires
    // successifs de ce meme logement. Ce formulaire n'edite plus que ce qui
    // est propre a CE bail (locataire, conditions financieres, duree).
    const logFicheB=t.logement?findLogementFiche(t.logement):null;
    const diagStatusList=t.logement?logementDiagStatus(t.logement):[];
    const missingOrExpired=diagStatusList.filter(d=>d.missing||d.expired);
    const bailPrev=m.bail||{};
    const overrideChecked=!!bailPrev._diagOverride;
    const overrideReason=(bailPrev._diagOverrideReason||'').trim();
    const canGenerate=!!logFicheB&&(missingOrExpired.length===0||(overrideChecked&&overrideReason));
    // Si un brouillon (ou un bail deja signe, pour amendement) existe deja
    // pour ce locataire, on repart de tenant.bail_data plutot que de
    // champs vides - collectBailFormData() y a deja tout ecrit par le
    // passe, donc rouvrir ce formulaire ne fait jamais ressaisir ce qui a
    // deja ete prepare. Seuls les paraphes/signatures ne sont jamais
    // repris (on veut toujours un nouveau tracé physique).
    const bail=m.bail||t.bail_data||{
      type_bail:t.type_bail||'habitation',
      loyer_ref:t.loyer_ref||0,
      charges:t.charges||0,
      caution:t.caution||0,
      date_entree:t.date_entree||'',
      duree:t.type_bail==='commercial'?'9 ans':'3 ans',
    };
    const isDraftPending=!!t.bail_data&&!t.bail_url;
    html=`${mhd('📝 Générer le bail'+(t.nom?' — '+t.nom:''))}
    ${isDraftPending?`<div style="font-size:12px;background:var(--bg2);color:var(--text2);padding:8px 10px;border-radius:var(--radius);margin-bottom:10px">📝 Brouillon enregistré — prêt à être signé.</div>`:''}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button type="button" class="btn btn-sm ${bail.type_bail!=='commercial'?'btn-p':''}" onclick="S.modal.bail={...S.modal.bail,type_bail:'habitation'};render()">Habitation (loi Alur)</button>
      <button type="button" class="btn btn-sm ${bail.type_bail==='commercial'?'btn-p':''}" onclick="S.modal.bail={...S.modal.bail,type_bail:'commercial'};render()">Commercial</button>
    </div>

    <div class="sec" style="margin-bottom:8px">🏠 Le logement <span style="font-size:11px;color:var(--text2);text-transform:none;font-weight:400">(fiche du bien — Topologie)</span></div>
    ${!logFicheB?`<div class="alert-r">

function closeModal(){S.modal=null;render();}

function findTopoNode(id){
  for(const p of (S.topology.properties||[])){
    if(p.id===id)return{type:'prop',obj:p};
    for(const t of (p.trades||[])){
      if(t.id===id)return{type:'trade',obj:t};
      for(const z of (t.children||[])){if(z.id===id)return{type:'zone',obj:z};}
    }
  }
  return null;
}

async function saveTopoToDB(){
  // Safety guard: never overwrite with empty data
  if(!S.topoId){console.warn('saveTopoToDB: topoId manquant, sauvegarde annulée');return;}
  if(!S.topology?.properties?.length){console.warn('saveTopoToDB: topology vide, sauvegarde annulée');return;}
  await sb.from('topology').update({data: S.topology, updated_at: new Date().toISOString()}).eq('id', S.topoId);
}

async function saveModal(){
  const q = id => document.getElementById(id);
  const m = S.modal;
  if(!m)return;

  if(m.type==='add-prop'){
    const name=q('m-pn')?.value.trim();if(!name)return alert('Nom requis');
    const newProp={id:uid(),name,zones:[]};
    S.topology.properties=[...(S.topology.properties||[]),newProp];
    S.topoState.propId=newProp.id;S.topoState.zoneId=null;S.topoState.subZoneId=null;S.topoState.tradeId=null;
    await saveTopoToDB();
  }

  if(m.type==='add-zone'){
    const name=q('m-zn')?.value.trim();if(!name)return alert('Nom requis');
    const prop=S.topology.properties.find(p=>p.id===m.propId);if(!prop)return alert('Bien introuvable');
    const newZone={id:uid(),name,subZones:[],trades:[]};
    prop.zones=[...(prop.zones||[]),newZone];
    S.topoState.zoneId=newZone.id;S.topoState.subZoneId=null;S.topoState.tradeId=null;
    await saveTopoToDB();
  }

  if(m.type==='add-subzone'){
    const name=q('m-szn')?.value.trim();if(!name)return alert('Nom requis');
    const prop=S.topology.properties.find(p=>p.zones?.some(z=>z.id===m.zoneId));
    const zone=prop?.zones?.find(z=>z.id===m.zoneId);if(!zone)return alert('Zone introuvable');
    const newSub={id:uid(),name,trades:[]};
    zone.subZones=[...(zone.subZones||[]),newSub];
    S.topoState.subZoneId=newSub.id;S.topoState.tradeId=null;
    await saveTopoToDB();
  }

  if(m.type==='add-trade'){
    const name=q('m-ttn')?.value.trim();if(!name)return alert('Nom requis');
    const icon=q('m-tti')?.value.trim()||'';
    const prop=S.topology.properties.find(p=>p.zones?.some(z=>z.id===m.zoneId));
    const zone=prop?.zones?.find(z=>z.id===m.zoneId);if(!zone)return alert('Zone introuvable');
    const newTrade={id:uid(),name,icon,items:[]};
    if(m.subZoneId){
      const sub=zone.subZones?.find(s=>s.id===m.subZoneId);if(!sub)return alert('Sous-zone introuvable');
      sub.trades=[...(sub.trades||[]),newTrade];
    }else{
      zone.trades=[...(zone.trades||[]),newTrade];
    }
    S.topoState.tradeId=newTrade.id;
    await saveTopoToDB();
  }

  if(m.type==='add-topo-item'){
    const name=q('m-tin')?.value.trim();if(!name)return alert('Nom requis');
    const notes=q('m-tinotes')?.value.trim()||'';
    const ts=S.topoState;
    const prop=S.topology.properties.find(p=>p.id===ts.propId);
    const zone=prop?.zones?.find(z=>z.id===ts.zoneId);
    let trade=null;
    if(ts.subZoneId){const sub=zone?.subZones?.find(s=>s.id===ts.subZoneId);trade=sub?.trades?.find(t=>t.id===ts.tradeId);}
    else{trade=zone?.trades?.find(t=>t.id===ts.tradeId);}
    if(!trade)return alert('Corps de métier introuvable');
    trade.items=[...(trade.items||[]),{id:uid(),name,notes}];
    await saveTopoToDB();
  }

  if(m.type==='edit-wo'){
    const w=m.wo;
    const title=q('m-wt')?.value.trim();if(!title)return alert('Titre requis');
    const newNote=q('m-wjnote')?.value?.trim();
    const journal=[...(w.journal||[])];
    if(newNote){journal.push({id:uid(),date:new Date().toLocaleDateString('fr-FR')+' '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),by:S.currentUser?.name||'—',note:newNote});}
    const topoVal=q('m-wtopo')?.value||'';
    let topoRef=w.topo_ref||null;
    if(topoVal.startsWith('prop_')){const pId=topoVal.replace('prop_','');const p=S.topology.properties.find(x=>x.id===pId);topoRef=p?{propId:pId,propName:p.name,zoneId:null,zoneName:'',subId:null,subName:''}:null;}
    else if(topoVal.startsWith('zone_')){const [,pId,zId]=topoVal.split('_');const p=S.topology.properties.find(x=>x.id===pId);const z=p?.zones?.find(x=>x.id===zId);topoRef=z?{propId:pId,propName:p.name,zoneId:zId,zoneName:z.name,subId:null,subName:''}:null;}
    else if(topoVal.startsWith('sub_')){const [,pId,zId,sId]=topoVal.split('_');const p=S.topology.properties.find(x=>x.id===pId);const z=p?.zones?.find(x=>x.id===zId);const s=z?.subZones?.find(x=>x.id===sId);topoRef=s?{propId:pId,propName:p.name,zoneId:zId,zoneName:z.name,subId:sId,subName:s.name}:null;}
    else if(topoVal===''){topoRef=null;}
    const assetId=q('m-wasset')?.value||null;
    const bySel=q('m-wby-sel');
    const byUser=bySel&&bySel.value&&bySel.value!=='__autre__'?bySel.value:q('m-wby')?.value||w.by_user||'';
    const checklist=w.checklist||[];
    const upd={title,description:q('m-wd')?.value,category:q('m-wc')?.value,
      status:q('m-wstatus')?.value,date:q('m-wdate')?.value,
      cost:parseFloat(q('m-wcost')?.value)||0,
      devis_montant:q('m-wdevis')?.value?parseFloat(q('m-wdevis').value):null,
      chantier_id:q('m-wchantier')?.value||null,
      paid:q('m-wpaid')?.checked||false,
      alert_days:q('m-walert-on')?.checked?(parseInt(q('m-walert-days')?.value)||7):(w.alert_days||null),
      by_user:byUser,asset_id:assetId||w.asset_id,topo_ref:topoRef,journal,checklist};

      const {error}=await sb.from('famille').update({contrat_ecole:upd}).eq('id',membId);
      if(error){alert('Erreur : '+error.message);return;}
      mb.contrat_ecole=upd;
    }
    S.familleEnfant=membId;
  }

  if(m.type==='link-devis-bt'){
    const woId=q('m-ldb-wo')?.value||'';
    if(!woId)return alert('Sélectionnez un bon de travaux');
    const{error}=await sb.from('devis').update({wo_id:woId,chantier_id:null}).eq('id',m.devisId);
    if(error){alert('Erreur : '+error.message);return;}
    const d=S.devis.find(x=>x.id===m.devisId);
    if(d){d.wo_id=woId;d.chantier_id=null;}
  }

  if(m.type==='logement-fiche-form'){
    // Reutilise l'orthographe EXACTE deja enregistree pour ce logement si une
    // fiche existe deja (bien.tenant utilise un tiret cadratin, bien.topologie
    // un tiret simple - findLogementFiche compare en normalisant, mais
    // l'upsert lui doit cibler la meme valeur litterale que celle deja en
    // base, sinon onConflict:'bien' cree une 2e ligne au lieu de mettre a
    // jour la premiere).
    const existingFiche=findLogementFiche(m.bien);
    const targetBien=existingFiche?.bien||m.bien;
    const qv=id=>document.getElementById(id)?.value||'';
    const rec={
      bien:targetBien,
      adresse:qv('lf-adresse'),appt:qv('lf-appt'),type_logement:qv('lf-type-logement'),etage:qv('lf-etage'),annexes:qv('lf-annexes'),
      type_habitat:qv('lf-type-habitat'),regime:qv('lf-regime'),periode_construction:qv('lf-periode'),
      nb_pieces:parseInt(qv('lf-nb-pieces'))||null,surface:parseFloat(qv('lf-surface'))||null,
      chauffage:qv('lf-chauffage'),eau_chaude:qv('lf-eau-chaude'),
      gaz_present:qv('lf-gaz-present')===''?null:qv('lf-gaz-present')==='true',
      equipements:qv('lf-equipements'),parties_communes:qv('lf-parties-communes'),tic:qv('lf-tic'),
      updated_at:new Date().toISOString(),
    };
    const{data,error}=await sb.from('logement_fiches').upsert(rec,{onConflict:'bien'}).select().single();
    if(error){alert('Erreur : '+error.message);return;}
    const idx=S.logementFiches.findIndex(f=>f.bien===targetBien);
    if(idx>=0)S.logementFiches[idx]=data;else S.logementFiches.push(data);
  }

  if(m.type==='regul-tf'){
    const t=S.tenants.find(x=>x.id===m.tenantId);
    if(!t)return;
    const due=tfRegulStatus(t)||m.due;
    if(!due)return alert('Régularisation introuvable (données modifiées entre-temps)');
    const augHT=parseFloat(q('m-tf-aug')?.value);
    const regulHT=parseFloat(q('m-tf-regul')?.value);
    const nbMois=parseFloat(q('m-tf-mois')?.value)||12;
    if(isNaN(augHT)||isNaN(regulHT))return alert('Montants requis');
    const monthlyHT=Math.round((due.augmentationAnnuelleHT/12)*100)/100;
    const augTTC=Math.round(augHT*1.2*100)/100;
    const regulTTC=Math.round(regulHT*1.2*100)/100;
    const totalTTC=Math.round((augTTC+regulTTC)*100)/100;
    const rec={
      tenant_id:t.id,annee:due.annee,tf_annee:due.tfAnnee,tf_annee_precedente:due.tfPrecedente,
      augmentation_annuelle_ht:due.augmentationAnnuelleHT,nb_mois_augmentation:nbMois,
      augmentation_ht:augHT,augmentation_ttc:augTTC,regul_mois_ht:regulHT,regul_mois_ttc:regulTTC,total_ttc:totalTTC
    };
    const{data,error}=await sb.from('tf_regularisations').insert(rec).select().single();
    if(error){alert('Erreur enregistrement régularisation : '+error.message);return;}
    S.tfRegularisations=[data,...(S.tfRegularisations||[])];
    const newCharges=Math.round(((t.charges||0)+monthlyHT)*100)/100;
    const{error:updErr}=await sb.from('tenants').update({charges:newCharges,tf_dernier_regul_annee:due.annee}).eq('id',t.id);
    if(updErr){alert('Régularisation enregistrée, mais erreur de mise à jour de la charge mensuelle : '+updErr.message);}
    else{t.charges=newCharges;t.tf_dernier_regul_annee=due.annee;}
    genRegulTFPDF(t,due,{augHT,augTTC,regulHT,regulTTC,totalTTC,nbMois});
  }

  closeModal();
  render();
}

function updateTenantZonesFull(existingZone,existingSub){
  const sel=document.getElementById('m-tprop');
  const wrap=document.getElementById('m-tzone-wrap');
  const zsel=document.getElementById('m-tzone');
  const swrap=document.getElementById('m-tsub-wrap');
  const ssel=document.getElementById('m-tsub');
  if(!sel||!wrap||!zsel)return;
  const pname=sel.value;
  if(!pname){wrap.style.display='none';if(swrap)swrap.style.display='none';_updateLogementPreview();return;}
  const p=S.topology.properties.find(x=>x.name===pname)||
          S.topology.properties.find(x=>x.name.toLowerCase()===pname.toLowerCase().trim());
  const zones=p?(p.zones||[]):[];
  if(zones.length){
    zsel.innerHTML='<option value="">— Aucune zone —</option>'+
      zones.map(z=>'<option value="'+z.name+'" '+(z.name===existingZone?'selected':'')+'>'+z.name+'</option>').join('');
    wrap.style.display='';
  }else{
    wrap.style.display='none';
    zsel.innerHTML='';
  }
  // Sous-zones
  const selectedZone=existingZone||'';
  const z=p?.zones?.find(x=>x.name===selectedZone);
  const subs=z?(z.subZones||[]):[];
  if(ssel&&swrap){
    if(subs.length){
      ssel.innerHTML='<option value="">— Aucune sous-zone —</option>'+
        subs.map(s=>'<option value="'+s.name+'" '+(s.name===existingSub?'selected':'')+'>'+s.name+'</option>').join('');
      swrap.style.display='';
    }else{
      swrap.style.display='none';
      ssel.innerHTML='';
    }
  }
  _updateLogementPreview();
}

// Upload d'un document/diagnostic depuis la fiche du bien (formulaire
// "+ Document") - stocke dans le meme bucket que les documents locataires,
// sous un chemin propre au bien plutot qu'a un locataire (ces documents
// sont desormais rattaches au logement, independamment de qui l'occupe).
async function uploadBienDocFile(bien,fileInput){
  const file=fileInput.files?.[0];
  if(!file)return;
  const statusEl=document.getElementById('m-bdocfile-status');
  if(statusEl)statusEl.textContent='⏳ Envoi...';
  const slug=sanitizeFolderName(bien).replace(/\s+/g,'_');
  const ext=(file.name.split('.').pop()||'pdf').toLowerCase();
  const path='biens/'+slug+'/'+Date.now()+'.'+ext;
  const{error}=await sb.storage.from('documents-locataires').upload(path,file,{contentType:file.type||'application/pdf',cacheControl:'0'});
  if(error){if(statusEl)statusEl.textContent='';alert('Erreur upload : '+error.message);return;}
  const{data:pub}=sb.storage.from('documents-locataires').getPublicUrl(path);
  const freshUrl=pub.publicUrl+'?v='+Date.now();
  const urlInput=document.getElementById('m-bdocurl');
  if(urlInput)urlInput.value=freshUrl;
  if(statusEl)statusEl.innerHTML='✓ <a href="'+freshUrl+'" target="_blank">Voir le fichier</a>';
}

// Meme nettoyage de nom que cote Python (import_factures.py) pour un chemin
// de stockage lisible et sans caracteres interdits.
// Supabase Storage rejette les cles contenant des caracteres non-ASCII (les
// accents comme "è" font echouer l'upload avec "Invalid key"), contrairement
// a un nom de fichier Windows classique qui les tolere - on les retire en
// plus du nettoyage habituel.
function sanitizeFolderName(name){
  const noAccents=(name||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
  // Ceinture et bretelles : au-dela des accents, ne garde que les caracteres
  // surs pour une cle Supabase Storage (alphanumerique + quelques signes),
  // le reste (apostrophes typographiques, esperluettes...) devient "_".
  return noAccents.replace(/[^a-zA-Z0-9 _.\-]/g,'_').trim();
}

    loc_nom:q('bail-loc-nom'),loc_nais:q('bail-loc-nais'),loc_lieu_nais:q('bail-loc-lieu-nais'),loc_natio:q('bail-loc-natio'),
    loc_email:q('bail-loc-email'),loc_tel:q('bail-loc-tel'),loc_adr:q('bail-loc-adr'),
    gar_nom:q('bail-gar-nom'),gar_lien:q('bail-gar-lien'),gar_adr:q('bail-gar-adr'),
    loyer_ref:parseFloat(q('bail-loyer'))||0,charges:parseFloat(q('bail-charges'))||0,
    caution:parseFloat(q('bail-caution'))||0,
    jour_paiement:q('bail-jour-paiement'),lieu_paiement:q('bail-lieu-paiement'),
    date_entree:q('bail-date-entree'),duree:q('bail-duree'),lieu_sig:q('bail-lieu-sig'),
    charges_modalite:q('bail-charges-modalite'),charges_detail:q('bail-charges-detail'),
    date_revision:q('bail-date-revision'),irl_trimestre:q('bail-irl-trimestre'),travaux:q('bail-travaux'),
  };
  // Diagnostics obligatoires, tires de la fiche du bien (bien_documents) -
  // seuls les encore valides sont repris. Ceux manquants/perimes malgre le
  // contournement volontaire sont listes a part avec leur motif, pour
  // laisser une trace explicite dans le bail signe.
  if(t.logement){
    logementDiagStatus(t.logement).forEach(d=>{
      if(d.doc&&!d.expired)out['diag_'+d.key]={url:d.doc.document_url,date:d.doc.date};
    });
    if(bail._diagOverride&&bail._diagOverrideReason){
      out.diag_override_reason=bail._diagOverrideReason;
      out.diag_override_list=logementDiagStatus(t.logement).filter(d=>d.missing||d.expired).map(d=>d.label);
    }
  }
  out.paraphe_bailleur=sigDataUrl('bail-paraphe-bailleur');
  out.paraphe_locataire=sigDataUrl('bail-paraphe-locataire');
  out.sig_bailleur=sigDataUrl('bail-sig-bailleur');
  out.sig_locataire=sigDataUrl('bail-sig-locataire');
  out.paraphe_garant=sigDataUrl('bail-paraphe-garant');
  out.sig_garant=sigDataUrl('bail-sig-garant');
  return out;
}

// Genere le bail en PDF reel (jsPDF) avec pagination automatique, le
// paraphe des 2 parties reproduit sur CHAQUE page, et les signatures sur la
// derniere page - contrairement a un simple apercu HTML/print, jsPDF donne
// un controle exact du decoupage en pages necessaire pour ce tamponnage.
function genBailPDF(bail,tenant){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const pageW=210,pageH=297,marginX=20,marginTop=20,marginBottom=25;
  let y=marginTop;
  const fmt=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
  const dl=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
  const isComm=bail.type_bail==='commercial';

  function ensureSpace(h){
    if(y+h>pageH-marginBottom){doc.addPage();y=marginTop;}
  }
  function title(txt){
    ensureSpace(12);
    doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text(txt,marginX,y);y+=8;
    doc.setFont('helvetica','normal');doc.setFontSize(10);
  }
  function para(txt){
    const lines=doc.splitTextToSize(txt,pageW-2*marginX);
    lines.forEach(line=>{ensureSpace(5.5);doc.text(line,marginX,y);y+=5.5;});
    y+=2;
  }

  // Logo J&A SAVADUR uniquement sur les baux geres par cette entite (meme
  // detection que pour les quittances/factures loyer : nom du logement).
  // Pleine largeur de page (comme sur les documents HTML) : en plus petit,
  // le texte (adresse/tel/email) imprime dans le logo devient illisible.
  if(dubailFilter(tenant?.logement||bail.adresse||'')){
    const logoW=pageW-2*marginX,logoH=logoW*159/605;
    doc.addImage(LOGO_SAVADUR_B64,'PNG',marginX,y,logoW,logoH);
    y+=logoH+6;
  }

  doc.setFont('helvetica','bold');doc.setFontSize(16);
  doc.text(isComm?'BAIL COMMERCIAL':'CONTRAT DE LOCATION (loi du 6 juillet 1989)',pageW/2,y,{align:'center'});
  y+=12;
  doc.setFont('helvetica','normal');doc.setFontSize(10);

  const diagPresent=Object.keys(DIAG_LABELS).filter(k=>bail['diag_'+k]?.url&&!diagIsExpired(bail['diag_'+k].date,k));

  title('I. Désignation des parties');
  para('Le bailleur : '+(bail.bailleur_nom||'—')+(bail.bailleur_rep?', représenté par '+bail.bailleur_rep:'')+', domicilié '+(bail.bailleur_adr||'—')+'.');
  para('Le locataire : '+(bail.loc_nom||'—')+(bail.loc_nais?', né(e) le '+dl(bail.loc_nais)+(bail.loc_lieu_nais?' à '+bail.loc_lieu_nais:''):'')+(bail.loc_natio?', de nationalité '+bail.loc_natio:'')+', demeurant actuellement '+(bail.loc_adr||'—')+'.');
  if(bail.gar_nom){
    para('Le garant : '+bail.gar_nom+(bail.gar_lien?' ('+bail.gar_lien+')':'')+', domicilié '+(bail.gar_adr||'—')+', qui se porte caution solidaire du présent contrat.');
  }
  para('Il a été convenu ce qui suit :');

  title('II. Objet du contrat');
  para('A. Consistance du logement');
  para('Localisation : '+(bail.adresse||'—')+(bail.appt?', '+bail.appt:'')+(bail.etage?', '+bail.etage:'')+'.');
  if(!isComm){
    para("Type d'habitat : "+(bail.type_habitat||'—')+'. Régime juridique de l\'immeuble : '+(bail.regime||'—')+'. Période de construction : '+(bail.periode_construction||'—')+'.');
    para('Surface habitable : '+(bail.surface?bail.surface+' m²':'—')+'. Nombre de pièces principales : '+(bail.nb_pieces||'—')+'.');
    if(bail.equipements)para("Éléments d'équipement du logement : "+bail.equipements+'.');
    para('Modalité de production de chauffage : '+(bail.chauffage||'—')+'. Modalité de production d\'eau chaude sanitaire : '+(bail.eau_chaude||'—')+'.');
  }
  para('B. Destination des locaux : '+(isComm?'usage commercial':'usage exclusif d\'habitation')+'.');
  para('C. Locaux et équipements accessoires à usage privatif du locataire : '+(bail.annexes||'aucun')+'.');
  if(!isComm&&bail.parties_communes)para('D. Parties, équipements et accessoires à usage commun de l\'immeuble : '+bail.parties_communes+'.');
  if(!isComm&&bail.tic)para('E. Équipement d\'accès aux technologies de l\'information et de la communication : '+bail.tic+'.');

  title('III. Date de prise d\'effet et durée du contrat');
  para('A. Date de prise d\'effet du contrat : '+dl(bail.date_entree)+'.');
  para('B. Durée du contrat : '+(bail.duree||'—')+'.');
  para("En l'absence de proposition de renouvellement du contrat, celui-ci est, à son terme, reconduit tacitement pour la même durée et dans les mêmes conditions. Le locataire peut mettre fin au bail à tout moment, après avoir donné congé dans les conditions légales. Le bailleur peut mettre fin au bail à son échéance, après avoir donné congé, pour reprendre le logement en vue de l'occuper lui-même ou une personne de sa famille, pour le vendre, ou pour un motif sérieux et légitime.");

  title('IV. Conditions financières');

  if(!isComm&&(bail.date_revision||bail.irl_trimestre)){

  para('B. Charges récupérables — Modalité de règlement : '+(bail.charges_modalite||'—')+'. Montant mensuel : '+fmt(bail.charges)+(bail.charges_detail?' ('+bail.charges_detail+')':'')+'.');

  if(!isComm&&bail.travaux){

  }

  title('VI. Garanties');
  para('Dépôt de garantie versé à la signature : '+fmt(bail.caution)+', restitué dans les conditions légales après établissement de l\'état des lieux de sortie, déduction faite le cas échéant des sommes restant dues au bailleur.');

  if(!isComm){
    title('VII. Clause de solidarité');
    para("En cas de pluralité de locataires, ceux-ci sont tenus conjointement, solidairement et indivisiblement à l'égard du bailleur au paiement des loyers, charges et accessoires dus en application du présent bail. La solidarité d'un locataire sortant et celle de sa caution prennent fin à la date d'effet du congé régulièrement délivré et lorsqu'un nouveau colocataire figure au bail ; à défaut, elle s'éteint au plus tard six mois après la date d'effet du congé.");

    title('VIII. Clause résolutoire');
    para("Le bail sera résilié de plein droit en cas d'inexécution des obligations du locataire, notamment en cas de défaut de paiement des loyers, charges ou dépôt de garantie, de défaut d'assurance du locataire contre les risques locatifs, ou de troubles de voisinage constatés par une décision de justice définitive. Le bailleur doit préalablement faire délivrer un commandement de payer ou de faire, resté infructueux pendant le délai légal, avant de pouvoir faire constater judiciairement l'acquisition de la clause résolutoire.");

    title('IX. Honoraires de location');
    para("Le présent contrat est conclu directement entre le bailleur et le locataire, sans intermédiaire mandaté : aucun honoraire de location n'est dû à ce titre.");
  }

  title((isComm?'VII':'X')+'. Obligations des parties');
  para("Le locataire s'engage à payer le loyer et les charges aux termes convenus, à user paisiblement des locaux loués, à répondre des dégradations survenues pendant la durée du contrat, à s'assurer contre les risques locatifs et à en justifier à la demande du bailleur, et à ne céder ni sous-louer le logement sans l'accord écrit du bailleur.");
  para("Le bailleur s'engage à délivrer un logement décent et en bon état d'usage, à assurer au locataire une jouissance paisible du logement, et à entretenir les locaux en état de servir à l'usage prévu.");

  title((isComm?'VIII':'XI')+'. Annexes');

  para('- Un dossier de diagnostic technique'+(diagPresent.length?' comprenant :':' (à joindre).'));
  diagPresent.forEach(k=>para('  • '+DIAG_LABELS[k]+(bail['diag_'+k].date?' (établi le '+dl(bail['diag_'+k].date)+')':'')+' — disponible dans GMAO Pro.'));
  if(bail.diag_override_reason&&bail.diag_override_list?.length){

    para('Motif : '+bail.diag_override_reason+'.');
  }
  if(!isComm)para('- Une notice d\'information relative aux droits et obligations des locataires et des bailleurs.');
  para('- Un état des lieux d\'entrée, établi lors de la remise des clés.');
  if(bail.gar_nom)para('- Un acte de cautionnement solidaire signé par le garant.');

  title('Fait à '+(bail.lieu_sig||'—')+', le '+new Date().toLocaleDateString('fr-FR'));
  para("Chaque partie reconnaît avoir lu et accepté les termes du présent contrat et de ses annexes, en foi de quoi elle appose son paraphe sur chaque page et sa signature ci-dessous.");
  ensureSpace(45);
  const sigY=y+8;

  const sigW=hasGarantSig?50:55;
  const xBailleur=marginX,xLocataire=pageW-marginX-sigW,xGarant=pageW/2-sigW/2;
  if(bail.sig_bailleur){doc.addImage(bail.sig_bailleur,'PNG',xBailleur,sigY,sigW,25);}

  if(hasGarantSig&&bail.sig_garant){doc.addImage(bail.sig_garant,'PNG',xGarant,sigY,sigW,25);}

  // Le paraphe et la numerotation des pages sont apposes apres fusion avec
  // les diagnostics (voir mergeBailWithDiagnostics), pas ici : le nombre de
  // pages final n'est connu qu'une fois les annexes ajoutees, et on evite
  // ainsi de tamponner deux fois les pages du bail lui-meme.
  return doc;
}

// Fusionne le bail (genere par jsPDF) avec les diagnostics encore valides
// deja televerses (PDF ou image) en un seul document continu, une page de
// garde par annexe pour la retrouver facilement, puis appose le paraphe des
// 2 parties et la numerotation sur TOUTES les pages du resultat (bail +
// annexes) - le locataire doit avoir paraphe l'ensemble du dossier, pas
// seulement le corps du bail. Les diagnostics perimes ne sont jamais inclus
// dans le document signe (mais restent visibles, en rouge, dans le
// formulaire pour rappel de renouvellement).
async function mergeBailWithDiagnostics(jsDoc,bail){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const finalDoc=await PDFDocument.load(jsDoc.output('arraybuffer'));
  const font=await finalDoc.embedFont(StandardFonts.HelveticaBold);
  const A4=[595.28,841.89];

  const diagPresent=Object.keys(DIAG_LABELS).filter(k=>bail['diag_'+k]?.url&&!diagIsExpired(bail['diag_'+k].date,k));
  for(const k of diagPresent){
    const url=bail['diag_'+k].url;
    try{
      const resp=await fetch(url);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      const bytes=new Uint8Array(await resp.arrayBuffer());
      const ct=resp.headers.get('content-type')||'';
      const cover=finalDoc.addPage(A4);
      cover.drawText('ANNEXE — '+DIAG_LABELS[k],{x:50,y:780,size:16,font,color:rgb(0.1,0.1,0.1)});
      if(ct.includes('pdf')||url.toLowerCase().includes('.pdf')){
        const srcDoc=await PDFDocument.load(bytes,{ignoreEncryption:true});
        const pages=await finalDoc.copyPages(srcDoc,srcDoc.getPageIndices());
        pages.forEach(p=>finalDoc.addPage(p));
      }else{
        const isPng=ct.includes('png')||url.toLowerCase().includes('.png');
        const img=isPng?await finalDoc.embedPng(bytes):await finalDoc.embedJpg(bytes);
        const page=finalDoc.addPage(A4);
        const scale=Math.min((A4[0]-80)/img.width,(A4[1]-160)/img.height,1);
        page.drawImage(img,{x:40,y:60,width:img.width*scale,height:img.height*scale});
      }
    }catch(e){console.warn('Annexe '+k+' non incluse dans le PDF final :',e.message);}
  }

  const parB=bail.paraphe_bailleur?await finalDoc.embedPng(dataUrlToUint8(bail.paraphe_bailleur)):null;
  const parL=bail.paraphe_locataire?await finalDoc.embedPng(dataUrlToUint8(bail.paraphe_locataire)):null;
  const parG=bail.gar_nom&&bail.paraphe_garant?await finalDoc.embedPng(dataUrlToUint8(bail.paraphe_garant)):null;
  const pages=finalDoc.getPages();
  pages.forEach((page,i)=>{
    const {width}=page.getSize();
    if(parB)page.drawImage(parB,{x:20,y:12,width:56,height:20});
    if(parL)page.drawImage(parL,{x:width-76,y:12,width:56,height:20});
    if(parG)page.drawImage(parG,{x:width/2-28,y:34,width:56,height:20});
    page.drawText('Page '+(i+1)+'/'+pages.length,{x:width/2-20,y:14,size:8,font,color:rgb(0.6,0.6,0.6)});
  });

  return finalDoc.save();
}
// Decode une image data URL (canvas.toDataURL) en octets bruts pour pdf-lib,
// qui n'accepte pas directement les data URL contrairement a jsPDF.
function dataUrlToUint8(dataUrl){
  const base64=dataUrl.split(',')[1];
  const bin=atob(base64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}

// Upload immediat d'une photo d'element d'etat des lieux (contrairement au
// paraphe/signature qui restent en memoire jusqu'a l'enregistrement final) -
// evite de perdre les photos deja prises si la tablette est interrompue en
// cours de visite. S.modal.edl.id est genere des l'ouverture du formulaire
// (avant tout enregistrement en base) pour que le chemin de stockage soit
// stable du debut a la fin.
async function uploadEdlPhoto(edlId,roomKey,itemKey,fileInput){
  const file=fileInput.files?.[0];
  if(!file)return;
  const key=roomKey+'.'+itemKey;
  const domKey=roomKey+'-'+itemKey;
  if(!S.modal.edl.photos)S.modal.edl.photos={};
  if(!S.modal.edl.photos[key])S.modal.edl.photos[key]=[];
  const idx=S.modal.edl.photos[key].length;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path='edl/'+edlId+'/'+roomKey+'_'+itemKey+'_'+(idx+1)+'.'+ext;
  const{error}=await sb.storage.from('documents-locataires').upload(path,file,{contentType:file.type||'image/jpeg',cacheControl:'0'});
  if(error){alert('Erreur photo : '+error.message);return;}
  const{data:pub}=sb.storage.from('documents-locataires').getPublicUrl(path);
  const freshUrl=pub.publicUrl+'?v='+Date.now();
  S.modal.edl.photos[key].push({url:freshUrl,path});
  // Mise a jour directe du DOM plutot qu'un render() complet : un re-rendu
  // recreerait les canvas de paraphe/signature (voir dataset.sigInit) et
  // effacerait tout trait deja dessine si l'on prend une photo apres avoir
  // signe.
  const countEl=document.getElementById('edl-photo-count-'+domKey);
  if(countEl)countEl.textContent=S.modal.edl.photos[key].length;
  const thumbWrap=document.getElementById('edl-thumbs-'+domKey);
  if(thumbWrap){
    const im=document.createElement('img');
    im.src=freshUrl;
    im.style.cssText='width:36px;height:36px;object-fit:cover;border-radius:4px;cursor:pointer';
    im.onclick=()=>window.open(freshUrl,'_blank');
    thumbWrap.appendChild(im);
  }
  fileInput.value='';
}

// Photo de piece d'identite (locataire ou garant) - contrairement aux
// photos d'etat des lieux/BT, persistee directement en base a chaque prise
// (pas de bouton "Enregistrer" separe a oublier) : une piece d'identite
// suit la personne (tenants.identite_photos), jamais le logement, pour ne
// pas rester attachee au bien quand le locataire change.
async function uploadIdentitePhoto(tenantId,fileInput){
  const file=fileInput.files?.[0];
  if(!file)return;
  const t=S.tenants.find(x=>x.id===tenantId);
  if(!t){alert('Locataire introuvable');return;}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path='identite/'+tenantId+'/'+Date.now()+'.'+ext;
  const{error}=await sb.storage.from('documents-locataires').upload(path,file,{contentType:file.type||'image/jpeg',cacheControl:'0'});
  if(error){alert('Erreur photo : '+error.message);return;}
  const{data:pub}=sb.storage.from('documents-locataires').getPublicUrl(path);
  const freshUrl=pub.publicUrl+'?v='+Date.now();
  const photos=[...(t.identite_photos||[])];
  const photo={id:uid(),label:'Photo '+(photos.length+1),url:freshUrl,path,date:NOW};
  photos.push(photo);
  const{error:updErr}=await sb.from('tenants').update({identite_photos:photos}).eq('id',tenantId);
  if(updErr){alert('Erreur enregistrement : '+updErr.message);return;}
  t.identite_photos=photos;
  const list=document.getElementById('identite-photos-list');
  if(list){
    list.insertAdjacentHTML('beforeend',identitePhotoRowHtml(tenantId,photo));
    // Cablage direct de la ligne fraichement inseree : contrairement au
    // reste du modal, cette ligne n'est jamais passee par un render()/
    // bindAll() complet (pour ne pas perdre le reste du formulaire ouvert),
    // donc son input de renommage et son bouton de suppression doivent etre
    // cables ici a la main, sinon ils restent inertes (bug constate : le
    // renommage semblait s'enregistrer a l'ecran mais rien n'etait ecrit en
    // base, faute de gestionnaire onchange attache).
    const row=list.querySelector('[data-identite-row="'+photo.id+'"]');
    row?.querySelector('[data-identite-label]')?.addEventListener('change',e=>renameIdentitePhoto(tenantId,photo.id,e.target.value));
    row?.querySelector('[data-del-identite-photo]')?.addEventListener('click',()=>deleteIdentitePhoto(tenantId,photo.id));
  }
  fileInput.value='';
}
// Rendu d'une ligne "piece d'identite" (vignette + etiquette + suppression)
// - fonction partagee entre le rendu initial du modal et l'ajout a chaud
// d'une nouvelle photo (uploadIdentitePhoto), pour ne jamais dupliquer le
// markup.

async function renameIdentitePhoto(tenantId,photoId,newLabel){
  const t=S.tenants.find(x=>x.id===tenantId);
  if(!t)return;
  const photos=(t.identite_photos||[]).map(p=>p.id===photoId?{...p,label:newLabel}:p);
  const{error}=await sb.from('tenants').update({identite_photos:photos}).eq('id',tenantId);
  if(error){alert('Erreur : '+error.message);return;}
  t.identite_photos=photos;
}
async function deleteIdentitePhoto(tenantId,photoId){
  if(!confirm('Supprimer cette photo ?'))return;
  const t=S.tenants.find(x=>x.id===tenantId);
  if(!t)return;
  const removed=(t.identite_photos||[]).find(p=>p.id===photoId);
  const photos=(t.identite_photos||[]).filter(p=>p.id!==photoId);
  const{error}=await sb.from('tenants').update({identite_photos:photos}).eq('id',tenantId);
  if(error){alert('Erreur : '+error.message);return;}
  t.identite_photos=photos;
  if(removed?.path)await sb.storage.from('documents-locataires').remove([removed.path]).catch(()=>{});
  document.querySelector('[data-identite-row="'+photoId+'"]')?.remove();
}

// Attestation d'assurance habitation, capturee directement depuis le
// bandeau bloquant de l'etat des lieux - un seul lien par locataire
// (contrairement aux pieces d'identite), donc simple ecrasement de
// tenants.assurance_url. Debloque les boutons Previsualiser/Enregistrer
// par manipulation DOM directe plutot qu'un render() complet, pour ne pas
// effacer un paraphe/signature deja trace dans le formulaire ouvert.
async function uploadAssuranceFile(tenantId,fileInput){
  const file=fileInput.files?.[0];
  if(!file)return;
  const t=S.tenants.find(x=>x.id===tenantId);
  if(!t){alert('Locataire introuvable');return;}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path='assurance/'+tenantId+'/'+Date.now()+'.'+ext;
  const{error}=await sb.storage.from('documents-locataires').upload(path,file,{contentType:file.type||'image/jpeg',cacheControl:'0'});
  if(error){alert('Erreur upload : '+error.message);return;}
  const{data:pub}=sb.storage.from('documents-locataires').getPublicUrl(path);
  const freshUrl=pub.publicUrl+'?v='+Date.now();
  const{error:updErr}=await sb.from('tenants').update({assurance_url:freshUrl}).eq('id',tenantId);
  if(updErr){alert('Erreur enregistrement : '+updErr.message);return;}
  t.assurance_url=freshUrl;
  document.getElementById('edl-assurance-alert')?.remove();
  const stillBlockedBySortie=S.modal?.edlType==='sortie'&&!S.modal?.edl?.linkedEntree;
  const pb=document.getElementById('btn-preview-edl'),sb2=document.getElementById('btn-save-edl');
  if(pb)pb.disabled=stillBlockedBySortie;
  if(sb2)sb2.disabled=stillBlockedBySortie;
}

// Lit l'etat courant du formulaire d'etat des lieux directement dans le DOM
// (meme raison que collectBailFormData : les champs texte ne sont pas
// synchronises en continu avec S.modal.edl, seules les photos le sont).
function collectEdlFormData(){
  const q=id=>document.getElementById(id)?.value||'';
  const edl=S.modal.edl||{};
  const structure=edl.structure||[];
  const data={};
  structure.forEach(room=>{
    room.items.forEach(itemKey=>{
      const key=room.key+'.'+itemKey;
      const domKey=room.key+'-'+itemKey;
      data[key]={
        etat:q('edl-etat-'+domKey),
        description:q('edl-desc-'+domKey),
        photos:(edl.photos&&edl.photos[key])||[],
      };
    });
  });
  return {
    id:edl.id,
    type:S.modal.edlType==='sortie'?'sortie':'entree',
    linked_edl_id:edl.linkedEntree?.id||null,
    date:q('edl-date'),
    nouvelle_adresse:q('edl-nouvelle-adresse'),
    structure,
    compteurs:{
      elec_num:q('edl-elec-num'),elec_releve:q('edl-elec-releve'),
      gaz_num:q('edl-gaz-num'),gaz_releve:q('edl-gaz-releve'),
      eau_froide:q('edl-eau-froide'),eau_chaude:q('edl-eau-chaude'),
    },
    cles:{
      cles_immeuble:q('edl-cles-immeuble'),boites_lettres:q('edl-cles-bal'),badge_portail:q('edl-cles-badge'),
      cles_porte:q('edl-cles-porte'),cles_cave:q('edl-cles-cave'),parking:q('edl-cles-parking'),
      autre_nb:q('edl-cles-autre-nb'),autre_label:q('edl-cles-autre-label'),
    },
    data,
    observations:q('edl-observations')+(edl._assuranceOverride&&edl._assuranceOverrideReason?(q('edl-observations')?' | ':'')+'Assurance habitation non fournie à ce jour : '+edl._assuranceOverrideReason+'.':''),
    paraphe_bailleur:sigDataUrl('edl-paraphe-bailleur'),
    paraphe_locataire:sigDataUrl('edl-paraphe-locataire'),
    sig_bailleur:sigDataUrl('edl-sig-bailleur'),
    sig_locataire:sigDataUrl('edl-sig-locataire'),
  };
}

// Genere le corps textuel de l'etat des lieux (jsPDF) - meme pattern de
// pagination que genBailPDF. Pour une sortie, la valeur d'entree est
// rappelee en regard de chaque element (comparaison directe, coeur meme de
// l'etat des lieux comparatif) a partir de entreeRef (l'enregistrement
// d'entree lie, deja charge en memoire au moment de l'ouverture du
// formulaire de sortie).
function genEdlPDF(edl,tenant,entreeRef){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const pageW=210,pageH=297,marginX=15,marginTop=18,marginBottom=24;
  let y=marginTop;
  const isSortie=edl.type==='sortie';
  const dl=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
  function ensureSpace(h){if(y+h>pageH-marginBottom){doc.addPage();y=marginTop;}}
  function title(txt){
    ensureSpace(10);doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text(txt,marginX,y);y+=7;doc.setFont('helvetica','normal');doc.setFontSize(9);
  }
  function line(txt,size){
    doc.setFontSize(size||9);
    const lines=doc.splitTextToSize(txt,pageW-2*marginX);
    lines.forEach(l=>{ensureSpace(5);doc.text(l,marginX,y);y+=5;});
  }

  // Logo J&A SAVADUR : le bailleur de l'etat des lieux est actuellement
  // toujours affiche comme "J&A SAVADUR" ci-dessous (meme hors bien Dubail),
  // le logo suit donc la meme regle - non conditionne par dubailFilter ici,
  // contrairement au bail/aux quittances. Pleine largeur de page (cf genBailPDF).
  const logoW=pageW-2*marginX,logoH=logoW*159/605;
  doc.addImage(LOGO_SAVADUR_B64,'PNG',marginX,y,logoW,logoH);
  y+=logoH+5;

  doc.setFont('helvetica','bold');doc.setFontSize(16);
  doc.text('ÉTAT DES LIEUX '+(isSortie?'DE SORTIE':"D'ENTRÉE"),pageW/2,y,{align:'center'});y+=10;
  doc.setFont('helvetica','normal');doc.setFontSize(9);

  line('Date : '+dl(edl.date));
  line('Logement : '+(tenant.logement||'—'));
  line('Bailleur : J&A SAVADUR — Antoine JOSSE');
  line('Locataire : '+(tenant.nom||'—')+(isSortie&&edl.nouvelle_adresse?' — Nouvelle adresse : '+edl.nouvelle_adresse:''));
  y+=2;

  title('Compteurs et relevés');
  const c=edl.compteurs||{};
  line('Électricité — N° compteur : '+(c.elec_num||'—')+' · Relevé : '+(c.elec_releve||'—'));
  if(c.gaz_num||c.gaz_releve)line('Gaz — N° compteur : '+(c.gaz_num||'—')+' · Relevé : '+(c.gaz_releve||'—'));
  line('Eau — Relevé froide : '+(c.eau_froide||'—')+' m³ · Relevé chaude : '+(c.eau_chaude||'—')+' m³');
  y+=2;

  title('Clés et accès');
  const k=edl.cles||{};
  line("Clés immeuble : "+(k.cles_immeuble||0)+' · Boîtes aux lettres : '+(k.boites_lettres||0)+' · Badge/clé portail : '+(k.badge_portail||0));
  line("Clés porte d'entrée : "+(k.cles_porte||0)+' · Clés cave : '+(k.cles_cave||0)+' · Parking : '+(k.parking||0));
  if(k.autre_label)line('Autre ('+k.autre_label+') : '+(k.autre_nb||0));
  y+=2;

  (edl.structure||[]).forEach(room=>{
    title(room.label);
    room.items.forEach(itemKey=>{
      const key=room.key+'.'+itemKey;
      const it=(edl.data||{})[key]||{};
      const itLabel=EDL_ITEM_CATALOG[itemKey]||itemKey;
      const ref=isSortie&&entreeRef?(entreeRef.data||{})[key]:null;
      let txt=itLabel+' — État : '+(it.etat||'—')+(ref?' (entrée : '+(ref.etat||'—')+')':'');
      if(it.description)txt+=' — '+it.description;
      line(txt);
      if(ref?.description)line('Description entrée : '+ref.description,8);
    });
    y+=1;
  });

  if(edl.observations){title('Observations ou réserves');line(edl.observations);}

  ensureSpace(20);
  y+=6;
  doc.setFontSize(9);
  doc.text('Fait à Lorient, le '+dl(edl.date),marginX,y);y+=6;
  doc.text('Signature du bailleur',marginX,y);
  doc.text('Signature du locataire',pageW-marginX-55,y);
  return doc;
}

// Fusionne les photos prises (une page A4 par photo, legendee "Piece —
// Element") en annexe du corps genere par jsPDF, puis appose le paraphe et
// le numero de page sur l'ensemble du document final en une seule passe -
// meme principe que mergeBailWithDiagnostics. La signature est apposee sur
// la DERNIERE PAGE DU CORPS (capturee avant l'ajout des pages photo), pas
// sur la derniere page du document final qui peut desormais etre une photo.
async function mergeEdlWithPhotos(jsDoc,edl){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const finalDoc=await PDFDocument.load(jsDoc.output('arraybuffer'));
  const font=await finalDoc.embedFont(StandardFonts.HelveticaBold);
  const A4=[595.28,841.89];
  const bodyPageCount=finalDoc.getPageCount();

  const photoEntries=[];
  (edl.structure||[]).forEach(room=>{
    room.items.forEach(itemKey=>{
      const key=room.key+'.'+itemKey;
      const it=(edl.data||{})[key];
      (it?.photos||[]).forEach(p=>photoEntries.push({room:room.label,item:EDL_ITEM_CATALOG[itemKey]||itemKey,url:p.url}));
    });
  });
  for(const p of photoEntries){
    try{
      const resp=await fetch(p.url);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      const bytes=new Uint8Array(await resp.arrayBuffer());
      const ct=resp.headers.get('content-type')||'';
      const page=finalDoc.addPage(A4);
      page.drawText(p.room+' — '+p.item,{x:40,y:800,size:12,font,color:rgb(0.1,0.1,0.1)});
      const isPng=ct.includes('png')||p.url.toLowerCase().includes('.png');
      const img=isPng?await finalDoc.embedPng(bytes):await finalDoc.embedJpg(bytes);
      const scale=Math.min((A4[0]-80)/img.width,(A4[1]-160)/img.height,1);
      page.drawImage(img,{x:40,y:60,width:img.width*scale,height:img.height*scale});
    }catch(e){console.warn('Photo non incluse dans le PDF final :',e.message);}
  }

  const parB=edl.paraphe_bailleur?await finalDoc.embedPng(dataUrlToUint8(edl.paraphe_bailleur)):null;
  const parL=edl.paraphe_locataire?await finalDoc.embedPng(dataUrlToUint8(edl.paraphe_locataire)):null;
  const sigB=edl.sig_bailleur?await finalDoc.embedPng(dataUrlToUint8(edl.sig_bailleur)):null;
  const sigL=edl.sig_locataire?await finalDoc.embedPng(dataUrlToUint8(edl.sig_locataire)):null;
  const pages=finalDoc.getPages();
  pages.forEach((page,i)=>{
    const {width}=page.getSize();
    if(parB)page.drawImage(parB,{x:20,y:12,width:56,height:20});
    if(parL)page.drawImage(parL,{x:width-76,y:12,width:56,height:20});
    page.drawText('Page '+(i+1)+'/'+pages.length,{x:width/2-20,y:14,size:8,font,color:rgb(0.6,0.6,0.6)});
  });
  const lastBodyPage=finalDoc.getPage(bodyPageCount-1);
  const{width:lbw}=lastBodyPage.getSize();
  if(sigB)lastBodyPage.drawImage(sigB,{x:20,y:70,width:110,height:38});
  if(sigL)lastBodyPage.drawImage(sigL,{x:lbw-130,y:70,width:110,height:38});

  return finalDoc.save();
}

// Envoie par email au locataire le lien vers son etat des lieux (memes
// modalites que sendBailEmail, dupliquee plutot que factorisee : le contenu
// du message differe et les deux fonctions sont deja courtes).
async function sendEdlEmail(tenant){
  if(!tenant.email){alert("Pas d'email pour ce locataire");return;}
  if(!tenant.edl_url){alert("Aucun état des lieux enregistré pour ce locataire");return;}
  if(!BREVO_API_KEY)BREVO_API_KEY=ensureBrevoKey();
  if(!BREVO_API_KEY)return;
  const html=`<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto">
    <p>Bonjour ${tenant.nom},</p>
    <p>Veuillez trouver ci-dessous le lien vers votre état des lieux signé :</p>
    <p><a href="${tenant.edl_url}" style="background:#1D9E75;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;display:inline-block">📋 Consulter mon état des lieux</a></p>
    <p>Cordialement,<br>J&A SAVADUR</p>
  </div>`;
  try{
    const resp=await fetch('https://api.brevo.com/v3/smtp/email',{
      method:'POST',
      headers:{'api-key':BREVO_API_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({sender:{name:'J&A SAVADUR',email:'savadur56@gmail.com'},to:[{email:tenant.email,name:tenant.nom}],subject:'Votre état des lieux',htmlContent:html})
    });

    alert('✓ Email envoyé à '+tenant.email);
  }catch(e){alert('Erreur envoi email : '+e.message);}
}

function calcTaxeSejour(nbAdultes, nbNuits, prixNuit, taux, plafond){
  // 5% du prix nuit plafonné à plafond €/j/adulte
  const tauxDecimal=(taux||5)/100;
  const taxeParAdulteParNuit=Math.min((prixNuit||0)*tauxDecimal/nbNuits, plafond||4.60);
  return Math.round(taxeParAdulteParNuit*(nbAdultes||1)*nbNuits*100)/100;
}

function exportRangementsExcel(){
  // Load XLSX dynamically if not present
  if(typeof XLSX==='undefined'){
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js';
    s.onload=function(){doExportRng();};
    document.head.appendChild(s);
  } else {
    doExportRng();
  }
}
function doExportRng(){
  const rng=S.rangements||[];
  const tools=S.tools||[];
  const conso=S.consommables||[];
  if(!rng.length){alert('Aucun rangement à exporter');return;}
  const byLoc={};
  rng.forEach(function(r){
    const loc=r.location||r.localisation||r.bien||'Non classé';
    if(!byLoc[loc])byLoc[loc]=[];
    byLoc[loc].push(r);
  });
  const wb=XLSX.utils.book_new();
  Object.keys(byLoc).sort().forEach(function(loc){
    const wsData=[];
    const sheetName=loc.slice(0,31).replace(/[\\\/*?:\[\]]/g,'-');
    byLoc[loc].forEach(function(r,ri){
      if(ri>0)wsData.push([]);
      wsData.push(['📦 '+(r.nom||'Rangement')+(r.description?' — '+r.description:'')]);
      wsData.push(['Nom','Type','Catégorie','Quantité','État','Description']);
      const rngTools=tools.filter(function(t){return t.location===r.nom;});
      const rngConso=conso.filter(function(c){return c.location===r.nom;});
      if(!rngTools.length&&!rngConso.length)wsData.push(['(vide)','','','','','']);
      rngTools.forEach(function(t){wsData.push([t.name||'','Outil',t.category||'',1,t.status||'',t.description||'']);});
      rngConso.forEach(function(c){wsData.push([c.name||'','Consommable',c.category||'',c.quantite||c.qty||1,'',c.description||'']);});
    });
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols']=[{wch:35},{wch:14},{wch:18},{wch:10},{wch:12},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });
  const today=new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb,'Inventaire_Rangements_'+today+'.xlsx');
}

  // Générer tous les paiements/quittances manquants (0€) pour tous les locataires actifs
  async function genererQuittancesManquantes(envoyerEmails){
    const MOIS_LIST=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const now=new Date();
    const nowY=now.getFullYear(),nowM=now.getMonth();
    const DETTE_DEPUIS=new Date(2026,0,1);
    const tenantsConcernes=S.tenants.filter(t=>t.actif!==false);
    let nbCrees=0,nbEnvoyes=0,erreurs=[];
    for(const t of tenantsConcernes){
      const isComm=t.type_bail==='commercial';
      const loyerHT=parseFloat(t.loyer_ref||0);
      const chargesHT=parseFloat(t.charges||0);
      const loyerTTC=isComm?Math.round((loyerHT+chargesHT)*1.2*100)/100:Math.round((loyerHT+chargesHT)*100)/100;
      if(!loyerTTC)continue;
      const entree=t.date_entree?new Date(t.date_entree):null;
      const debut=entree&&entree>DETTE_DEPUIS?entree:DETTE_DEPUIS;
      let y=debut.getFullYear(),m=debut.getMonth();
      while(y<nowY||(y===nowY&&m<=nowM)){
        const moisNom=MOIS_LIST[m];
        const moisNum=m+1;
        const existing=S.rentPayments.find(p=>p.tenant_id===t.id&&p.annee===y&&p.mois===moisNom);
        if(!existing){
          try{
            const rec={tenant_id:t.id,mois:moisNom,annee:y,mois_num:moisNum,loyer:loyerTTC,locataire_part:0,caf:0,paye:false,commentaire:'Loyer non perçu'};
            const {data,error}=await sb.from('rent_payments').insert(rec).select().single();
            if(error){erreurs.push(`${t.nom} ${moisNom} ${y}: ${error.message}`);}
            else{S.rentPayments.push(data);nbCrees++;
              if(envoyerEmails&&t.email){
                try{await autoSendQuittance(t,data,moisNom,y,'Loyer non perçu — dette reportée',true);nbEnvoyes++;}
                catch(e){erreurs.push(`Email ${t.nom} ${moisNom}: ${e.message}`);}
              }
            }
          }catch(e){erreurs.push(`${t.nom} ${moisNom} ${y}: ${e.message}`);}
        }
        m++;if(m>11){m=0;y++;}
      }
    }
    render();
    let msg=`✓ ${nbCrees} quittance(s) créée(s)`;
    if(envoyerEmails)msg+=`, ${nbEnvoyes} email(s) envoyé(s)`;
    if(erreurs.length)msg+=`\n⚠ ${erreurs.length} erreur(s):\n`+erreurs.slice(0,5).join('\n');
    if(nbCrees>0||erreurs.length)alert(msg);
    return nbCrees;
  }

  // Global save for creche (top and bottom buttons)
  window.saveCrecheAll = async function(){
    const crecheMembers=S.famille.filter(m=>m.type_membre==='creche');
    const enf=S.famille.find(x=>x.id===S.familleEnfant)||(crecheMembers[0]||null);
    console.log('[CRECHE SAVE] enf=',enf?.prenom,'familleEnfant=',S.familleEnfant);
    if(!enf){alert('Aucun enfant crèche trouvé. Vérifiez le type dans la fiche membre.');return;}
    const y=S.familleYear||new Date().getFullYear();
    const mo=(S.familleMonth!=null?S.familleMonth:new Date().getMonth())+1;
    const daysInM=new Date(y,mo,0).getDate();
    function toMinL(t){if(!t)return null;const[h,m2]=t.split(':').map(Number);return h*60+m2;}
    const updates=[];
    for(let d=1;d<=daysInM;d++){
      const dow=new Date(y,mo-1,d).getDay();
      const depAntic=document.querySelector('.creche-dep[data-day="'+d+'"]')?.value||null;
      const recTard=document.querySelector('.creche-rec[data-day="'+d+'"]')?.value||null;
      const contDep=document.querySelector('.creche-cont[data-day="'+d+'"]')?.value||null;
      const contRec=document.querySelector('.creche-contr[data-day="'+d+'"]')?.value||null;
      const arrTard=document.querySelector('.creche-arr-tard[data-day="'+d+'"]')?.value||null;
      const depAnticD=document.querySelector('.creche-dep-antic[data-day="'+d+'"]')?.value||null;
      const absent=document.querySelector('.creche-absent[data-day="'+d+'"]')?.checked||false;
      // Only save if something is set (or row already exists)
      const existing=S.crecheSaisies.find(s=>s.enfant_id===enf.id&&s.annee===y&&s.mois===mo&&s.jour===d);
      const hasData=depAntic||recTard||arrTard||depAnticD||absent||
        (contDep&&contDep!=='09:00')||(contRec&&contRec!=='16:30');
      if(!hasData&&!existing)continue;
      // Calc minutes sup (arrondi quart sup)
      let minSup=0;
      const depCM=toMinL(contDep||'09:00'),recCM=toMinL(contRec||'16:30');
      if(depAntic){const d2=depCM-toMinL(depAntic);if(d2>0)minSup+=Math.ceil(d2/15)*15;}
      if(recTard){const d2=toMinL(recTard)-recCM;if(d2>0)minSup+=Math.ceil(d2/15)*15;}
      const rec={enfant_id:enf.id,annee:y,mois:mo,jour:d,
        depose_anticipee:depAntic||null,recuperation_tardive:recTard||null,
        heure_contrat_dep:contDep||null,heure_contrat_rec:contRec||null,
        arrivee_tardive:arrTard||null,depart_anticipe:depAnticD||null,
        absence_autorisee:absent,minutes_sup:minSup};
      updates.push({existing,rec});
    }
    let saveErrors=[];
    for(const{existing,rec}of updates){
      if(existing){
        const{error}=await sb.from('creche_saisies').update(rec).eq('id',existing.id);
        if(error)saveErrors.push(error.message);
        else Object.assign(existing,rec);
      }else{
        const{data,error}=await sb.from('creche_saisies').insert(rec).select().single();
        if(error)saveErrors.push(error.message);
        else if(data)S.crecheSaisies.push(data);
      }
    }
    if(saveErrors.length){
      alert('Erreurs lors de la sauvegarde :\n'+[...new Set(saveErrors)].join('\n'));
      return;
    }
    // Save taux if changed
    const tauxEl=document.getElementById('creche-taux-normal');
    const factEl=document.getElementById('creche-facture-recue');
    const updContrat={...(enf.contrat_creche||{})};
    const tauxVal=tauxEl?parseFloat(tauxEl.value):(S._crecheTaux!=null?S._crecheTaux:null);
    const factVal=factEl?parseFloat(factEl.value):(S._crecheFact!=null?S._crecheFact:null);
    if(tauxVal!=null&&!isNaN(tauxVal))updContrat.taux_normal=tauxVal;
    if(factVal!=null&&!isNaN(factVal))updContrat.facture_recue=factVal;
    console.log('[CRECHE SAVE] taux=',updContrat.taux_normal,'fact=',updContrat.facture_recue);
    console.log('[CRECHE SAVE] Saving contrat for id=',enf.id,'data=',updContrat);
    const{error:contratErr}=await sb.from('famille').update({contrat_creche:updContrat}).eq('id',enf.id);
    console.log('[CRECHE SAVE] Contrat result: error=',contratErr);
    if(contratErr)console.warn('Contrat save error:',contratErr.message);
    else enf.contrat_creche=updContrat;
    render();
    alert('✓ Planning enregistré !');
  }

function getDriveAccount(logement){
  const l=(logement||'').toLowerCase();
  if(l.includes('dubail')||l.includes('général dubail')||l.includes('general dubail'))
    return {hint:'savadur56@gmail.com',label:'J&A SAVADUR',key:'savadur'};

async function getGdriveToken(accountKey,loginHint){
  const cacheKey='gdrive_token_'+accountKey;
  const expiryKey='gdrive_expiry_'+accountKey;
  if(gdriveTokens[accountKey])return gdriveTokens[accountKey];
  const stored=localStorage.getItem(cacheKey);
  const expiry=parseInt(localStorage.getItem(expiryKey)||'0');
  if(stored&&Date.now()<expiry){gdriveTokens[accountKey]=stored;return stored;}
  return new Promise((resolve,reject)=>{
    if(typeof google==='undefined'||!google.accounts){reject(new Error('Google API non chargée'));return;}
    const client=google.accounts.oauth2.initTokenClient({
      client_id:GDRIVE_CLIENT_ID,scope:GDRIVE_SCOPE,hint:loginHint,
      callback:(resp)=>{
        if(resp.error){reject(new Error(resp.error));return;}
        gdriveTokens[accountKey]=resp.access_token;
        localStorage.setItem(cacheKey,resp.access_token);
        localStorage.setItem(expiryKey,String(Date.now()+(resp.expires_in-60)*1000));
        resolve(resp.access_token);
      }
    });
    client.requestAccessToken();
  });
}

async function getOrCreateFolder(token,name,parentId=null){
  const q=`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parentId?` and '${parentId}' in parents`:'');
  const resp=await fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)',{headers:{Authorization:'Bearer '+token}});
  const data=await resp.json();
  if(data.files&&data.files.length>0)return data.files[0].id;
  const cr=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parentId?[parentId]:[]})
  });
  return (await cr.json()).id;
}

async function uploadToDrive(token,htmlContent,filename,parentFolderId){
  const boundary='gmao_'+Date.now();
  const meta=JSON.stringify({name:filename+'.html',parents:[parentFolderId],mimeType:'text/html'});
  const CRLF='\r\n';
  const body='--'+boundary+CRLF+'Content-Type: application/json'+CRLF+CRLF+meta
    +CRLF+'--'+boundary+CRLF+'Content-Type: text/html'+CRLF+CRLF+htmlContent
    +CRLF+'--'+boundary+'--';
  const up=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary='+boundary},body
  });
  if(!up.ok){const e=await up.text();throw new Error(e);}
  return await up.json();
}

async function archiveToDrive(htmlContent,filename,mois,annee,logement){
  if(!GDRIVE_CLIENT_ID||GDRIVE_CLIENT_ID==='VOTRE_CLIENT_ID'){console.log('Drive non configuré');return null;}
  try{
    const account=getDriveAccount(logement||'');
    console.log('📁 Archivage Drive → '+account.label+' ('+account.hint+')...');
    const token=await getGdriveToken(account.key,account.hint);
    if(!token){console.warn('Token Drive non obtenu');return null;}
    const yearId=await getOrCreateFolder(token,String(annee),GDRIVE_ROOT_FOLDER_ID);
    const monthId=await getOrCreateFolder(token,mois,yearId);
    const file=await uploadToDrive(token,htmlContent,filename,monthId);
    console.log('✅ Archivé sur Drive ('+account.label+'):',filename,'→',file.id);
    return file.id;
  }catch(e){
    console.warn('❌ Drive archive failed:',e.message);
    // If token expired, clear it so it's requested again next time
    if(e.message.includes('401')||e.message.includes('invalid_token')){
      const account=getDriveAccount(logement||'');
      localStorage.removeItem('gdrive_token_'+account.key);
      localStorage.removeItem('gdrive_expiry_'+account.key);
      delete gdriveTokens[account.key];
    }
    return null;
  }
}
