    <div class="tab ${tab==='loyers'?'active':''}" data-loc-tab="loyers">Saisie loyers</div>
    <div class="tab ${tab==='synthese'?'active':''}" data-loc-tab="synthese">Synthèse</div>
    <div class="tab ${tab==='dettes'?'active':''}" data-loc-tab="dettes">Dettes</div>
    <div class="tab ${tab==='emises'?'active':''}" data-loc-tab="emises">Émises</div>
  </div>`;

  // Rappel des regularisations de taxe fonciere dues (anniversaire du bail
  // passe + nouvelle TF disponible) - jamais de calcul pour un bail parti.
  const tfDues=tenants.map(t=>({t,due:tfRegulStatus(t)})).filter(x=>x.due);
  const tfReminderBar=tfDues.length?`<div style="background:var(--amber-bg);border:0.5px solid var(--amber);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px">
    ${tfDues.map(({t,due})=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0">
      <span>💶 Régularisation taxe foncière <b>${due.annee}</b> due pour <b>${t.nom}</b> (${t.logement||''}) — augmentation estimée : ${new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(due.augmentationAnnuelleHT)} HT/an</span>
      <button class="btn btn-sm btn-p" data-open-regul-tf="${t.id}">Générer la lettre</button>
    </div>`).join('')}
  </div>`:'';

  const yearBar = `${tfReminderBar}<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <span style="font-size:12px;color:var(--text2)">Année :</span>
    ${[2024,2025,2026,2027].map(y=>`<span class="pill ${year===y?'active':''}" data-loc-year="${y}">${y}</span>`).join('')}
  </div>`;

  // ====== LOCATAIRES ======
  if(tab==='tenants'){
    const colors=['#185FA5','#1D9E75','#9B59B6','#E67E22','#E74C3C'];
    // Group tenants by property from topology
    const visProps=isDubail?S.topology.properties.filter(p=>dubailFilter(p.name)):S.topology.properties;
    const propBlocks=visProps.map(function(prop,pi){
      const propTenants=tenants.filter(function(t){
        return (t.logement||'').toLowerCase().startsWith(prop.name.toLowerCase());
      });
      if(!propTenants.length) return '';
      // Sort: actifs first, then by zone name, then by nom
      propTenants.sort(function(a,b){
        if(a.actif===false&&b.actif!==false) return 1;
        if(b.actif===false&&a.actif!==false) return -1;
        const za=(a.logement||'').split(' — ').slice(1).join(' — ')||'';
        const zb=(b.logement||'').split(' — ').slice(1).join(' — ')||'';
        return za.localeCompare(zb,'fr')||a.nom.localeCompare(b.nom,'fr');
      });
      const color=colors[pi%colors.length];
      const actifCount=propTenants.filter(function(t){return t.actif!==false;}).length;
      const rows=propTenants.map(function(t){
        const zone=(t.logement||'').includes(' — ')?(t.logement||'').split(' — ').slice(1).join(' — '):'';
        const inactive=t.actif===false;
        return '<tr style="'+(inactive?'opacity:0.5':'')+'">'
          +'<td style="font-size:12px;color:var(--text2)">'+zone+'</td>'
          +'<td style="font-weight:500">'+t.nom+'</td>'
          +'<td style="font-size:12px;color:var(--text2)">'+(t.email||'—')+'</td>'
          +'<td><span class="badge '+(t.type_bail==='commercial'?'bblue':'bgreen')+'">'+(t.type_bail==='commercial'?'Commercial':'Habitation')+'</span></td>'
          +'<td style="font-weight:500">'+fmt(t.loyer_ref)+'</td>'
          +'<td style="font-size:12px">'+(t.charges?fmt(t.charges):'—')+'</td>'
          +'<td style="font-size:12px">'+(t.date_entree?new Date(t.date_entree).toLocaleDateString('fr-FR'):'—')+'</td>'
          +'<td><span class="badge '+(inactive?'bgray':t.actif===false?'bgray':'bgreen')+'">'+(inactive?'Inactif':'Actif')+'</span></td>'
          +'<td style="white-space:nowrap">'
            +(canEdit()?'<button class="btn btn-sm" data-edit-tenant="'+t.id+'">&#9998;</button> ':'')
            +(isAdmin()?'<button class="btn btn-d btn-sm" data-del-tenant="'+t.id+'">&#10005;</button>':'')
          +'</td>'
          +'</tr>';
      }).join('');
      return '<div class="card" style="margin-bottom:16px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid '+color+'">'
          +'<div style="font-size:13px;font-weight:600;color:'+color+'">&#127968; '+prop.name+'</div>'
          +'<div style="font-size:12px;color:var(--text2)">'+actifCount+' actif'+(actifCount>1?'s':'')+' / '+propTenants.length+' total</div>'
        +'</div>'
        +'<div style="overflow-x:auto"><table>'
          +'<thead><tr>'
            +'<th style="font-size:11px">Zone</th>'
            +'<th style="font-size:11px">Locataire</th>'
            +'<th style="font-size:11px">Email</th>'
            +'<th style="font-size:11px">Type</th>'
            +'<th style="font-size:11px">Loyer réf.</th>'
            +'<th style="font-size:11px">Charges</th>'
            +'<th style="font-size:11px">Entrée</th>'
            +'<th style="font-size:11px">Statut</th>'
            +'<th></th>'
          +'</tr></thead>'
          +'<tbody>'+rows+'</tbody>'
        +'</table></div>'
        +'</div>';
    }).join('');
    // Tenants not matched by any topology property
    const matchedIds=new Set(S.topology.properties.flatMap(function(p){
      return tenants.filter(function(t){return (t.logement||'').toLowerCase().startsWith(p.name.toLowerCase());}).map(function(t){return t.id;});
    }));
    const unmatched=tenants.filter(function(t){return !matchedIds.has(t.id);});
    const unmatchedBlock=unmatched.length?'<div class="card" style="margin-bottom:16px">'
      +'<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">❓ Logement non identifié</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>Logement</th><th>Locataire</th><th>Type</th><th>Loyer</th><th></th></tr></thead><tbody>'
      +unmatched.map(function(t){return '<tr><td style="font-size:12px">'+(t.logement||'—')+'</td><td>'+t.nom+'</td><td>'+fmt(t.loyer_ref)+'</td><td>'+(canEdit()?'<button class="btn btn-sm" data-edit-tenant="'+t.id+'">&#9998;</button>':'')+'</td></tr>';}).join('')
      +'</tbody></table></div></div>':'';
    return tabBar
      +'<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'
        +(isAdmin()?'<button class="btn btn-p" id="btn-add-tenant">+ Locataire</button>':'')
      +'</div>'
      +(propBlocks||'')
      +unmatchedBlock
      +(tenants.length===0?'<div style="text-align:center;padding:30px;color:var(--text2)">Aucun locataire. Cliquez "+ Locataire" pour commencer.</div>':'');
  }

  if(tab==='loyers'){
    const allowedTenantIds=new Set(tenants.map(t=>t.id));
    const filteredPayments=S.rentPayments.filter(p=>allowedTenantIds.has(p.tenant_id));
    const selTenant = S.selTenantLoyer||null;
    const selMonth = S.selMonthLoyer||MONTHS[new Date().getMonth()];
    return `${tabBar}${yearBar}
    <div style="display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start">
      <!-- Liste locataires -->
      <div class="card" style="padding:10px">
        <div class="sec" style="margin-bottom:8px">Locataires</div>
        ${tenants.map(t=>{
          const paid = filteredPayments.filter(p=>p.tenant_id===t.id&&p.annee===year&&p.paye).reduce((s,p)=>s+(p.loyer||0),0);
          const due = (t.loyer_ref||0)*12;
          return `<div class="tree-row ${selTenant===t.id?'selected':''}" data-sel-tenant="${t.id}" style="padding:7px 8px">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:500">${t.nom}</div>
              <div style="font-size:11px;color:var(--text2)">${t.logement||''}</div>
              <div style="display:flex;gap:6px;margin-top:3px">
                ${t.bail_url?`<a href="${t.bail_url}" target="_blank" style="font-size:10px;color:var(--blue);text-decoration:none">📄 Bail</a>`:''}
                ${t.edl_url?`<a href="${t.edl_url}" target="_blank" style="font-size:10px;color:var(--green);text-decoration:none">🏠 EDL</a>`:''}
                ${t.assurance_url?`<a href="${t.assurance_url}" target="_blank" style="font-size:10px;color:var(--amber);text-decoration:none">🛡 Assurance</a>`:''}
                ${t.assurance_url?`<a href="${t.assurance_url}" target="_blank" style="font-size:10px;color:var(--amber);text-decoration:none">🛡 Assurance</a>`:''}
              </div>
            </div>
            <span class="badge ${paid>=due*0.9?'bgreen':paid>0?'bamber':'bred'}" style="font-size:10px">${fmt(paid)}</span>
          </div>`;
        }).join('')}
        ${tenants.length===0?'<div style="font-size:12px;color:var(--text2);padding:8px">Aucun locataire actif.</div>':''}
      </div>
      <!-- Grille mois -->
      ${selTenant?(()=>{
        const t = tenants.find(x=>x.id===selTenant);
        if(!t) return '<div class="card">Locataire introuvable.</div>';
        return `<div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
            <div>
              <div style="font-size:15px;font-weight:500">${t.nom}</div>
              <div style="font-size:12px;color:var(--text2)">${t.logement||''} · Loyer réf. : ${fmt(t.loyer_ref)}</div>
            </div>
            <span class="badge ${t.type_bail==='commercial'?'bblue':'bgreen'}">${t.type_bail==='commercial'?'Commercial HT+TVA':'Habitation'}</span>
          </div>
          ${t.type_bail==='commercial'?`
          <div style="background:var(--amber-bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:12px">
            💡 Local commercial — loyer saisi en <b>HT</b>. La TVA 20% est calculée automatiquement.
            Loyer HT : <b>${fmt(t.loyer_ref)}</b> → TVA : <b>${fmt(t.loyer_ref*0.2)}</b> → TTC : <b>${fmt(t.loyer_ref*1.2)}</b>
            ${t.charges>0?` | Charges HT : <b>${fmt(t.charges)}</b> → TTC : <b>${fmt(t.charges*1.2)}</b>`:''}
          </div>`:'' }
          <div style="overflow-x:auto"><table>
            <thead><tr>
              <th>Mois</th>
              ${t.type_bail==='commercial'?`
                <th>Loyer HT</th><th>TVA 20%</th><th>Loyer TTC</th>
                ${t.charges>0?'<th>Charges HT</th><th>Charges TTC</th>':''}
                <th>Total TTC attendu</th>
              `:`<th>Loyer attendu</th>${t.charges>0?'<th>Charges</th>':''}<th>Total attendu</th>`}
              <th>Reçu</th><th>Date</th><th>CAF</th><th>Statut</th><th></th>
            </tr></thead>
            <tbody>
            ${MONTHS.map((mois,mi)=>{
              const p = filteredPayments.find(x=>x.tenant_id===t.id&&x.annee===year&&x.mois===mois);
              const isPaid = p?.paye;
              const montant = p?.loyer||0;
              const isComm = t.type_bail==='commercial';
              const loyerHT = t.loyer_ref||0;
              const loyerTVA = isComm ? loyerHT*0.2 : 0;
              const loyerTTC = isComm ? loyerHT*1.2 : loyerHT;
              const chargesHT = t.charges||0;
              const chargesTTC = isComm ? chargesHT*1.2 : chargesHT;
              const totalAttendu = loyerTTC + (isComm ? chargesTTC : chargesHT);
              return `<tr style="${isPaid?'':'background:var(--bg2)'}">
                <td style="font-weight:500">${mois}</td>
                ${isComm?`
                  <td style="font-size:12px">${fmt(loyerHT)}</td>
                  <td style="font-size:12px;color:var(--amber)">${fmt(loyerTVA)}</td>
                  <td style="font-weight:500">${fmt(loyerTTC)}</td>
                  ${chargesHT>0?`<td style="font-size:12px">${fmt(chargesHT)}</td><td style="font-size:12px">${fmt(chargesTTC)}</td>`:''}
                  <td style="font-weight:500">${fmt(totalAttendu)}</td>
                `:`
                  <td>${fmt(loyerHT)}</td>
                  ${chargesHT>0?`<td style="font-size:12px">${fmt(chargesHT)}</td>`:''}
                  <td style="font-weight:500">${fmt(loyerHT+chargesHT)}</td>
                `}
                <td style="font-weight:500;color:${isPaid?'var(--green)':'var(--text)'}">${(p?.locataire_part||0)+(p?.caf||0)>0?fmt((p?.locataire_part||0)+(p?.caf||0)):'—'}</td>
                <td style="font-size:11px">
                  ${p?.date_loc?'🏦 '+new Date(p.date_loc).toLocaleDateString('fr-FR'):'—'}
                  ${p?.date_caf?'<br>🏢 CAF : '+new Date(p.date_caf).toLocaleDateString('fr-FR'):''}
                </td>
                <td style="font-size:12px">${p?.caf>0?fmt(p.caf):'—'}</td>
                <td>${isPaid?'<span class="badge bgreen">✓ Payé</span>':montant>0?'<span class="badge bamber">Partiel</span>':'<span class="badge bgray">En attente</span>'}</td>
                <td style="white-space:nowrap">
                  ${canEdit()&&!isPaid?`<button class="btn btn-sm btn-p" data-pay-loyer="${t.id}" data-pay-mois="${mois}" data-pay-year="${year}">✓ Valider</button> `:''}
                  ${canEdit()?`<button class="btn btn-sm" data-saisie-loyer="${t.id}" data-saisie-mois="${mois}" data-saisie-year="${year}">✎ Saisir</button>`:''}
                  ${p&&canEdit()?`<button class="btn btn-sm btn-d" data-del-rp="${p.id}" title="Supprimer ce paiement">✕</button>`:''}
                </td>
              </tr>`;
            }).join('')}
            </tbody>
          </table></div>
          <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:0.5px solid var(--border);margin-top:8px;font-weight:500">
            <span>Total reçu ${year}</span>
            <span style="color:var(--green)">${fmt(filteredPayments.filter(p=>p.tenant_id===t.id&&p.annee===year&&p.paye).reduce((s,p)=>s+(p.loyer||0),0))}</span>
          </div>
        </div>`;
      })():`<div class="card" style="display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text2)">
        Sélectionnez un locataire dans la liste.
      </div>`}
    </div>`;
  }

  // ====== SYNTHESE ======
  if(tab==='synthese'){
    // On inclut les locataires actifs, PLUS les locataires partis en cours d'année
    // (ex: changement de locataire) dès lors qu'ils ont des loyers enregistrés sur l'année
    // sélectionnée — sinon leurs mois payés avant leur départ disparaissent du tableau.
    const scopedTenants=getFilteredTenants();
    const synthTenants=scopedTenants.filter(t=>t.actif!==false||S.rentPayments.some(p=>p.tenant_id===t.id&&p.annee===year));
    const allowedTenantIds=new Set(synthTenants.map(t=>t.id));
    const filteredPayments=S.rentPayments.filter(p=>allowedTenantIds.has(p.tenant_id));
    // Split Dubail vs perso
    const dubailTenants=synthTenants.filter(t=>dubailFilter(t.logement||''));
    const persoTenants=synthTenants.filter(t=>!dubailFilter(t.logement||''));
    const dubailIds=new Set(dubailTenants.map(t=>t.id));
    const persoIds=new Set(persoTenants.map(t=>t.id));
    const dubailPmts=filteredPayments.filter(p=>dubailIds.has(p.tenant_id));
    const persoPmts=filteredPayments.filter(p=>persoIds.has(p.tenant_id));

    function getZoneS(t){
      if(!t||!t.logement)return '';
      const sep=t.logement.includes(' — ')?' — ':' - ';
      return t.logement.includes(sep)?t.logement.split(sep).slice(1).join(sep):'';
    }

    function statsBlock(label,tList,pmtList,color){
      // Loyer attendu / perçu recalculés à partir du même parcours mois-par-mois que
      // calcDetteLigne (includeAll=true), pour que "Loyers attendus" et "Taux d'encaissement"
      // comptent bien TOUS les mois dus depuis le 1er janvier 2026 (ou l'entrée du locataire),
      // y compris les mois où aucune saisie n'a été faite (auparavant ignorés — c'est ce qui
      // faisait apparaître un taux d'encaissement artificiellement élevé face à la vraie dette).
      const tenantStats=tList.map(t=>{
        const isComm=t.type_bail==='commercial';
        let lignesAnnee=[];
        try{const{lignes}=calcDetteLigne(t,null,null,true);lignesAnnee=lignes.filter(l=>l.annee===year);}catch(e){}
        const nbMois=lignesAnnee.length;
        const lHT=parseFloat(t.loyer_ref||0)*nbMois;
        const cHT=parseFloat(t.charges||0)*nbMois;
        const tva=isComm?Math.round((lHT+cHT)*0.2*100)/100:0;
        const rec=lignesAnnee.reduce((s,l)=>s+(l.recu||0),0);
        const zone=getZoneS(t)||t.nom||'';
        return{t,isComm,lHT,cHT,tva,rec,zone,attTotal:Math.round((lHT+cHT+tva)*100)/100};
      });
      let attHT=0,attCharges=0,attTVA=0,percu=0;
      tenantStats.forEach(ts=>{attHT+=ts.lHT;attCharges+=ts.cHT;attTVA+=ts.tva;percu+=ts.rec;});
      const attendu=Math.round((attHT+attCharges+attTVA)*100)/100;
      const hasComm=tenantStats.some(ts=>ts.isComm);
      // En retard = dette réelle cumulée par locataire (total à date, y compris solde de départ
      // et mois antérieurs à l'année sélectionnée si non soldés) — cohérent avec l'onglet Dettes.
      const dettes=tList.reduce((s,t)=>{
        try{const{detteFinale}=calcDetteLigne(t,null,null,false);return s+Math.max(0,detteFinale);}
        catch(e){return s;}
      },0);
      // Regroupement par local (zone) : un local ayant eu 2 locataires dans l'année
      // (ex: changement de locataire) est fusionné en une seule ligne, loyer+charges+TVA compris.
      const byZone={};
      tenantStats.forEach(ts=>{
        if(!byZone[ts.zone])byZone[ts.zone]={zone:ts.zone,attTotal:0,percu:0};
        byZone[ts.zone].attTotal+=ts.attTotal;
        byZone[ts.zone].percu+=ts.rec;
      });
      const zoneRows=Object.values(byZone).sort((a,b)=>a.zone.localeCompare(b.zone,'fr'));
      return `<div class="card" style="margin-bottom:14px">
        <div style="font-size:13px;font-weight:600;color:${color};margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid ${color}">${label} — ${tList.length} locataire(s)</div>
        <div class="g4">
          <div class="stat"><div class="stat-l">Loyers perçus ${year}</div><div class="stat-v" style="color:var(--green)">${fmt(percu)}</div></div>
          <div class="stat">
            <div class="stat-l">Loyers attendus</div>
            <div class="stat-v">${fmt(attendu)}</div>
            <div style="font-size:10px;color:var(--text2);margin-top:2px">dont HT : ${fmt(attHT)} · Charges : ${fmt(attCharges)}${hasComm?' · TVA : '+fmt(attTVA):''}</div>
          </div>
          <div class="stat"><div class="stat-l">En retard</div><div class="stat-v" style="color:var(--red)">${fmt(dettes)}</div></div>
          <div class="stat"><div class="stat-l">Taux encaissement</div><div class="stat-v" style="color:${attendu>0?'var(--blue)':'var(--text2)'}">${attendu>0?Math.round(percu/attendu*100)+'%':'—'}</div></div>
        </div>
        ${zoneRows.length>0?`<div style="margin-top:14px">
          <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Taux d'encaissement par local (loyer + charges${hasComm?' + TVA':''})</div>
          <div style="overflow-x:auto"><table>
            <thead><tr><th style="font-size:10px">Local</th><th style="font-size:10px;text-align:right">Attendu TTC</th><th style="font-size:10px;text-align:right">Perçu</th><th style="font-size:10px;text-align:right">Taux</th></tr></thead>
            <tbody>${zoneRows.map(z=>{
              const taux=z.attTotal>0?Math.round(z.percu/z.attTotal*100):null;
              const tauxColor=taux===null?'var(--text2)':taux>=95?'var(--green)':taux>=70?'var(--amber)':'var(--red)';
              return '<tr><td style="font-size:12px;font-weight:500">'+z.zone+'</td><td style="text-align:right;font-size:12px">'+fmt(z.attTotal)+'</td><td style="text-align:right;font-size:12px;color:var(--green)">'+fmt(z.percu)+'</td><td style="text-align:right;font-size:12px;font-weight:700;color:'+tauxColor+'">'+(taux===null?'—':taux+'%')+'</td></tr>';
            }).join('')}</tbody>
          </table></div>
        </div>`:''}
        ${tList.length>0?`<div style="overflow-x:auto;margin-top:14px"><table>
          <thead><tr><th>Locataire</th><th>Logement</th><th>Loyer HT</th>${MONTHS.filter((_,i)=>i<new Date().getMonth()+2).map(m=>`<th style="font-size:10px">${m.slice(0,3)}</th>`).join('')}<th>Total</th></tr></thead>
          <tbody>${tList.map(t=>{
            const tPmts=pmtList.filter(p=>p.tenant_id===t.id&&p.annee===year);
            const total=tPmts.reduce((s,p)=>s+(p.locataire_part||0)+(p.caf||0),0);
            const partiTag=t.actif===false?' <span style="font-size:9px;color:var(--text2);font-weight:400">(parti)</span>':'';
            return '<tr><td style="font-weight:500;font-size:12px">'+t.nom+partiTag+'</td><td style="font-size:11px;color:var(--text2)">'+t.logement+'</td><td style="font-size:12px">'+fmt(t.loyer_ref||0)+'</td>'+MONTHS.filter((_,i)=>i<new Date().getMonth()+2).map(m=>{const p=tPmts.find(x=>x.mois===m);return '<td style="font-size:11px;text-align:center">'+(p?p.paye?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--amber)">…</span>':'<span style="color:var(--text3)">—</span>')+'</td>';}).join('')+'<td style="font-weight:600;font-size:12px">'+fmt(total)+'</td></tr>';
          }).join('')}</tbody>
        </table></div>`:''}
      </div>`;
    }

    // Build one block per property (bien) dynamically
    const colors=['#185FA5','#1D9E75','#9B59B6','#E67E22','#E74C3C','#2ECC71','#3498DB','#F39C12'];
    
    // Get all unique logements (properties) that have tenants
    // Use topology properties order, then fallback to logement prefixes
    const allProps=[];
    // First: topology properties
    S.topology.properties.forEach(p=>{
      const propTenants=synthTenants.filter(t=>(t.logement||'').startsWith(p.name));
      if(propTenants.length>0){
        allProps.push({name:p.name,tenants:propTenants});
      }
    });
    // Then: tenants not matched by topology (edge case)
    const matchedIds=new Set(allProps.flatMap(p=>p.tenants.map(t=>t.id)));
    const unmatched=synthTenants.filter(t=>!matchedIds.has(t.id));
    if(unmatched.length>0) allProps.push({name:'Autres',tenants:unmatched});
    
    const propBlocks=allProps.map((prop,i)=>{
      const propPmts=filteredPayments.filter(p=>prop.tenants.some(t=>t.id===p.tenant_id));
      const isThisPropDubail=dubailFilter(prop.name);
      const icon=isThisPropDubail?'🏢':'🏠';
      const color=colors[i%colors.length];
      return statsBlock(icon+' '+prop.name,prop.tenants,propPmts,color);
    }).join('');
    
    return `${tabBar}${yearBar}
    ${propBlocks||'<div style="padding:20px;text-align:center;color:var(--text2)">Aucun locataire actif</div>'}
    `;
  }

  if(tab==='dettes'){
    const debts = tenants.map(t=>{
      const {lignes,detteFinale}=calcDetteLigne(t,null,null,false);
      // On n'affiche que les lignes où il y a un écart (dette ou crédit)
      const items=lignes.filter(l=>Math.abs(l.solde)>0.01||l.recu>0);
      return {t,items,total:Math.max(0,detteFinale)};
    }).filter(x=>x.total>0.01).sort((a,b)=>b.total-a.total);

    return `${tabBar}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="sec" style="margin:0">Impayés & dettes</div>
        ${canEdit()?'<button class="btn btn-sm" id="btn-gen-qtt-manquantes" style="background:var(--blue);color:#fff;border-color:var(--blue)">📄 Générer quittances manquantes</button>':''}
      </div>
      ${debts.length===0?'<div style="font-size:13px;color:var(--text2);padding:20px;text-align:center">Aucune dette enregistrée.</div>':''}
      ${debts.map(({t,items,total})=>`
        <div class="row" style="align-items:flex-start;padding:12px 0">
          <div class="fg">
            <div class="fgs">${t.nom} <span style="font-size:11px;color:var(--text2)">${t.logement||''}</span></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
              ${items.map(i=>{
                const color=i.estCredit?'var(--green)':i.estSolde?'var(--text2)':'var(--red)';
                const cls=i.estCredit?'bgreen':i.recu>0&&!i.estSolde?'bamber':'bred';
                return `<span class="badge ${cls}" style="font-size:10px;display:inline-flex;align-items:center;gap:4px">
                  ${i.mois} ${i.annee} : <b style="color:${color}">${i.estCredit?'crédit ':''} ${fmt(Math.abs(i.solde))}</b>
                  (att.${fmt(i.attendu)}${i.remise>0&&i.recu===0?' / remise '+fmt(i.remise):i.recu>0?' / reçu '+fmt(i.recu):i.saisi?' / reçu 0€':' ⚠ non saisi'})
                  ${canEdit()&&!i.saisi
                    ?`<button data-qtt-zero="${t.id}" data-qtt-mois="${i.mois}" data-qtt-annee="${i.annee}" style="background:#fff;border:1px solid #999;border-radius:3px;font-size:9px;padding:1px 4px;cursor:pointer;margin-left:2px" title="Créer paiement 0€ et envoyer quittance">📄 0€</button>`
                    :canEdit()&&i.recu===0&&i.saisi
                      ?(()=>{
                        const p=S.rentPayments.find(x=>x.tenant_id===t.id&&x.annee===i.annee&&x.mois===i.mois);
                        return p?.quittance_envoyee
                          ?`<span style="font-size:9px;color:var(--green);margin-left:3px">✓ envoyée</span>`
                          :`<button data-qtt-send="${p?.id}" style="background:#fff;border:1px solid var(--blue);border-radius:3px;font-size:9px;padding:1px 4px;cursor:pointer;margin-left:2px;color:var(--blue)" title="Envoyer la quittance 0€ par email">📧 envoyer</button>`;
                      })()
                      :''
                  }
                </span>`;
              }).join('')}
            </div>
          </div>
          <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <div style="font-size:16px;font-weight:600;color:var(--red)">${fmt(total)}</div>
            <div style="font-size:11px;color:var(--text2)">${items.length} mois impayé(s)</div>
            ${canEdit()?`<button class="btn btn-sm" style="background:var(--green);color:#fff;border-color:var(--green)" data-remb-dette="${t.id}">↩ Rembourser</button>`:''}
          </div>
        </div>`).join('')}
    </div>`;
  }

    if(tab==='emises'){
    const dubailTenantIds=isDubail?S.tenants.filter(t=>dubailFilter(t.logement||'')).map(t=>t.id):null;
    const allRp=S.rentPayments.filter(p=>p.annee===year&&(p.paye||(p.locataire_part>0||p.caf>0)||p.remise>0||p.loyer>0)&&(!dubailTenantIds||dubailTenantIds.includes(p.tenant_id)));
    // Cache calcDetteLigne (solde cumulé, report des mois précédents inclus) par locataire,
    // pour éviter de recalculer tout l'historique à chaque ligne de quittance affichée.
    // calcDetteLigne ne couvre que la fenêtre 01/01/2026 -> mois réel courant : en dehors
    // (années 2024/2025, ou mois 2026/2027 pas encore atteints), getLigneDette renvoie null
    // et la ligne retombe sur le calcul isolé du mois seul (comportement actuel).
    const detteCache=new Map();
    function getLigneDette(t,annee,mois){
      if(!t)return null;
      if(!detteCache.has(t.id)){
        const{lignes}=calcDetteLigne(t,null,null,true);
        const byKey={};
        lignes.forEach(l=>{byKey[l.annee+'|'+l.mois]=l;});
        detteCache.set(t.id,byKey);
      }
      return detteCache.get(t.id)[annee+'|'+mois]||null;
    }
    // Releves linked to tenants (water/charges invoices)
    const allRel=S.releves.filter(r=>{
      const cpt=S.compteurs.find(c=>c.id===r.compteur_id);
      return cpt&&cpt.tenant_id&&(r.date||'').startsWith(String(year))&&(!dubailTenantIds||dubailTenantIds.includes(cpt.tenant_id));
    });
    function getBienE(t){if(!t||!t.logement)return 'Non class\u00e9';const sep=t.logement.includes(' \u2014 ')?' \u2014 ':' - ';return t.logement.split(sep)[0];}
    function getZoneE(t){if(!t||!t.logement)return '';const sep=t.logement.includes(' \u2014 ')?' \u2014 ':' - ';return t.logement.includes(sep)?t.logement.split(sep).slice(1).join(sep):'';}
    // Group quittances
    const rpByBien={};
    allRp.forEach(function(p){
      const t=S.tenants.find(x=>x.id===p.tenant_id);
      const b=getBienE(t);const z=getZoneE(t)||t?.nom||'';
      if(!rpByBien[b])rpByBien[b]={};if(!rpByBien[b][z])rpByBien[b][z]=[];
      rpByBien[b][z].push({...p,_t:t});
    });
    // Group releves
    const relByBien={};
    allRel.forEach(function(r){
      const cpt=S.compteurs.find(c=>c.id===r.compteur_id)||{};
      const t=S.tenants.find(x=>x.id===cpt.tenant_id);
      const b=getBienE(t);const z=getZoneE(t)||t?.nom||'';
      if(!relByBien[b])relByBien[b]={};if(!relByBien[b][z])relByBien[b][z]=[];
      relByBien[b][z].push({...r,_t:t,_cpt:cpt});
    });
    function buildQttBlock(byBien){
      const color='#185FA5';const title='Quittances de loyer';
      const biens=Object.keys(byBien).sort();
      if(!biens.length)return '<div style="padding:16px;text-align:center;color:var(--text2)">Aucune quittance en '+year+'</div>';
      const bHtml=biens.map(function(bien){
        const zones=Object.keys(byBien[bien]).sort();
        const bT=zones.reduce((s,z)=>s+byBien[bien][z].reduce((s2,f)=>s2+(f.locataire_part||0)+(f.caf||0),0),0);
        const zHtml=zones.map(function(zone){
          const items=[...byBien[bien][zone]].sort((a,b2)=>(a.mois_num||0)>(b2.mois_num||0)?1:-1);
          const zT=items.reduce((s,f)=>s+(f.locataire_part||0)+(f.caf||0),0);
          const rows=items.map(function(f){
            const t=f._t;
            const isComm=t?.type_bail==='commercial';
            const loyerRef=parseFloat(t?.loyer_ref||0);
            const chargesRef=parseFloat(t?.charges||0);
            const remiseF=parseFloat(f.remise||0);
            const ligneDette=getLigneDette(t,f.annee,f.mois);
            // Loyer attendu = loyer_ref TTC - remise (cohérent avec calcDetteLigne, indépendant du champ f.loyer)
            const loyerAttenduF=ligneDette?ligneDette.attendu:Math.max(0,Math.round(((isComm?(loyerRef+chargesRef)*1.2:(loyerRef+chargesRef))-remiseF)*100)/100);
            const recu=Math.round(((f.locataire_part||0)+(f.caf||0))*100)/100;
            // Solde cumulé (avec report) issu de calcDetteLigne quand ce mois est dans sa
            // fenêtre de calcul, sinon solde isolé du mois seul en repli.
            const sol=ligneDette?ligneDette.solde:Math.round((loyerAttenduF-recu)*100)/100;
            // "Partiel" reste un statut MOIS SEUL (indépendant du cumulé) : ce mois précis
            // n'a pas été intégralement couvert par ce qui a été reçu ce mois-là.
            const solMoisSeul=Math.round((loyerAttenduF-recu)*100)/100;
            const isPartial=!f.paye&&recu>0&&solMoisSeul>0.01;
            const hasRemise=remiseF>0&&recu===0;
            const hasDetteAnt=!!ligneDette&&ligneDette.soldePrecedent>0.01;
            return '<tr style="'+(isPartial?'background:#FFF9E6':hasRemise?'background:#F0FFF4':'')+'">'
              +'<td style="font-size:11px">'+(f.mois||'')+' '+(f.annee||'')
                +(isPartial?' <span class="badge bamber" style="font-size:9px">Partiel</span>':'')
                +(hasDetteAnt?' <span class="badge bred" style="font-size:9px">Dette antérieure</span>':'')
                +(hasRemise?' <span class="badge bgreen" style="font-size:9px">Remise</span>':'')
              +'</td>'
              +'<td>'+(t?.nom||'')+'</td>'
              +'<td style="text-align:right">'+fmt(loyerAttenduF)+'</td>'
              +'<td style="text-align:right;color:var(--green)">'+(hasRemise?'<span style="font-size:10px;color:var(--green)">Remise '+fmt(remiseF)+'</span>':fmt(recu))+'</td>'
              +'<td style="text-align:right;font-weight:600;color:'+(sol>0.01?'var(--red)':sol<-0.01?'var(--green)':'var(--text2)')+';">'+fmt(Math.abs(sol))+(sol<-0.01?' (crédit)':'')+'</td>'
              +'<td style="text-align:center;white-space:nowrap">'
                +'<button class="btn btn-sm" data-print-qtt="'+f.id+'" style="font-size:10px;padding:2px 5px" title="Ouvrir document">&#128438;</button>'
                +(t?.email?'<button class="btn btn-sm" data-resend-qtt="'+f.id+'" style="font-size:10px;padding:2px 5px;margin-left:3px" title="Renvoyer par email">&#128233;</button>':'')
                +(isAdmin()?'<button class="btn btn-d btn-sm" data-del-rp="'+f.id+'" style="font-size:10px;padding:2px 5px;margin-left:3px">&#10005;</button>':'')
              +'</td></tr>';
          }).join('');
          return '<tr style="background:var(--bg2)"><td colspan="6" style="font-size:11px;font-weight:600;padding:4px 8px;color:var(--text2)">'+(zone||'G\u00e9n\u00e9ral')+' \u2014 '+fmt(zT)+'</td></tr>'+rows;
        }).join('');
        return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid '+color+'"><div style="font-size:13px;font-weight:600;color:'+color+'">&#127968; '+bien+'</div><div style="font-size:12px;font-weight:600">'+fmt(bT)+'</div></div><div style="overflow-x:auto"><table style="min-width:450px"><thead><tr><th style="font-size:10px">Mois</th><th style="font-size:10px">Locataire</th><th style="font-size:10px;text-align:right">Attendu</th><th style="font-size:10px;text-align:right">Re\u00e7u</th><th style="font-size:10px;text-align:right">Solde</th><th style="font-size:10px">Actions</th></tr></thead><tbody>'+zHtml+'</tbody></table></div></div>';
      }).join('');
      const gT=biens.reduce((s,b)=>s+Object.keys(byBien[b]).reduce((s2,z)=>s2+byBien[b][z].reduce((s3,f)=>s3+(f.locataire_part||0)+(f.caf||0),0),0),0);
      return '<div style="font-size:14px;font-weight:700;color:'+color+';margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid '+color+'">'+title+'</div>'+bHtml+'<div class="card" style="background:var(--bg2);margin-bottom:20px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Total '+year+'</span><span>'+fmt(gT)+'</span></div></div>';
    }
    function buildRelBlock(byBien){
      const color='#1D9E75';const title='Factures charges/eau';
      const biens=Object.keys(byBien).sort();
      if(!biens.length)return '<div style="padding:16px;text-align:center;color:var(--text2)">Aucune facture eau en '+year+'</div>';
      const bHtml=biens.map(function(bien){
        const zones=Object.keys(byBien[bien]).sort();
        const bT=zones.reduce((s,z)=>s+byBien[bien][z].reduce((s2,r)=>{
          const conso=Math.round(((r.nouvel_index||0)-(r.ancien_index||0))*1000)/1000;
          return s2+Math.round(conso*(r.prix_unitaire||r._cpt?.prix_unitaire||0)*100)/100;
        },0),0);
        const zHtml=zones.map(function(zone){
          const items=[...byBien[bien][zone]].sort((a,b2)=>(a.date||'')>(b2.date||'')?1:-1);
          const zT=items.reduce((s,r)=>{const co=Math.round(((r.nouvel_index||0)-(r.ancien_index||0))*1000)/1000;return s+Math.round(co*(r.prix_unitaire||r._cpt?.prix_unitaire||0)*100)/100;},0);
          const rows=items.map(function(r){
            const conso=Math.round(((r.nouvel_index||0)-(r.ancien_index||0))*1000)/1000;
            const montant=Math.round(conso*(r.prix_unitaire||r._cpt?.prix_unitaire||0)*100)/100;
            const st=r.paye?'<span class="badge bgreen">\u2713 Acquitt\u00e9e</span>':r.facture_envoyee?'<span class="badge bblue">&#128438; Factur\u00e9e</span>':'<span class="badge bgray">\u25cf En attente</span>';
            return '<tr>'
              +'<td style="font-size:11px;white-space:nowrap">'+dateLabel(r.date)+'</td>'
              +'<td>'+(r._t?.nom||'')+'</td>'
              +'<td style="font-size:11px;color:var(--text2)">'+(r._cpt?.name||'')+'</td>'
              +'<td style="text-align:right;font-size:11px">'+conso+' '+(r._cpt?.unite||'m\u00b3')+'</td>'
              +'<td style="text-align:right;font-weight:500">'+fmt(montant)+'</td>'
              +'<td style="text-align:center">'+st+'</td>'
              +'<td style="text-align:center;white-space:nowrap">'
                +'<button class="btn btn-sm" data-print-releve="'+r.id+'" style="font-size:10px;padding:2px 5px" title="Imprimer">&#128438;</button>'
                +'<button class="btn btn-sm" style="font-size:10px;padding:2px 5px;margin-left:3px;background:var(--amber);color:#fff" data-relance-releve="'+r.id+'" title="Envoyer relance">&#128233;</button>'
                +(isAdmin()?'<button class="btn btn-d btn-sm" data-del-releve="'+r.id+'" style="font-size:10px;padding:2px 5px;margin-left:3px">&#10005;</button>':'')
              +'</td></tr>';
          }).join('');
          return '<tr style="background:var(--bg2)"><td colspan="7" style="font-size:11px;font-weight:600;padding:4px 8px;color:var(--text2)">'+(zone||'G\u00e9n\u00e9ral')+' \u2014 '+fmt(zT)+'</td></tr>'+rows;
        }).join('');
        return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid '+color+'"><div style="font-size:13px;font-weight:600;color:'+color+'">&#127968; '+bien+'</div><div style="font-size:12px;font-weight:600">'+fmt(bT)+'</div></div><div style="overflow-x:auto"><table style="min-width:520px"><thead><tr><th style="font-size:10px">Date</th><th style="font-size:10px">Locataire</th><th style="font-size:10px">Compteur</th><th style="font-size:10px;text-align:right">Conso.</th><th style="font-size:10px;text-align:right">Montant</th><th style="font-size:10px">Statut</th><th style="font-size:10px">Actions</th></tr></thead><tbody>'+zHtml+'</tbody></table></div></div>';
      }).join('');
      const gT=biens.reduce((s,b)=>s+Object.keys(byBien[b]).reduce((s2,z)=>s2+byBien[b][z].reduce((s3,r)=>{const co=Math.round(((r.nouvel_index||0)-(r.ancien_index||0))*1000)/1000;return s3+Math.round(co*(r.prix_unitaire||r._cpt?.prix_unitaire||0)*100)/100;},0),0),0);
      return '<div style="font-size:14px;font-weight:700;color:'+color+';margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid '+color+'">'+title+'</div>'+bHtml+'<div class="card" style="background:var(--bg2);margin-bottom:20px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Total '+year+'</span><span>'+fmt(gT)+'</span></div></div>';
    }
    function buildTfBlock(){
      const color='#BA7517';const title='Régularisations taxe foncière';
      const items=(S.tfRegularisations||[]).filter(r=>r.annee===year&&(!dubailTenantIds||dubailTenantIds.includes(r.tenant_id)))
        .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      if(!items.length)return '<div style="padding:16px;text-align:center;color:var(--text2)">Aucune régularisation taxe foncière émise en '+year+'</div>';
      const rows=items.map(function(r){
        const t=S.tenants.find(x=>x.id===r.tenant_id);
        return '<tr>'
          +'<td style="font-size:11px;white-space:nowrap">'+dateLabel(r.created_at)+'</td>'
          +'<td>'+(t?.nom||'—')+'</td>'
          +'<td style="font-size:11px;color:var(--text2)">'+(t?.logement||'')+'</td>'
          +'<td style="text-align:right;font-size:11px">'+fmt(r.tf_annee)+' vs '+fmt(r.tf_annee_precedente)+'</td>'
          +'<td style="text-align:right;font-size:11px">'+fmt(r.augmentation_annuelle_ht)+' HT/an'+(r.nb_mois_augmentation<12?' ('+r.nb_mois_augmentation+' mois fact.)':'')+'</td>'
          +'<td style="text-align:right;font-weight:600">'+fmt(r.total_ttc)+'</td>'
          +'<td style="text-align:center;white-space:nowrap">'
            +(t?'<button class="btn btn-sm" data-print-tf="'+r.id+'" style="font-size:10px;padding:2px 5px" title="Réouvrir la lettre">&#128438;</button>':'')
          +'</td></tr>';
      }).join('');
      const gT=items.reduce((s,r)=>s+(r.total_ttc||0),0);
      return '<div style="font-size:14px;font-weight:700;color:'+color+';margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid '+color+'">'+title+'</div>'
        +'<div class="card" style="margin-bottom:10px"><div style="overflow-x:auto"><table style="min-width:560px"><thead><tr><th style="font-size:10px">Émise le</th><th style="font-size:10px">Locataire</th><th style="font-size:10px">Local</th><th style="font-size:10px;text-align:right">TF année/n-1</th><th style="font-size:10px;text-align:right">Augmentation</th><th style="font-size:10px;text-align:right">Total facturé</th><th style="font-size:10px">Actions</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
        +'<div class="card" style="background:var(--bg2);margin-bottom:20px"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Total '+year+'</span><span>'+fmt(gT)+'</span></div></div>';
    }
    const emisesType=S.emisesType||'all';
    const emisesFilterBar=`<div class="form-group" style="max-width:260px;margin-bottom:14px">
      <label>Afficher</label>
      <select id="emises-type-filter">
        <option value="all" ${emisesType==='all'?'selected':''}>Tout</option>
        <option value="quittances" ${emisesType==='quittances'?'selected':''}>Quittances de loyer</option>
        <option value="eau" ${emisesType==='eau'?'selected':''}>Factures eau</option>
        <option value="tf" ${emisesType==='tf'?'selected':''}>Taxe foncière</option>
      </select>
    </div>`;
    return tabBar+yearBar+emisesFilterBar
      +((emisesType==='all'||emisesType==='quittances')?'<div class="card" style="margin-bottom:16px">'+buildQttBlock(rpByBien)+'</div>':'')
      +((emisesType==='all'||emisesType==='eau')?'<div class="card" style="margin-bottom:16px">'+buildRelBlock(relByBien)+'</div>':'')
      +((emisesType==='all'||emisesType==='tf')?'<div class="card">'+buildTfBlock()+'</div>':'');
  }



  return '';
}



function renderFactures(){
  const fmt = n => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(n||0);
  const fTab = S.factTab||'savadur';
  const year = S.factYear||(new Date().getFullYear());
  const YEARS = [year-1, year, year+1];

  const nAValider = (S.facturesAValider||[]).filter(f=>f.statut==='en_attente').length;
  const tabBar = `<div class="tab-bar">
    <div class="tab ${fTab==='savadur'?'active':''}" data-fact-tab="savadur">🏢 SAVADUR</div>
    <div class="tab ${fTab==='perso'?'active':''}" data-fact-tab="perso">🏠 Perso</div>
    <div class="tab ${fTab==='a_valider'?'active':''}" data-fact-tab="a_valider">📥 À valider${nAValider>0?` <span class="badge bamber" style="font-size:10px">${nAValider}</span>`:''}</div>
    <div class="tab ${fTab==='fournisseurs'?'active':''}" data-fact-tab="fournisseurs">📇 Artisans</div>
  </div>`;

  if(fTab==='fournisseurs'){
    if(!S.fournisseurTypeFilter)S.fournisseurTypeFilter='all';
    if(!S.fournisseurMetierFilter)S.fournisseurMetierFilter='all';
    const tf=S.fournisseurTypeFilter;
    const mf2=S.fournisseurMetierFilter;
    const FR_TYPES=['Artisan','Société de prestation','Fournisseur de matériel'];
    const nSansType=(S.fournisseurs||[]).filter(fr=>!fr.type).length;
    const nSansMetier=(S.fournisseurs||[]).filter(fr=>!fr.corps_metier).length;
    // N'affiche que les corps de metier reellement utilises (evite une longue
    // rangee de pastilles vides) - inclut aussi une valeur libre deja saisie
    // qui ne figurerait pas dans CORPS_METIER_LIST.
    const metiersUtilises=[...new Set((S.fournisseurs||[]).map(fr=>fr.corps_metier).filter(Boolean))]
      .sort((a,b)=>CORPS_METIER_LIST.indexOf(a)-CORPS_METIER_LIST.indexOf(b));
    const sorted=[...(S.fournisseurs||[])].filter(fr=>{
      if(tf==='sans'&&fr.type)return false;
      if(tf!=='all'&&tf!=='sans'&&fr.type!==tf)return false;
      if(mf2==='sans'&&fr.corps_metier)return false;
      if(mf2!=='all'&&mf2!=='sans'&&fr.corps_metier!==mf2)return false;
      return true;
    }).sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
    return `${tabBar}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="sec" style="margin:0">📇 Artisans & entreprises (${sorted.length})</div>
        ${isAdmin()?`<button class="btn btn-p btn-sm" id="btn-add-fournisseur">+ Artisan</button>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
        <span class="pill ${tf==='all'?'active':''}" data-fournisseur-type="all">Tous</span>
        ${FR_TYPES.map(t=>`<span class="pill ${tf===t?'active':''}" data-fournisseur-type="${t}">${t}</span>`).join('')}
        ${nSansType>0?`<span class="pill ${tf==='sans'?'active':''}" data-fournisseur-type="sans">Non classés (${nSansType})</span>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        <span class="pill ${mf2==='all'?'active':''}" data-fournisseur-metier="all">Tous corps de métier</span>
        ${metiersUtilises.map(c=>`<span class="pill ${mf2===c?'active':''}" data-fournisseur-metier="${c.replace(/"/g,'&quot;')}">${c}</span>`).join('')}
        ${nSansMetier>0?`<span class="pill ${mf2==='sans'?'active':''}" data-fournisseur-metier="sans">Sans corps de métier (${nSansMetier})</span>`:''}
      </div>
      ${sorted.length===0?'<div style="text-align:center;padding:20px;color:var(--text2)">Aucun artisan enregistré. Il apparaîtra en suggestion dans le champ "Entreprise" des factures.</div>':''}
      ${sorted.map(fr=>`<div class="row">
        <div class="fg">
          <div class="fgs">${fr.nom} ${fr.type?`<span class="badge bblue" style="font-size:9px">${fr.type}</span>`:''}</div>
          <div class="fgsub">${[fr.corps_metier,fr.telephone,fr.email].filter(Boolean).join(' · ')||'—'}</div>
        </div>
        ${isAdmin()?`<button class="btn btn-sm" data-edit-fournisseur="${fr.id}">✎</button>`:''}
        ${isAdmin()?`<button class="btn btn-d btn-sm" data-del-fournisseur="${fr.id}" style="margin-left:4px">✕</button>`:''}
      </div>`).join('')}
    </div>`;
  }

  // Filtre "Bien / Véhicule" : identifie une entree soit par nom de bien
  // (prefixe "bien:", inclut ses zones/sous-zones via startsWith), soit par
  // id d'equipement Véhicule/Bateau (prefixe "asset:") - trop de factures a
  // faire defiler sinon des qu'un bien a plusieurs annees d'historique.
  const bienVehOpts=[{v:'',l:'— Tous les biens / véhicules —'}]
    .concat(S.topology.properties.map(p=>({v:'bien:'+p.name,l:'🏠 '+p.name})))
    .concat(S.assets.filter(a=>a.category==='Véhicule'||a.category==='Bateau').map(a=>({v:'asset:'+a.id,l:'🚗 '+a.name})));
  const bienVehBar=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <select id="fact-bien-filter" style="padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;min-width:220px">
      ${bienVehOpts.map(o=>`<option value="${o.v}" ${(S.factBienFilter||'')===o.v?'selected':''}>${o.l}</option>`).join('')}
    </select>
  </div>`;

  const yearBar = `<div style="display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--text2)">Année :</span>
    ${YEARS.map(y=>`<span class="pill ${year===y?'active':''}" data-fact-year="${y}">${y}</span>`).join('')}
    <span class="pill ${!S.factYear?'active':''}" data-fact-year="0">Tout</span>
    ${isAdmin()?`<button class="btn btn-p btn-sm" id="btn-add-facture" style="margin-left:auto">+ Facture</button>`:''}
    <button class="btn btn-sm" id="btn-export-factures">📥 Export Excel</button>
  </div>${bienVehBar}`;

  const CATS = ['Travaux/Réparation','Matériaux','Énergie','Téléphone/Internet','Assurance','Entretien','Abonnement','Autre'];

  let facts = S.factures.filter(f=>{
    if(S.factYear&&f.date&&!f.date.startsWith(String(S.factYear)))return false;
    if(fTab==='savadur'&&f.compte!=='savadur')return false;
    if(fTab==='perso'&&f.compte!=='perso')return false;
    if(S.factBienFilter){
      const isAssetFilter=S.factBienFilter.startsWith('asset:');
      const val=S.factBienFilter.slice(S.factBienFilter.indexOf(':')+1);
      if(isAssetFilter){
        if(f.asset_id!==val)return false;
      } else {
        if(!f.bien||!(f.bien===val||f.bien.startsWith(val+' - ')))return false;
      }
    }
    // Utilisateur restreint a certains equipements/biens (visible_assets) :
    // ne montre que les factures rattachees a son perimetre, directement
    // (asset_id) ou via le bien/BT/chantier lie.
    if(!isAdmin()){
      const va=S.currentUser?.visible_assets||S.currentUser?.assets||[];
      if(va.length>0&&!isFactureInVisibleScope(f,va))return false;
    }
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const totalTTC = facts.reduce((s,f)=>s+parseFloat(f.montant_ttc||0),0);
  const nonRappr = facts.filter(f=>!estPaye(f)).length;

  if(fTab==='a_valider'){
    // Les listes d'options (bien/equipement/personne/BT) sont identiques pour
    // toutes les lignes en attente - ne les reconstruire qu'une seule fois ici
    // (au lieu de re-parcourir topologie/assets/famille/BT pour CHAQUE ligne)
    // sinon le rendu devient de plus en plus lent a mesure que le nombre de
    // factures en attente grandit (le cout par ligne etait proportionnel a la
    // taille de ces listes, pas juste au nombre de lignes).
    const bienOptsBase=buildBienOptsBase();
    const assetOptsBase=[{v:'',l:'— Aucun équipement —'},...S.assets.map(a=>({v:a.id,l:a.name+(a.location?' — '+a.location:'')}))];
    const personneOptsBase=[{v:'',l:'— Aucune personne —'},...S.famille.map(p=>({v:p.id,l:p.prenom+(p.nom?' '+p.nom:'')}))];
    const woOptsBase=[{v:'',l:'— Aucun BT —'},{v:'__new__',l:'+ Nouveau BT…'},...[...S.workOrders].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(w=>({v:w.id,l:w.title+(w.status==='done'?' (terminé)':'')}))];
    const bienOptsFor=(sel)=>renderOpts(bienOptsBase,sel);
    const assetOptsFor=(sel)=>renderOpts(assetOptsBase,sel);
    const personneOptsFor=(sel)=>renderOpts(personneOptsBase,sel);
    const woOptsFor=(sel)=>renderOpts(woOptsBase,sel);
    const chantierOptsBase=buildChantierOptsBase();
    const chantierOptsFor=(sel)=>renderOpts(chantierOptsBase,sel);
    // Devine savadur/perso : d'abord via le bien choisi, sinon via une personne
    // liee (une depense pour un membre de la famille est presque toujours
    // personnelle, modifiable a la main si jamais c'est pour savadur), sinon via
    // le compte explicite de l'equipement lie (champ assets.compte, renseigne
    // dans sa fiche), sinon via une heuristique sur son nom/emplacement
    // (dubailFilter) - reste modifiable a la main juste apres de toute facon.
    const compteGuess=(f)=>{
      if(f.bien) return dubailFilter(f.bien)?'savadur':'perso';
      if(f.famille_id) return 'perso';
      if(f.asset_id){
        const a=S.assets.find(x=>x.id===f.asset_id);
        if(a) return a.compte||((dubailFilter(a.name)||dubailFilter(a.location||''))?'savadur':'perso');
      }
      return 'savadur';
    };
    const compteOptsFor=(sel)=>`<option value="savadur" ${sel==='savadur'?'selected':''}>🏢 SAVADUR</option><option value="perso" ${sel==='perso'?'selected':''}>🏠 Perso</option>`;
    const pending=(S.facturesAValider||[]).filter(f=>f.statut==='en_attente').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    // Le DOM devient tres lourd (plusieurs selects par ligne) au-dela de
    // quelques centaines de lignes affichees d'un coup - on n'en rend qu'une
    // partie par defaut, avec un bouton pour en charger davantage, plutot que
    // de tout afficher meme quand il y a des milliers de factures en attente.
    const favPageSize=S.favPageSize||100;
    const pendingVisible=pending.slice(0,favPageSize);
    return `${tabBar}
    <div class="card">
      <div class="sec" style="margin-bottom:8px">📥 Factures détectées automatiquement, en attente de validation</div>
      ${pending.length===0?'<div style="text-align:center;padding:20px;color:var(--text2)">Rien à valider — tout est à jour.</div>':''}
      ${pending.length>0?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-d" id="btn-fav-reject-selected">🚫 Rejeter la sélection</button>
        <span id="fav-selected-count" style="font-size:12px;color:var(--text2)"></span>
        <span style="font-size:12px;color:var(--text2);margin-left:auto">Affichage de ${pendingVisible.length} sur ${pending.length}</span>
      </div>` :''}
      ${pending.length>0?`<div style="overflow-x:auto"><table>
        <thead><tr><th><input type="checkbox" id="fav-select-all"></th><th>Date facture</th><th>Fichier</th><th>Entreprise</th><th>Description</th><th>Montant TTC</th><th>Bien / Local</th><th>Équipement</th><th>Personne</th><th>BT lié</th><th>Chantier</th><th>Motif</th><th>Compte</th><th>Date paiement</th><th>Actions</th></tr></thead>
        <tbody>
        ${pendingVisible.map(f=>{
          const fileUrl=(f.apercu_pdf_path||f.storage_path)?`${SUPABASE_URL}/storage/v1/object/public/factures-a-valider/${f.apercu_pdf_path||f.storage_path}`:null;
          const dateRef=f.date_facture||f.fichier_date||'';
          const moisAnnee=dateRef?dateRef.slice(0,7):null;
          const doublon=f.entreprise&&moisAnnee&&S.factures.some(ex=>(ex.fournisseur||'').trim().toLowerCase()===f.entreprise.trim().toLowerCase()&&(ex.date||'').startsWith(moisAnnee));
          return `<tr>
            <td style="vertical-align:top;padding-top:8px"><input type="checkbox" class="fav-select" data-fav-id="${f.id}"></td>
            <td style="vertical-align:top;padding-top:8px"><input type="date" class="fav-date" data-fav-id="${f.id}" value="${dateRef}" style="width:130px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
            <td style="font-size:11px;vertical-align:top;padding-top:10px;max-width:160px;word-break:break-word">
              ${f.fichier_nom||'—'}
              ${fileUrl?`<br><a href="${fileUrl}" target="_blank" style="font-size:10px">📄 Ouvrir le fichier</a>`:'<br><span style="color:var(--red);font-size:10px">Fichier indisponible</span>'}
              ${f.erreur_extraction?`<div class="badge bamber" style="font-size:9px;margin-top:4px;white-space:normal" title="${f.erreur_extraction.replace(/"/g,'&quot;')}">⚠ ${f.erreur_extraction}</div>`:''}
            </td>
            <td style="vertical-align:top"><input class="fav-entreprise" data-fav-id="${f.id}" list="fournisseurs-list" value="${(f.entreprise||'').replace(/"/g,'&quot;')}" placeholder="Entreprise / artisan" style="width:150px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
              ${doublon?'<div class="badge bamber" style="font-size:9px;margin-top:3px">⚠ Facture similaire déjà enregistrée</div>':''}
            </td>
            <td style="vertical-align:top"><input class="fav-desc" data-fav-id="${f.id}" value="${(f.description||'').replace(/"/g,'&quot;')}" placeholder="Description / N° facture" style="width:140px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
            <td style="vertical-align:top"><input type="number" step="0.01" class="fav-montant" data-fav-id="${f.id}" value="${f.montant_ttc!=null?f.montant_ttc:''}" placeholder="0.00" style="width:90px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
            <td style="vertical-align:top;min-width:190px">
              <div class="fav-splits" data-fav-id="${f.id}">
                <div class="fav-split-line" style="display:flex;gap:4px;margin-bottom:4px">
                  <select class="fav-split-bien" style="flex:1;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${bienOptsFor(f.bien||'')}</select>
                </div>
              </div>
              <button type="button" class="btn btn-sm fav-add-split" data-fav-id="${f.id}" style="font-size:10px;padding:2px 6px" title="La facture concerne plusieurs biens (montant à répartir)">+ Bien</button>
            </td>
            <td style="vertical-align:top"><select class="fav-asset" data-fav-id="${f.id}" style="width:160px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${assetOptsFor(f.asset_id||'')}</select></td>
            <td style="vertical-align:top"><select class="fav-personne" data-fav-id="${f.id}" style="width:140px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${personneOptsFor(f.famille_id||'')}</select></td>
            <td style="vertical-align:top"><select class="fav-wo" data-fav-id="${f.id}" style="width:160px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${woOptsFor(f.wo_id||'')}</select></td>
            <td style="vertical-align:top"><select class="fav-chantier" data-fav-id="${f.id}" style="width:150px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${chantierOptsFor(f.chantier_id||'')}</select></td>
            <td style="vertical-align:top">
              <select class="fav-motif" data-fav-id="${f.id}" style="width:110px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;margin-bottom:3px">${motifOptsFor(MOTIFS.includes(f.motif)?f.motif:'')}</select>
              <input class="fav-motif-autre" data-fav-id="${f.id}" value="${(f.motif&&!MOTIFS.includes(f.motif))?f.motif.replace(/"/g,'&quot;'):''}" placeholder="Autre motif..." style="width:110px;padding:4px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px;margin-bottom:3px">
              <input type="number" step="1" class="fav-conso-eau" data-fav-id="${f.id}" value="${f.consommation_m3||''}" placeholder="Conso eau (m³)" title="Si c'est une facture d'eau : consommation totale indiquée sur la facture, pour calculer le tarif moyen au m³" style="width:110px;padding:4px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px">
            </td>
            <td style="vertical-align:top"><select class="fav-compte" data-fav-id="${f.id}" style="width:110px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${compteOptsFor(compteGuess(f))}</select></td>
            <td style="vertical-align:top"><input type="date" class="fav-date-paiement" data-fav-id="${f.id}" style="width:130px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
            <td style="white-space:nowrap;vertical-align:top;padding-top:8px">
              <button class="btn btn-sm btn-p" data-fav-valider="${f.id}" title="Valider et enregistrer dans les factures">✅</button>
              <button class="btn btn-sm" data-fav-devis="${f.id}" title="Ce n'est pas une facture mais un devis — le rattacher au BT ou au chantier choisi ci-dessus" style="margin-left:3px">📐</button>
              <button class="btn btn-sm" data-fav-classer="${f.id}" title="Ce n'est pas une facture mais un document à archiver (DPE, diagnostic...) — le ranger dans la fiche du bien" style="margin-left:3px">📄</button>
              <button class="btn btn-sm btn-d" data-fav-rejeter="${f.id}" title="Rejeter (n'est pas une facture)" style="margin-left:3px">🚫</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>
      ${pending.length>pendingVisible.length?`<div style="text-align:center;margin-top:10px"><button class="btn btn-sm" id="btn-fav-load-more">Afficher ${Math.min(favPageSize,pending.length-pendingVisible.length)} de plus</button></div>`:''}`:''}
    </div>`;
  }

  const rowHtml=(f)=>{
    const rapBg=estPaye(f)?'':'background:var(--amber-bg)';
    const driveIcon=(f.drive_url||f.document_url)?`<a href="${f.drive_url||f.document_url}" target="_blank" title="Voir la pièce jointe" style="text-decoration:none;background:var(--bg2);border:0.5px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px">📄 PJ</a>`:'';
    const wo=f.wo_id?S.workOrders.find(w=>w.id===f.wo_id):null;
    return `<tr style="${rapBg}">
      <td style="font-size:12px;white-space:nowrap">${dateLabel(f.date)}</td>
      <td style="font-weight:500;font-size:13px">${f.fournisseur||'—'} ${driveIcon}</td>
      <td style="font-size:12px;color:var(--text2);max-width:180px">${f.description||'—'}</td>
      <td><span class="badge bblue" style="font-size:10px">${f.categorie||'—'}</span></td>
      <td style="font-size:11px;color:var(--blue)">${wo?((canEdit()||isAdmin())?`<span style="cursor:pointer;text-decoration:underline" data-edit-wo="${wo.id}" title="Modifier ce bon de travaux">${wo.title}</span>`:wo.title):'—'}</td>
      <td style="font-size:12px">${f.montant_ht?fmt(f.montant_ht):'—'}</td>
      <td style="font-size:12px;color:var(--amber)">${f.tva?fmt(f.tva):'—'}</td>
      <td style="font-weight:700;color:var(--red)">${fmt(f.montant_ttc)}</td>
      <td style="font-size:11px;white-space:nowrap">${estPaye(f)?dateLabel(f.date_paiement):'<span style="color:var(--amber)">—</span>'}</td>
      <td style="white-space:nowrap">
        ${canEdit()?`<button class="btn btn-sm" data-edit-fact="${f.id}">✎</button>`:''}
        ${isAdmin()?`<button class="btn btn-d btn-sm" data-del-fact="${f.id}">✕</button>`:''}
      </td>
    </tr>`;
  };
  const tableHtml=(rows)=>`<div style="overflow-x:auto"><table>
      <thead><tr>
        <th>Date</th><th>Fournisseur</th><th>Description</th><th>Catégorie</th>
        <th>BT lié</th><th>HT</th><th>TVA</th><th>TTC</th><th>Payée</th><th></th>
      </tr></thead>
      <tbody>${rows.map(rowHtml).join('')}</tbody>
    </table></div>`;

  // Groupe par bien (1er segment du libelle "Bien - Zone - SousZone"), puis
  // par zone/sous-zone (reste du libelle), puis par motif. Une facture sans
  // bien mais liee a un equipement ou une personne a droit a son propre
  // groupe (ex: "EVOK", "Antoine") plutot que de finir dans un fourre-tout -
  // evite de tout re-parcourir en vrac quand il y a des dizaines de factures
  // sur plusieurs biens/equipements/personnes et plusieurs types de travaux.
  const SANS_BIEN='— Sans bien / équipement / personne —';
  const SANS_MOTIF='Sans motif';
  const groups=new Map();
  facts.forEach(f=>{
    const bienStr=(f.bien||'').trim();
    let top,sub;
    const wo=f.wo_id?S.workOrders.find(w=>w.id===f.wo_id):null;
    const chantier=(wo?.chantier_id?S.chantiers.find(c=>c.id===wo.chantier_id):null)
      ||(f.chantier_id?S.chantiers.find(c=>c.id===f.chantier_id):null);
    if(bienStr){
      const parts=bienStr.split(' - ');top='🏠 '+parts[0];sub=parts.slice(1).join(' › ');
    }else if(chantier){
      // BT lie a un chantier, ou facture liee directement a un chantier sans
      // BT (ex: piscine avec plusieurs artisans, pas de decoupage par corps
      // de metier) - regroupe par chantier plutot que dans le vrac.
      top='🏗️ '+chantier.nom;sub='';
    }else if(f.asset_id){
      const asset=S.assets.find(a=>a.id===f.asset_id);
      top=asset?'🔧 '+asset.name:SANS_BIEN;sub='';
    }else if(f.famille_id){
      const personne=S.famille.find(p=>p.id===f.famille_id);
      top=personne?'👤 '+personne.prenom+(personne.nom?' '+personne.nom:''):SANS_BIEN;sub='';
    }else{
      top=SANS_BIEN;sub='';
    }
    const motif=f.motif||SANS_MOTIF;
    if(!groups.has(top))groups.set(top,new Map());
    const subMap=groups.get(top);
    if(!subMap.has(sub))subMap.set(sub,new Map());
    const motifMap=subMap.get(sub);
    if(!motifMap.has(motif))motifMap.set(motif,[]);
    motifMap.get(motif).push(f);
  });
  const topNames=[...groups.keys()].sort((a,b)=>a===SANS_BIEN?1:b===SANS_BIEN?-1:a.localeCompare(b));
  const sortMotifs=(labels)=>labels.sort((a,b)=>a===SANS_MOTIF?1:b===SANS_MOTIF?-1:a.localeCompare(b));

  return `${tabBar}${yearBar}
  <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <div class="stat" style="flex:1"><div class="stat-l">Total ${fTab==='savadur'?'SAVADUR':'Perso'} ${S.factYear||''}</div><div class="stat-v" style="color:var(--red)">${fmt(totalTTC)}</div></div>
    <div class="stat" style="flex:1"><div class="stat-l">Non rapprochées</div><div class="stat-v" style="color:${nonRappr>0?'var(--amber)':'var(--green)'}">${nonRappr}</div></div>
    <div class="stat" style="flex:1"><div class="stat-l">Nb factures</div><div class="stat-v">${facts.length}</div></div>
  </div>
  ${facts.length===0?'<div class="card" style="text-align:center;padding:20px;color:var(--text2)">Aucune facture. Cliquez "+ Facture" pour commencer.</div>':''}
  ${topNames.map(top=>{
    const subMap=groups.get(top);
    const subLabels=[...subMap.keys()].sort((a,b)=>a===''?-1:b===''?1:a.localeCompare(b));
    const allRows=[...subMap.values()].flatMap(motifMap=>[...motifMap.values()].flat());
    const totalBien=allRows.reduce((s,f)=>s+parseFloat(f.montant_ttc||0),0);
    return `<div class="card" style="margin-bottom:14px">
      <div class="sec" style="margin-bottom:8px">${top} — ${allRows.length} facture(s), ${fmt(totalBien)}</div>
      ${subLabels.map(sub=>{
        const motifMap=subMap.get(sub);
        const motifLabels=sortMotifs([...motifMap.keys()]);
        return `
          ${sub?`<div style="font-size:12px;font-weight:600;color:var(--text2);margin:10px 0 6px">📁 ${sub}</div>`:''}
          ${motifLabels.map(motif=>`
            <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 4px 0;padding-left:${sub?'12px':'0'}">${motif}</div>
            ${tableHtml(motifMap.get(motif))}
          `).join('')}
        `;
      }).join('')}
    </div>`;
  }).join('')}`;
}

  const tabBar='<div class="tab-bar" style="margin-bottom:14px">'
    +'<div class="tab '+(cTab==='liste'?'active':'')+'" data-ctab="liste">Compteurs</div>'

    +'</div>';

  if(cTab==='liste'){
    const rows=(S.compteurs||[]).map(function(c){
      const tenant=c.tenant_id?S.tenants.find(t=>t.id===c.tenant_id):null;
      const lastRel=(S.releves||[]).filter(r=>r.compteur_id===c.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      return '<div class="card" style="margin-bottom:10px">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'

            +'<div style="font-weight:600;font-size:14px">'+c.name+'</div>'
            +'<div style="font-size:12px;color:var(--text2)">'+(c.type||'')+' \u2014 '+(c.unite||'m\u00b3')+' \u2014 '+fmt(c.prix_unitaire||0)+'/'+( c.unite||'m\u00b3')+'</div>'
            +(tenant?'<div style="font-size:11px;color:var(--text2)">&#128100; '+(tenant.nom||'')+' \u2014 '+(tenant.logement||'')+'</div>':'')
          +'</div>'
          +'<div style="text-align:right">'
            +(lastRel?'<div style="font-size:12px">Dernier index : <strong>'+lastRel.nouvel_index+' '+(c.unite||'m\u00b3')+'</strong></div>':'<div style="font-size:12px;color:var(--text2)">Index initial : '+(c.index_initial||0)+'</div>')
            +(lastRel?'<div style="font-size:11px;color:var(--text2)">le '+dateLabel(lastRel.date)+'</div>':'')
