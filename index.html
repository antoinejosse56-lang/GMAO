<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3;min-height:100vh}
:root{--bg:#fff;--bg2:#f5f5f3;--bg3:#efefec;--border:#e5e5e0;--border2:#d0d0ca;--text:#1a1a1a;--text2:#6b6b68;--text3:#9b9b98;--green:#1D9E75;--green-bg:#E1F5EE;--green-text:#0F6E56;--amber:#BA7517;--amber-bg:#FAEEDA;--red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;--blue:#185FA5;--blue-bg:#E6F1FB;--teal-bg:#E1F5EE;--purple-bg:#EEEDFE;--purple-text:#534AB7;--radius:8px;--radius-lg:12px}
/* dark mode disabled */
html,body{color-scheme:light!important;background:#fff!important;color:#1a1a1a!important}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;min-width:210px;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-header{padding:14px 16px;border-bottom:0.5px solid var(--border)}
.logo{font-size:15px;font-weight:600}.logo span{color:var(--green)}
.nav-section{padding:6px 0}
.nav-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 14px 3px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text2);transition:background .1s;border-radius:0}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--bg2);color:var(--text);font-weight:500}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.bgreen{background:var(--green-bg);color:var(--green-text)}.bamber{background:var(--amber-bg);color:var(--amber)}.bred{background:var(--red-bg);color:var(--red-text)}.bblue{background:var(--blue-bg);color:var(--blue)}.bteal{background:var(--teal-bg);color:var(--green-text)}.bpurple{background:var(--purple-bg);color:var(--purple-text)}.bgray{background:var(--bg3);color:var(--text2)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sidebar{transition:transform .25s ease,width .25s ease}
.sidebar.collapsed{width:0!important;min-width:0!important;overflow:hidden;border:none}
.hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;cursor:pointer;border-radius:8px;background:var(--bg2);border:0.5px solid var(--border2);flex-shrink:0}
.hamburger svg{width:18px;height:18px;stroke:var(--text);stroke-width:2;fill:none}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;cursor:pointer}
@media(max-width:768px){
  .hamburger{display:flex}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:100;transform:translateX(-100%);width:220px!important;min-width:220px!important;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main{width:100vw}
  .topbar{padding:10px 12px;gap:8px}
}
.topbar{height:50px;background:var(--bg);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:500;flex:1}
.btn{padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;transition:background .1s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--green);border-color:var(--green);color:#fff}.btn-p:hover{background:var(--green-text)}
.btn-d{background:var(--red);border-color:var(--red);color:#fff}.btn-d:hover{background:var(--red-text)}
.btn-sm{padding:3px 8px;font-size:11px}
.content{flex:1;overflow-y:auto;padding:18px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--bg2);border-radius:var(--radius);padding:11px}
.stat-v{font-size:22px;font-weight:500;margin-top:2px}
.stat-l{font-size:11px;color:var(--text2)}
.sec{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.row:last-child{border-bottom:none}
.fg{flex:1}
.fgs{font-size:13px;font-weight:500}
.fgsub{font-size:11px;color:var(--text2);margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;font-weight:500;font-size:11px;color:var(--text2);border-bottom:0.5px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
td{padding:7px 10px;border-bottom:0.5px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 9px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.form-group textarea{min-height:70px;resize:vertical}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:20px;width:500px;max-width:96%;max-height:85vh;overflow-y:auto}
.modal-hd{font-size:14px;font-weight:500;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.xbtn{cursor:pointer;font-size:20px;color:var(--text2);background:none;border:none;line-height:1;padding:0}
.tab-bar{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap}
.tab.active{color:var(--text);font-weight:500;border-bottom-color:var(--green)}
.tab:hover{color:var(--text)}
.alert-r{padding:9px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;background:var(--red-bg);color:var(--red-text);border:0.5px solid #F7C1C1}
.alert-a{padding:9px 12px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;background:var(--amber-bg);color:var(--amber);border:0.5px solid #FAC775}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg2)}
.login-box{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:28px;width:320px}
.split{display:flex;gap:14px;height:calc(100vh - 86px);overflow:hidden}
.split-left{width:260px;min-width:180px;overflow-y:auto}
.split-right{flex:1;overflow-y:auto}
.mobile-back{display:none}
/* Topologie des biens : l'arbre a largeur fixe (260px) ecrasait le panneau
   de detail sur mobile, rendant les infos du bien illisibles - empile les
   deux colonnes et masque l'arbre des qu'un bien est selectionne (classe
   .has-prop), avec un lien de retour dedie. Bloc separe du media query du
   haut : les regles split et mobile-back sont definies plus bas dans la
   feuille, un media query plus haut serait donc ecrase par elles (meme
   specificite, ordre source). */
@media(max-width:768px){
  .split{flex-direction:column;height:auto;overflow:visible}
  .split-left,.split-right{width:100%}
  .split.has-prop .split-left{display:none}
  .mobile-back{display:block;color:var(--blue);font-size:13px;padding:8px 0;cursor:pointer}
}
.tree-row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:var(--radius);cursor:pointer;font-size:13px}
.tree-row:hover{background:var(--bg2)}
.tree-row.selected{background:var(--bg2);font-weight:500}
.tree-children{margin-left:18px;border-left:0.5px solid var(--border);padding-left:8px}
.tree-toggle{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2);flex-shrink:0}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--green-bg);color:var(--green-text);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;border:0.5px solid var(--border2);color:var(--text2);cursor:pointer}
.pill:hover{background:var(--bg2)}
.pill.active{background:var(--green);border-color:var(--green);color:#fff}
.wo-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:10px}
.tool-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;font-size:13px;color:var(--text2);flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>

// PROFIL DUBAIL — filtre sur 26 rue Général Dubail
// ============================================================
function isDubailProfile(){
  const u=S.currentUser;
  if(!u||u.role==='admin')return false;
  // Check profile field OR if visible_tabs contains locatif but not tools (= dubail pattern)
  if(u.profile==='dubail')return true;
  // Fallback: if user has visible_tabs set with locatif but no tools/etiquettes
  if(u.visible_tabs&&u.visible_tabs.length>0){
    const vt=u.visible_tabs;
    if(vt.includes('locatif')&&!vt.includes('tools'))return true;
  }
  return false;
}
function dubailFilter(str){
  const s=(str||'').toLowerCase();
  return s.includes('dubail');
}

// / consommation_m3) plutot que ressaisi a la main a chaque releve - evite
// l'oubli de mise a jour quand le tarif de l'agglo augmente.
function lastTarifEau(){
  const facts=(S.factures||[]).filter(f=>f.motif==='Eau'&&f.consommation_m3>0&&f.montant_ttc>0)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  const f=facts[0];
  if(!f)return null;
  return {tarif:Math.round((f.montant_ttc/f.consommation_m3)*1000)/1000,facture:f};
}
// Montant total de taxe fonciere enregistre pour l'immeuble Dubail pour une
// annee donnee (somme si plusieurs lignes, ex: acompte + solde).
function tfTotalForYear(year){
  const facts=(S.factures||[]).filter(f=>f.motif==='Taxe foncière'&&dubailFilter(f.bien||'')&&(f.date||'').startsWith(String(year)));
  if(!facts.length)return null;
  return Math.round(facts.reduce((s,f)=>s+(f.montant_ttc||0),0)*100)/100;
}
// Determine si une regularisation TF est due pour un locataire commercial :
// bail toujours actif, surface renseignee, anniversaire du bail deja passe
// cette annee, et la TF de l'annee suivant la derniere regularisation est
// disponible. Ne calcule jamais rien pour un locataire parti (actif=false) -
// on ne facture pas retroactivement quelqu'un qui n'occupe plus le local.
function tfRegulStatus(tenant){
  if(tenant.actif===false||!tenant.tf_surface_m2||!tenant.tf_surface_totale_m2||!tenant.date_entree)return null;
  const today=new Date();
  const entree=new Date(tenant.date_entree);
  const anniversaireCetteAnnee=new Date(today.getFullYear(),entree.getMonth(),entree.getDate());
  if(anniversaireCetteAnnee>today)return null; // anniversaire pas encore passe cette annee
  const derniereAnnee=tenant.tf_dernier_regul_annee||entree.getFullYear();
  const anneeACalculer=derniereAnnee+1;
  if(anneeACalculer>today.getFullYear())return null; // deja a jour
  const tfAnnee=tfTotalForYear(anneeACalculer);
  const tfPrecedente=tfTotalForYear(anneeACalculer-1);
  if(tfAnnee==null||tfPrecedente==null)return null; // facture TF pas encore recue/validee
  const fraction=tenant.tf_surface_m2/tenant.tf_surface_totale_m2;
  const augmentationAnnuelleHT=Math.round((tfAnnee-tfPrecedente)*fraction*100)/100;
  return {annee:anneeACalculer,tfAnnee,tfPrecedente,fraction,augmentationAnnuelleHT};
}

// Calcule le "bien" a stocker pour l'archivage/regroupement d'une facture ou
// d'un devis lie a un bon de travaux. Si ce BT appartient a un chantier, le
// chemin devient <bien si connu> - <chantier> - <titre du BT> (ex: "17 rue
// fleuriot de langle - Extension - Maçonnerie") plutot que bien/zone/motif -
// le chantier + le BT (le corps de metier) categorisent deja suffisamment,
// pas besoin d'un niveau "motif" en plus. Sans chantier, comportement normal
// (chemin topologique complet du BT).
function bienForWorkOrder(wo){
  if(!wo)return '';
  if(wo.chantier_id){
    const chantier=S.chantiers.find(c=>c.id===wo.chantier_id);
    if(chantier){
      // chantier.bien est la source fiable du bien reel (un chantier neuf n'a
      // souvent pas de topo_ref sur ses BT) - on ne retombe sur le topo_ref du
      // BT que si le chantier lui-meme n'a pas de bien renseigne.
      const segments=[chantier.bien||wo.topo_ref?.propName||'',chantier.nom,wo.title].filter(Boolean);
      return segments.join(' - ');
    }
  }
  return wo.topo_ref?[wo.topo_ref.propName,wo.topo_ref.zoneName,wo.topo_ref.subName].filter(Boolean).join(' - '):'';
}
// Cree l'artisan dans la liste des fournisseurs s'il n'y existe pas deja
// (comparaison insensible a la casse), lors de la validation d'une facture

// validee, sans jamais rejoindre la liste "Artisans" ni ses coordonnees
// (tel/email). Retourne le fournisseur (existant ou nouvellement cree).
async function ensureFournisseur(nom){
  if(!nom)return null;
  const existing=(S.fournisseurs||[]).find(f=>(f.nom||'').trim().toLowerCase()===nom.trim().toLowerCase());
  if(existing)return existing;
  const{data,error}=await sb.from('fournisseurs').insert({nom:nom.trim()}).select().single();
  if(error){console.warn('Création artisan échouée :',error.message);return null;}

}
// Reconstruit un topo_ref {propId,propName,zoneId,zoneName,subId,subName} a
// partir d'un texte "Bien - Zone - SousZone" (format utilise par le champ
// bien des factures) - permet a un BT cree a la volee depuis une facture de
// rester rattache a son bien/zone, sinon il n'apparait plus dans la liste des
// BT des qu'un filtre par bien y est applique (topo_ref absent = exclu).
function resolveTopoRefFromBienStr(bienStr){
  const parts=(bienStr||'').split(' - ').map(s=>s.trim()).filter(Boolean);
  if(!parts.length)return null;
  const prop=S.topology.properties.find(p=>p.name===parts[0]);
  if(!prop)return null;
  const zone=parts[1]?(prop.zones||[]).find(z=>z.name===parts[1]):null;
  const sub=(zone&&parts[2])?(zone.subZones||[]).find(s=>s.name===parts[2]):null;
  return {propId:prop.id,propName:prop.name,zoneId:zone?.id||null,zoneName:zone?.name||'',subId:sub?.id||null,subName:sub?.name||''};
}
// Options <option> pour un select "BT lie", filtrees par bien et/ou chantier
// choisis (le BT selectionnable doit appartenir a ce chantier, et/ou son
// chemin topologique doit correspondre au bien choisi ou etre plus precis) -
// evite de proposer des BT sans rapport une fois qu'un bien/chantier est fixe.
function computeFilteredWoOpts(bienStr, chantierId, selectedWoId, allowNew, assetId){
  const bien=(bienStr||'').trim();
  let list=[...S.workOrders];
  // Un chantier determine deja pleinement le perimetre des BT concernes -
  // filtrer EN PLUS par bien exclurait a tort les BT de chantier sans
  // topo_ref (frequent pour une construction neuve), donc le chantier prime
  // et remplace le filtre par bien plutot que de s'y ajouter. L'equipement/
  // vehicule lie (assetId) suit la meme logique de priorite - une facture
  // liee a un vehicule veut voir SES BT, pas tous les BT du bien general.
  if(chantierId){
    list=list.filter(w=>w.chantier_id===chantierId);
  } else if(bien){
    list=list.filter(w=>{
      const tr=w.topo_ref;
      if(!tr)return false;
      const full=[tr.propName,tr.zoneName,tr.subName].filter(Boolean).join(' - ');
      return full===bien||full.startsWith(bien+' - ');
    });
  } else if(assetId){
    list=list.filter(w=>w.asset_id===assetId);
  }
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  let html='<option value="">— Aucun BT —</option>'+(allowNew?'<option value="__new__">+ Nouveau BT…</option>':'');
  list.forEach(w=>{
    html+='<option value="'+w.id+'"'+(w.id===selectedWoId?' selected':'')+'>'+w.title+(w.status==='done'?' (terminé)':'')+'</option>';
  });
  return html;
}

// PostgREST plafonne chaque requete a "Max Rows" (1000 par defaut cote Supabase),
// meme si .range() en demande plus - il faut paginer cote client pour tout recuperer.
async function fetchAllRows(table, orderCol, ascending){
  let all=[], from=0;
  const pageSize=1000;
  while(true){
    const {data,error}=await sb.from(table).select('*').order(orderCol,{ascending}).range(from, from+pageSize-1);
    if(error) return {data: all.length?all:null, error};
    all=all.concat(data||[]);
    if(!data || data.length<pageSize) break;
    from+=pageSize;
  }
  return {data:all, error:null};
}

// Capture de paraphe/signature sur canvas (Pointer Events - unifie souris,
// tactile et stylet en une seule API, cohérent avec touch-action:none deja
// pose sur ces canvas). Idempotent : reappeler sur un canvas deja initialise
// ne double pas les listeners (utile puisque render() peut re-render le
// modal sans recreer le DOM a chaque frappe).
function initSigCanvas(canvasId){
  const canvas=document.getElementById(canvasId);
  // Le flag est pose sur l'element DOM lui-meme (pas un Set global d'ids) :
  // fermer puis rouvrir le modal recree un nouveau <canvas> avec le meme id,
  // qui doit etre reinitialise - un Set global le bloquerait a tort.
  if(!canvas||canvas.dataset.sigInit)return;
  canvas.dataset.sigInit='1';
  const ctx=canvas.getContext('2d');
  ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1a1a1a';
  let drawing=false,lastX=0,lastY=0;
  function pos(e){
    const r=canvas.getBoundingClientRect();
    return [(e.clientX-r.left)*(canvas.width/r.width),(e.clientY-r.top)*(canvas.height/r.height)];
  }
  canvas.addEventListener('pointerdown',e=>{
    drawing=true;canvas.setPointerCapture(e.pointerId);
    [lastX,lastY]=pos(e);
  });
  canvas.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const [x,y]=pos(e);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();
    [lastX,lastY]=[x,y];
  });
  const stop=()=>{drawing=false;};
  canvas.addEventListener('pointerup',stop);
  canvas.addEventListener('pointerleave',stop);
  canvas.addEventListener('pointercancel',stop);
}
function clearSig(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}
// Un canvas jamais dessine reste entierement blanc/transparent - on ne veut
// pas l'inserer dans le PDF genere (page avec un rectangle blanc inutile),
// donc on detecte s'il contient reellement un trait avant de l'exporter.
function sigDataUrl(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return null;
  const ctx=canvas.getContext('2d');
  const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  for(let i=3;i<data.length;i+=4){if(data[i]!==0)return canvas.toDataURL('image/png');}
  return null;
}
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/86400000);}
// Duree de validite reglementaire de chaque diagnostic (mois) - null = pas de
// limite de validite dans le temps (amiante/bruit/mesurage restent valables
// tant qu'aucune renovation ne les remet en cause). ERP = 6 mois seulement,
// bien plus court que les autres, a ne pas oublier lors d'un changement de
// locataire ou d'un simple renouvellement periodique.
const DIAG_VALIDITY_MONTHS={dpe:120,elec:72,gaz:72,plomb:72,amiante:null,erp:6,bruit:null,surface:null,termites:6};
const DIAG_LABELS={dpe:'DPE — Diagnostic de performance énergétique',elec:'Diagnostic électrique',gaz:'Diagnostic gaz',plomb:"Constat de risque d'exposition au plomb (CREP)",amiante:'Diagnostic amiante',erp:'État des risques et pollutions (ERP)',bruit:'Information bruit / zone aéroportuaire',surface:'Mesurage loi Carrez / Boutin'};
// Fait le lien entre le libelle "type" choisi dans le formulaire "+ Document"
// (fiche du bien) et la clef de validite utilisee par DIAG_VALIDITY_MONTHS -
// permet de calculer automatiquement la date d'expiration au lieu de la
// laisser a la saisie manuelle (souvent oubliee).
const DOC_TYPE_TO_DIAG_KEY={'DPE':'dpe','Diagnostic amiante':'amiante','Diagnostic plomb':'plomb','Diagnostic électricité':'elec','Diagnostic gaz':'gaz','Diagnostic termites':'termites','ERP':'erp','Carrez':'surface'};
function updateBienDocExpiry(){
  const type=document.getElementById('m-bdoctype')?.value;
  const dateVal=document.getElementById('m-bdocdate')?.value;
  const expInput=document.getElementById('m-bdocexp');
  const key=DOC_TYPE_TO_DIAG_KEY[type];
  if(!expInput||!key||!dateVal)return;
  const exp=diagExpiry(dateVal,key);
  expInput.value=exp?exp.toISOString().slice(0,10):'';
}
function diagExpiry(dateStr,key){
  const months=DIAG_VALIDITY_MONTHS[key];
  if(!dateStr||months==null)return null;
  const d=new Date(dateStr);d.setMonth(d.getMonth()+months);
  return d;
}
function diagIsExpired(dateStr,key){
  const exp=diagExpiry(dateStr,key);
  return exp?exp<new Date():false;
}
// Diagnostics legalement obligatoires pour signer un bail d'habitation
// (bruit/surface restent situationnels, non bloquants). Utilise pour
// determiner si un bail peut etre genere pour ce logement.
const REQUIRED_DIAG_KEYS=['dpe','elec','gaz','plomb','amiante','erp'];
function logementDiagStatus(bienStr){
  const norm=normBienSep(bienStr);
  const docs=(S.bienDocuments||[]).filter(d=>normBienSep(d.bien)===norm);
  const lf=findLogementFiche(bienStr);
  // Le gaz ne s'exclut que si explicitement marque absent sur la fiche du
  // logement (gaz_present===false) - "inconnu" (null/non renseigne) reste
  // obligatoire par defaut, plus sur que de supposer son absence.
  const keys=(lf?.gaz_present===false)?REQUIRED_DIAG_KEYS.filter(k=>k!=='gaz'):REQUIRED_DIAG_KEYS;
  return keys.map(key=>{
    const matching=docs.filter(d=>DOC_TYPE_TO_DIAG_KEY[d.type]===key).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    const doc=matching[0]||null;
    const expired=doc?(doc.date_expiry?new Date(doc.date_expiry)<new Date():false):false;
    return {key,label:DIAG_LABELS[key],doc,missing:!doc,expired};
  });
}
function dateLabel(d){if(!d)return '—';return new Date(d).toLocaleDateString('fr-FR');}
// Normalise le separateur d'un chemin "bien" pour comparaison : le champ
// logement d'un locataire utilise un tiret cadratin (—) alors que le chemin
// topologique (bienStr) utilise un tiret simple (" - ") - meme physique,
// notation differente selon l'origine. Utilise partout ou l'on doit relier
// un locataire/une fiche logement a son noeud topologique.
function normBienSep(s){return (s||'').replace(/—/g,'-').replace(/\s*-\s*/g,' - ').trim();}
function findLogementFiche(bienStr){
  const norm=normBienSep(bienStr);
  return (S.logementFiches||[]).find(f=>normBienSep(f.bien)===norm);
}

      sb.from('topology').select('*').limit(1),
      sb.from('revenues').select('*'),
      sb.from('compteurs').select('*'),
      sb.from('releves').select('*').order('date', {ascending: false}),
      sb.from('tenants').select('*'),
      sb.from('rent_payments').select('*'),
      sb.from('rangements').select('*').order('nom'),
      sb.from('famille').select('*').order('prenom'),

      sb.from('ecole_saisies').select('*').order('annee',{ascending:false}).order('mois',{ascending:false}).order('jour',{ascending:false}),

      sb.from('fournisseurs').select('*').order('nom'),
      sb.from('chantiers').select('*').order('created_at',{ascending:false}),
      sb.from('devis').select('*'),
      fetchAllRows('devis_a_valider','created_at',false),
      sb.from('bien_documents').select('*').order('created_at',{ascending:false}),
      sb.from('tf_regularisations').select('*'),
      sb.from('logement_fiches').select('*'),
      sb.from('logement_edl').select('*').order('created_at',{ascending:false})
    ]);

    // Only block on critical tables
    for (const [name, res] of [['users',u],['assets',a],['work_orders',wo]]) {
      if (res.error) { showError(`Table "${name}" : ${res.error.message}`); return; }
    }
    // Non-blocking tables
    for (const [name, res] of [['tools',tl],['loans',l],['maintenance_templates',mt],['topology',topo],['revenues',rev],['compteurs',cpt],['releves',rel],['tenants',ten],['rent_payments',rp]]) {
      if (res.error) { console.warn(`Table "${name}" non disponible:`, res.error.message); }
    }
    // Rangements — non-bloquant si table pas encore créée
    if (rng.error) { console.warn('Table rangements manquante — créez-la dans Supabase'); }

    S.users = u.data || [];

    if (logFichesRes?.error) console.warn('Table logement_fiches non disponible:', logFichesRes.error.message);

    if (logEdlRes?.error) console.warn('Table logement_edl non disponible:', logEdlRes.error.message);
    S.logementEdl = logEdlRes?.error ? [] : (logEdlRes?.data || []);
    const loadedTopo = topo.data?.[0]?.data;
    S.topoId = topo.data?.[0]?.id;
    if(loadedTopo?.properties?.length){
      // Valid data loaded — save backup in localStorage
      S.topology = loadedTopo;
      try{localStorage.setItem('gmao_topo_backup', JSON.stringify({data:loadedTopo,id:S.topoId,ts:new Date().toISOString()}));}catch(e){}
    } else {
      // Empty from Supabase — try localStorage backup before giving up
      try{
        const bk=JSON.parse(localStorage.getItem('gmao_topo_backup')||'null');
        if(bk?.data?.properties?.length){
          console.warn('Topologie vide depuis Supabase — restauration depuis backup localStorage du '+bk.ts);
          S.topology = bk.data;
          S.topoId = bk.id;
          // Restore to Supabase immediately
          if(S.topoId) await sb.from('topology').update({data:S.topology,updated_at:new Date().toISOString()}).eq('id',S.topoId);
        } else {
          S.topology = loadedTopo || {properties:[]};
        }
      }catch(e){S.topology = loadedTopo || {properties:[]};}
    }

    S.topoState.zoneId=null;S.topoState.subZoneId=null;S.topoState.tradeId=null;
  } catch(e) {
    console.error('Load error', e);
    showError(e.message || 'Erreur inconnue — vérifiez votre connexion internet');
  }
}


// Retourne les IDs d'assets liés à Dubail
function getDubailAssetIds(){
  const ids=new Set();
  // Find dubail property in topology
  S.topology.properties.forEach(p=>{
    if(!dubailFilter(p.name))return;
    // Add asset linked to this property node
    if(p.assetId)ids.add(p.assetId);
    (p.assetIds||[]).forEach(id=>ids.add(id));
    (p.zones||[]).forEach(z=>{
      if(z.assetId)ids.add(z.assetId);
      (z.assetIds||[]).forEach(id=>ids.add(id));
      (z.subZones||[]).forEach(s=>{
        if(s.assetId)ids.add(s.assetId);
        (s.assetIds||[]).forEach(id=>ids.add(id));
      });
    });
  });
  // Also match by asset name or location
  S.assets.forEach(a=>{
    if(dubailFilter(a.name)||dubailFilter(a.location||''))ids.add(a.id);
  });
  return ids;
}

// Version generique de getDubailAssetIds() pour un profil restreint a UN
// bien precis (ex: "Famille JOSSE MUSEUX" -> Rue CALVIN) : cascade
// bien -> zones -> sous-zones et retourne tous les assetId lies.
function getPropertyAssetIds(propName){
  const ids=new Set();
  const prop=S.topology.properties.find(p=>p.name===propName);
  if(!prop)return ids;
  if(prop.assetId)ids.add(prop.assetId);
  (prop.zones||[]).forEach(z=>{
    if(z.assetId)ids.add(z.assetId);
    (z.subZones||[]).forEach(s=>{if(s.assetId)ids.add(s.assetId);});
  });
  return ids;
}
// Resout les assetId d'un topo_ref (bien/zone/sous-zone d'un BT) en
// remontant les 3 niveaux - utilise pour comparer a visible_assets, qui
// contient des assetId et non des ids de noeuds de topologie.
function topoRefNodeAssetIds(tr){
  const ids=[];
  if(!tr)return ids;
  const prop=S.topology.properties.find(p=>p.id===tr.propId);
  if(!prop)return ids;
  if(prop.assetId)ids.push(prop.assetId);
  const zone=tr.zoneId?prop.zones?.find(z=>z.id===tr.zoneId):null;
  if(!zone)return ids;
  if(zone.assetId)ids.push(zone.assetId);
  const sub=tr.subId?zone.subZones?.find(s=>s.id===tr.subId):null;
  if(sub?.assetId)ids.push(sub.assetId);
  return ids;
}
// Une facture est dans le perimetre visible_assets d'un utilisateur restreint
// si elle est rattachee directement a un equipement autorise, ou via son
// bien (chaine "Bien - Zone - SousZone"), le BT qu'elle referme, ou le
// chantier auquel elle est directement liee (sans BT).
function isFactureInVisibleScope(f,va){
  if(f.asset_id&&va.includes(f.asset_id))return true;
  if(f.bien){
    const tr=resolveTopoRefFromBienStr(f.bien);
    if(tr&&topoRefNodeAssetIds(tr).some(id=>va.includes(id)))return true;
  }
  if(f.wo_id){
    const w=S.workOrders.find(x=>x.id===f.wo_id);
    if(w){
      if(w.asset_id&&va.includes(w.asset_id))return true;
      if(w.topo_ref&&topoRefNodeAssetIds(w.topo_ref).some(id=>va.includes(id)))return true;
    }
  }
  if(f.chantier_id){
    const c=S.chantiers.find(x=>x.id===f.chantier_id);
    if(c?.bien){
      const tr=resolveTopoRefFromBienStr(c.bien);
      if(tr&&topoRefNodeAssetIds(tr).some(id=>va.includes(id)))return true;
    }
  }
  return false;
}

// Retourne les BT filtrés selon le profil
function getFilteredWOs(){
  const u=S.currentUser;
  if(!u||u.role==='admin')return S.workOrders;
  // If user has explicit visible_assets, filter WOs by those assets
  const va=u.visible_assets||u.assets||[];
  if(va.length>0){
    return S.workOrders.filter(w=>{
      if(!w.asset_id&&!w.topo_ref)return false; // no link = hide
      if(w.asset_id&&va.includes(w.asset_id))return true;
      if(w.topo_ref){
        // Check si le bien, la zone OU la sous-zone du topo_ref a un asset
        // dans visible_assets (topo_ref n'a jamais de champ .assetId propre -
        // il faut le resoudre via la topologie, cf topoRefNodeAssetIds).
        if(topoRefNodeAssetIds(w.topo_ref).some(id=>va.includes(id)))return true;
        // Fallback: dubail name check
        if(isDubailProfile()&&dubailFilter(w.topo_ref.propName||''))return true;
      }
      return false;
    });
  }
  if(!isDubailProfile())return S.workOrders;
  // Dubail without explicit assets: filter by topo_ref or asset name
  const dubailAssetIds=getDubailAssetIds();
  return S.workOrders.filter(w=>{
    const tr=w.topo_ref;
    if(tr&&dubailFilter(tr.propName||''))return true;
    if(w.asset_id){
      if(dubailAssetIds.has(w.asset_id))return true;
      const a=S.assets.find(x=>x.id===w.asset_id);
      if(a&&(dubailFilter(a.name)||dubailFilter(a.location||'')))return true;
    }
    return false;
  });
}

// Retourne les assets filtrés selon le profil  
function getFilteredAssets(){
  const u=S.currentUser;
  if(!u||u.role==='admin')return S.assets;
  // If user has explicit visible_assets list, use it
  const va=u.visible_assets||u.assets||[];
  if(va.length>0)return S.assets.filter(a=>va.includes(a.id));
  // Dubail: filter by topology
  if(isDubailProfile()){
    const ids=getDubailAssetIds();
    return S.assets.filter(a=>ids.has(a.id)||dubailFilter(a.name)||dubailFilter(a.location||''));
  }
  return S.assets;
}

// Retourne les locataires filtrés
function getFilteredTenants(){
  if(!isDubailProfile())return S.tenants;
  return S.tenants.filter(t=>dubailFilter(t.logement||''));
}

function accessAssets(u){if(!u)return[];if(u.role==='admin')return S.assets;const vis=u.visible_assets||u.assets||[];if(vis.length===0)return S.assets;return S.assets.filter(a=>vis.includes(a.id));}

function bindLogin(){
  // Pre-fill saved credentials
  const savedEmail = localStorage.getItem('gmao_saved_email')||'';
  const savedPass  = localStorage.getItem('gmao_saved_pass')||'';
  if(savedEmail){ document.getElementById('le').value=savedEmail; }
  if(savedPass){  document.getElementById('lp').value=savedPass; }
  if(savedEmail&&savedPass){ document.getElementById('lrem').checked=true; }

  document.getElementById('lb').onclick = async () => {
    const email = document.getElementById('le').value.trim();
    const pass  = document.getElementById('lp').value;
    const remember = document.getElementById('lrem').checked;
    if(S.users.length===0){
      const el=document.getElementById('lerr');
      el.style.display='block';
      el.textContent='Erreur : impossible de charger les utilisateurs. Vérifiez votre connexion.';
      return;
    }
    const user  = S.users.find(u => u.email === email && u.password === pass);
    if(user){
      if(remember){
        localStorage.setItem('gmao_saved_email', email);
        localStorage.setItem('gmao_saved_pass',  pass);
      } else {
        localStorage.removeItem('gmao_saved_email');
        localStorage.removeItem('gmao_saved_pass');
      }
      S.currentUser = user; render();
    } else {
      const el=document.getElementById('lerr');
      el.style.display='block';
      el.textContent='Identifiants incorrects';
    }
  };
  document.getElementById('lp').onkeydown = e => { if(e.key==='Enter') document.getElementById('lb').click(); };
}


const USER_PROFILE_TABS = {
  admin:      null,
  technicien: ['dashboard','workorders','tools','consommables','loans','maintenance','rangements'],
  dubail:     ['workorders','consommables','locatif','compteurs','finances'],
  perso:      ['dashboard','workorders','vehicles','finances','famille'],
  famille_jm: ['dashboard','workorders','vehicles','topology','famille','factures'],
  custom:     null
};
function getUserVisibleTabs(){
  const u=S.currentUser;
  if(!u||u.role==='admin') return null;
  if(u.visible_tabs&&u.visible_tabs.length>0) return u.visible_tabs;
  return USER_PROFILE_TABS[u.profile||'technicien']||null;
}
function applyUserProfile(prof){
  const tabs=USER_PROFILE_TABS[prof];
  document.querySelectorAll('.utab').forEach(cb=>{
    cb.checked = !tabs||tabs.includes(cb.value);
  });
}

function getUserTabs(user){
  if(!user||user.role==='admin')return null; // null = tout visible
  // Priorité : visible_tabs personnalisés > profil prédéfini
  if(user.visible_tabs&&user.visible_tabs.length>0)return user.visible_tabs;
  const prof=USER_PROFILES[user.profile]||USER_PROFILES['technicien'];
  return prof.tabs;
}
function canSeeTab(tabId){
  const tabs=getUserTabs(S.currentUser);
  return !tabs||tabs.includes(tabId);
}
function getUserAssets(user){
  if(!user||user.role==='admin')return S.assets;
  const vis=user.visible_assets||user.assets||[];
  if(vis.length===0)return S.assets; // vide = tous
  return S.assets.filter(a=>vis.includes(a.id));
}

function applyProfile(prof){
  const profileTabs=USER_PROFILES[prof]?.tabs||[];
  document.querySelectorAll('.utab').forEach(cb=>{
    cb.checked = (prof==='admin')||profileTabs.includes(cb.value);
  });
}
// "Dupliquer les droits de..." : reprend role/profil/onglets/equipements
// d'un utilisateur existant tel quel, pour eviter de recocher a la main
// chaque case quand personne ne correspond aux 4 profils standards.
function applyUserDuplicate(sourceUserId){
  if(!sourceUserId)return;
  const src=S.users.find(u=>u.id===sourceUserId);
  if(!src)return;
  const roleSel=document.getElementById('m-ur');
  if(roleSel)roleSel.value=src.role||'technicien';
  const profSel=document.getElementById('m-uprof');
  if(profSel)profSel.value=src.profile||'custom';
  const tabs=getUserTabs(src); // null = tout visible (admin, ou role sans restriction)
  document.querySelectorAll('.utab').forEach(cb=>{cb.checked=!tabs||tabs.includes(cb.value);});
  const srcAssets=src.visible_assets||src.assets||[];
  document.querySelectorAll('.ac').forEach(cb=>{cb.checked=srcAssets.includes(cb.value);});
}

function renderDashboard(){
  const assets = getFilteredAssets();
  const wos = getFilteredWOs();
  const loanedN = S.loans.filter(l=>!l.returned).length;
  const openWO = wos.filter(w=>w.status==='open').length;
  const dubailAssetIdSet=isDubailProfile()?getDubailAssetIds():null;
  const upcoming = S.maintenanceTemplates.filter(mt=>{
    if(dubailAssetIdSet&&mt.asset_id&&!dubailAssetIdSet.has(mt.asset_id))return false;
    if(dubailAssetIdSet&&!mt.asset_id)return false;
    const d = mt.type==='periodic' ? mt.next_due : mt.due_date;
    const n = daysUntil(d); return n!==null && n<=60 && n>=-10;
  }).sort((a,b)=>new Date(a.type==='periodic'?a.next_due:a.due_date)-new Date(b.type==='periodic'?b.next_due:b.due_date)).slice(0,5);

  // Regroupe chaque BT ouvert par bien (topo_ref) ou vehicule/equipement
  // (asset_id) pour le tableau ci-dessous - meme principe de libelle que
  // renderFactures/renderChantiers, mais tri simple en une seule table
  // (demande explicite : "un tableau", pas des sous-groupes par carte).
  const woLabel=(w)=>{
    if(w.topo_ref?.propName)return {icon:'🏠',label:w.topo_ref.propName,detail:[w.topo_ref.zoneName,w.topo_ref.subName].filter(Boolean).join(' › ')};
    const asset=w.asset_id?S.assets.find(a=>a.id===w.asset_id):null;
    if(asset){
      const isVeh=asset.category==='Véhicule'||asset.category==='Bateau';
      return {icon:isVeh?'🚗':'🔧',label:asset.name,detail:''};
    }
    return {icon:'—',label:'Sans bien / véhicule',detail:''};
  };
  const openWOs=getFilteredWOs().filter(w=>w.status==='open').map(w=>({w,g:woLabel(w)}))
    .sort((a,b)=>a.g.label.localeCompare(b.g.label)||new Date(a.w.date)-new Date(b.w.date));

  return `<div class="g3" style="margin-bottom:16px">
    <div class="stat"><div class="stat-l">Équipements</div><div class="stat-v">${assets.length}</div></div>
    <div class="stat"><div class="stat-l">Bons ouverts</div><div class="stat-v" style="color:var(--amber)">${openWO}</div></div>
    <div class="stat"><div class="stat-l">Outils prêtés</div><div class="stat-v">${loanedN}</div></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="sec">Prochaines gammes (60j)</div>
    ${upcoming.map(mt=>{
      const d = mt.type==='periodic' ? mt.next_due : mt.due_date;
      const days = daysUntil(d);
      const asset = S.assets.find(a=>a.id===mt.asset_id);
      return `<div class="row"><div class="fg"><div class="fgs">${mt.name}</div><div class="fgsub">${asset?.name||'—'}</div></div>
        <span class="badge ${days<0?'bred':days<=15?'bamber':'bblue'}">${days<0?`${-days}j retard`:`${days}j`}</span></div>`;
    }).join('')}
    ${upcoming.length===0?'<div style="font-size:12px;color:var(--text2)">Aucune échéance proche.</div>':''}
  </div>
  <div class="card">
    <div class="sec">Bons de travaux ouverts (${openWOs.length}) — triés par bien / véhicule</div>
    ${openWOs.length>0?`<div style="overflow-x:auto"><table>
      <thead><tr><th>Bien / Véhicule</th><th>Bon de travaux</th><th>Catégorie</th><th>Date</th><th></th></tr></thead>
      <tbody>
      ${openWOs.map(({w,g})=>`<tr>
        <td style="font-size:12px;white-space:nowrap">${g.icon} ${g.label}${g.detail?`<div style="font-size:10px;color:var(--text2)">${g.detail}</div>`:''}</td>
        <td style="font-size:13px;font-weight:500">${w.title}</td>
        <td><span class="badge ${w.category==='Urgence'?'bred':'bamber'}" style="font-size:10px">${w.category||'—'}</span></td>
        <td style="font-size:12px;white-space:nowrap">${dateLabel(w.date)}</td>
        <td><button class="btn btn-sm" data-view-wo="${w.id}">👁</button></td>
      </tr>`).join('')}
      </tbody>
    </table></div>`:'<div style="font-size:12px;color:var(--text2)">Aucun bon ouvert.</div>'}
  </div>`;
}



function renderAssetDetail(a){
  const woList = S.workOrders.filter(w=>w.asset_id===a.id);
  const sb = a.status==='ok'?'bgreen':a.status==='attention'?'bamber':'bred';
  const docs = a.documents||[];
  // L'historique combine les interventions saisies a la main (a.history, rarement
  // rempli) et les bons de travaux termines lies a cet equipement - sans quoi

function renderWorkOrders(){
  const assets = accessAssets(S.currentUser);
  if(!S.woSearch) S.woSearch={prop:'',zone:'',sub:'',asset:'',status:'open'};
  const sf = S.woSearch;

  const wos = getFilteredWOs().filter(w=>isAdmin()||!w.asset_id||assets.map(a=>a.id).includes(w.asset_id)||isDubailProfile());

  const filtered = wos.filter(w=>{
    if(sf.status==='open'&&w.status!=='open') return false;
    if(sf.status==='done'&&w.status!=='done') return false;
    if(sf.prop&&(!w.topo_ref||w.topo_ref.propId!==sf.prop)) return false;
    if(sf.zone&&(!w.topo_ref||w.topo_ref.zoneId!==sf.zone)) return false;
    if(sf.sub&&(!w.topo_ref||w.topo_ref.subId!==sf.sub)) return false;
    if(sf.asset&&w.asset_id!==sf.asset) return false;
    if(S.filter.cat&&S.filter.cat!=='all'&&!['open','done'].includes(S.filter.cat)&&w.category!==S.filter.cat) return false;
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const selProp = sf.prop ? S.topology.properties.find(p=>p.id===sf.prop) : null;
  const selZone = sf.zone && selProp ? selProp.zones?.find(z=>z.id===sf.zone) : null;

  return `<div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:14px">
    <div style="font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Rechercher / Filtrer</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:10px">
      <div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Bien immobilier</div>
        <select id="wo-filter-prop" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
          <option value="">Tous les biens</option>
          ${S.topology.properties.map(p=>`<option value="${p.id}" ${sf.prop===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      ${selProp?`<div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Zone</div>
        <select id="wo-filter-zone" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
          <option value="">Toutes les zones</option>
          ${(selProp.zones||[]).map(z=>`<option value="${z.id}" ${sf.zone===z.id?'selected':''}>${z.name}</option>`).join('')}
        </select>
      </div>`:''}
      ${selZone&&(selZone.subZones||[]).length>0?`<div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Sous-zone</div>
        <select id="wo-filter-sub" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
          <option value="">Toutes</option>
          ${(selZone.subZones||[]).map(s=>`<option value="${s.id}" ${sf.sub===s.id?'selected':''}>${s.name}</option>`).join('')}
        </select>
      </div>`:''}
      <div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Équipement</div>
        <select id="wo-filter-asset" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
          <option value="">Tous</option>
          ${S.assets.filter(a=>a.category!=='Immobilier').map(a=>`<option value="${a.id}" ${sf.asset===a.id?'selected':''}>${a.name}</option>`).join('')}
        </select>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Statut</div>
        <select id="wo-filter-status" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
          <option value="all" ${sf.status==='all'?'selected':''}>Tous</option>
          <option value="open" ${sf.status==='open'?'selected':''}>Ouverts</option>
          <option value="done" ${sf.status==='done'?'selected':''}>Terminés</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      ${['Réparation','Urgence','Amélioration','Autre'].map(c=>`<span class="pill ${S.filter.cat===c?'active':''}" data-fcat="${c}">${c}</span>`).join('')}
      ${sf.prop||sf.zone||sf.sub||sf.asset||sf.status!=='open'?`<button id="wo-reset-filters" class="btn btn-sm" style="margin-left:auto">✕ Réinitialiser</button>`:''}

    </div>
  </div>
  ${filtered.map(w=>{
    const woDocs = w.docs||[];
    const asset = S.assets.find(a=>a.id===w.asset_id);
    const tr = w.topo_ref;
    const locationLabel = tr ? [tr.propName, tr.zoneName, tr.subName].filter(Boolean).join(' › ') : '';
    return `<div class="wo-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text)">${w.title}</div>
          ${w.chantier_id?(()=>{const ch=S.chantiers.find(c=>c.id===w.chantier_id);return ch?`<div style="font-size:11px;color:var(--text2);margin-top:1px">🏗️ ${ch.nom}</div>`:'';})():''}
          ${locationLabel?`<div style="font-size:11px;color:var(--blue);margin-top:1px">📍 ${locationLabel}</div>`:''}
          <div style="font-size:11px;color:var(--text2)">${asset?`🔧 ${asset.name} · `:''}${dateLabel(w.date)}</div>
        </div>
        <div style="display:flex;gap:6px"><span class="badge ${w.category==='Urgence'?'bred':w.category==='Réparation'?'bamber':'bblue'}">${w.category||''}</span><span class="badge ${w.status==='done'?'bgreen':'bamber'}">${w.status==='done'?'Terminé':'Ouvert'}</span></div>
      </div>
      ${w.description?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${w.description}</div>`:''}
      ${woDocs.length>0?`<div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px">📎 Pièces jointes (${woDocs.length})</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${woDocs.map(d=>`<div style="display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:var(--radius);padding:6px 10px;border:0.5px solid var(--border2)">
            <span style="font-size:14px">${d.type==='devis'?'📋':d.type==='facture'?'🧾':d.type==='photo'?'🖼':'📄'}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}${d.phase==='avant'?' <span class="badge bamber" style="font-size:9px">À faire</span>':d.phase==='apres'?' <span class="badge bgreen" style="font-size:9px">Réalisé</span>':''}</div>
              <div style="font-size:10px;color:var(--text2)">${d.type||'document'} · ${dateLabel(d.date)}</div>
            </div>
            <a href="${d.url}" target="_blank" rel="noopener" style="flex-shrink:0;padding:4px 10px;background:var(--green);color:#fff;border-radius:var(--radius);font-size:11px;text-decoration:none;font-weight:500">
              Ouvrir
            </a>
            ${canEdit()?`<span data-del-wo-doc="${d.id}" data-wo-id="${w.id}" style="flex-shrink:0;color:var(--red);cursor:pointer;font-size:14px;padding:0 2px">✕</span>`:''}
          </div>`).join('')}
        </div>
      </div>`:''}
      ${w.devis_montant>0?(()=>{
        const totalFact=S.factures.filter(fc=>fc.wo_id===w.id).reduce((s,fc)=>s+parseFloat(fc.montant_ttc||0),0);
        const ecart=totalFact-w.devis_montant;
        return `<div style="font-size:11px;color:var(--text2);margin-bottom:6px">📐 Devis ${w.devis_montant.toFixed(2)}€ · Reçu ${totalFact.toFixed(2)}€ · Écart <b style="color:${ecart>0?'var(--red)':'var(--green)'}">${ecart>0?'+':''}${ecart.toFixed(2)}€</b></div>`;
      })():''}
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${w.cost>0?`<span class="badge bblue">${w.cost}€</span>`:''}
        ${w.by_user?`<span style="font-size:11px;color:var(--text3)">Par : ${w.by_user}</span>`:''}
        ${canEdit()?`<button class="btn btn-sm" data-add-wo-doc="${w.id}" style="margin-left:auto">📎 Joindre</button>`:''}
        <button class="btn btn-sm" data-view-wo="${w.id}">👁 Consulter</button>
        ${(canEdit()||isAdmin())?`<button class="btn btn-sm" data-edit-wo="${w.id}">✎ Modifier</button>`:''}
        ${canEdit()&&(w.checklist||[]).length>0?`<button class="btn btn-sm" data-checklist-wo="${w.id}">📋 Check-list</button>`:''}
        ${canEdit()&&w.status==='open'?`<button class="btn btn-sm btn-p" data-close-wo="${w.id}">✓ Terminer</button>`:''}
        ${isAdmin()?`<button class="btn btn-d btn-sm" data-del-wo="${w.id}">✕</button>`:''}
      </div>
      ${(w.checklist||[]).length>0?`<div style="margin-top:8px;border-top:0.5px solid var(--border);padding-top:8px">
        <div style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px">🛠 Matériel (${(w.checklist||[]).filter(i=>i.fait).length}/${(w.checklist||[]).length})</div>

}

function motifOptsFor(sel){
  const opt=(val,label)=>'<option value="'+val+'"'+(val===(sel||'')?' selected':'')+'>'+label+'</option>';
  const opts=[opt('','— Motif —')];
  MOTIFS.forEach(m=>opts.push(opt(m,m)));
  return opts.join('');
}

function renderDevisAValider(){
  const pending=(S.devisAValider||[]).filter(d=>d.statut==='en_attente').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const bienOptsBase=buildBienOptsBase();
  const bienOptsFor=(sel)=>renderOpts(bienOptsBase,sel);
  const chantierOptsBase=buildChantierOptsBase();
  const chantierOptsFor=(sel)=>renderOpts(chantierOptsBase,sel);
  return `<div class="card" style="margin-top:14px">
    <div class="sec" style="margin-bottom:8px">📐 Devis détectés automatiquement, en attente de rattachement à un bon de travaux</div>

      <thead><tr><th>Date</th><th>Fichier</th><th>Entreprise</th><th>Montant TTC</th><th>Bien / Zone</th><th>Chantier</th><th>Bon de travaux</th><th>Motif</th><th>Actions</th></tr></thead>
      <tbody>
      ${pending.map(d=>{

        return `<tr>
          <td style="vertical-align:top;padding-top:8px"><input type="date" class="dev-date" data-dev-id="${d.id}" value="${d.date_devis||d.fichier_date||''}" style="width:130px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
          <td style="font-size:11px;vertical-align:top;padding-top:10px;max-width:160px;word-break:break-word">
            ${d.fichier_nom||'—'}
            ${fileUrl?`<br><a href="${fileUrl}" target="_blank" style="font-size:10px">📄 Ouvrir le fichier</a>`:'<br><span style="color:var(--red);font-size:10px">Fichier indisponible</span>'}
            ${d.erreur_extraction?`<div class="badge bamber" style="font-size:9px;margin-top:4px;white-space:normal" title="${d.erreur_extraction.replace(/"/g,'&quot;')}">⚠ ${d.erreur_extraction}</div>`:''}
          </td>
          <td style="vertical-align:top"><input class="dev-entreprise" data-dev-id="${d.id}" list="fournisseurs-list" value="${(d.entreprise||'').replace(/"/g,'&quot;')}" placeholder="Entreprise / artisan" style="width:150px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
          <td style="vertical-align:top"><input type="number" step="0.01" class="dev-montant" data-dev-id="${d.id}" value="${d.montant_ttc!=null?d.montant_ttc:''}" placeholder="0.00" style="width:90px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px"></td>
          <td style="vertical-align:top"><select class="dev-bien" data-dev-id="${d.id}" style="width:170px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${bienOptsFor(d.bien||'')}</select></td>
          <td style="vertical-align:top"><select class="dev-chantier" data-dev-id="${d.id}" style="width:150px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${chantierOptsFor(d.chantier_id||'')}</select></td>
          <td style="vertical-align:top"><select class="dev-wo" data-dev-id="${d.id}" style="width:200px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">${computeFilteredWoOpts(d.bien||'',d.chantier_id||'',d.wo_id||'',true)}</select></td>
          <td style="vertical-align:top">
            <select class="dev-motif" data-dev-id="${d.id}" style="width:110px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;margin-bottom:3px">${motifOptsFor(MOTIFS.includes(d.motif)?d.motif:'')}</select>
            <input class="dev-motif-autre" data-dev-id="${d.id}" value="${(d.motif&&!MOTIFS.includes(d.motif))?d.motif.replace(/"/g,'&quot;'):''}" placeholder="Autre motif..." style="width:110px;padding:4px 7px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:11px">
          </td>
          <td style="white-space:nowrap;vertical-align:top;padding-top:8px">
            <button class="btn btn-sm btn-p" data-devis-valider="${d.id}" title="Valider et rattacher au bon de travaux">✅</button>
            <button class="btn btn-sm btn-d" data-devis-rejeter="${d.id}" title="Rejeter (n'est pas un devis)" style="margin-left:3px">🚫</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`:''}
  </div>`;
}

function renderChantiers(){
  const cTab=S.chantierTab||'liste';
  const nDevisAValider=(S.devisAValider||[]).filter(d=>d.statut==='en_attente').length;
  const tabBar=`<div class="tab-bar">
    <div class="tab ${cTab==='liste'?'active':''}" data-chantier-tab="liste">🏗️ Chantiers</div>
    <div class="tab ${cTab==='devis'?'active':''}" data-chantier-tab="devis">📐 Devis à valider${nDevisAValider>0?` <span class="badge bamber" style="font-size:10px">${nDevisAValider}</span>`:''}</div>
  </div>`;
  if(cTab==='devis'){
    return tabBar+renderDevisAValider();
  }
  if(!S.chantierFilter)S.chantierFilter={status:'ouvert',year:'',propId:'',zoneId:''};
  const cf=S.chantierFilter;
  // Classes par ordre de date de debut (les plus anciens d'abord) - les
  // chantiers sans date sont relegues a la fin plutot qu'exclus.
  const chantiersAll=[...(S.chantiers||[])].sort((a,b)=>{
    if(!a.date_debut&&!b.date_debut)return 0;
    if(!a.date_debut)return 1;
    if(!b.date_debut)return -1;
    return new Date(a.date_debut)-new Date(b.date_debut);
  });
  const chantierYears=[...new Set(chantiersAll.map(c=>c.date_debut?c.date_debut.slice(0,4):null).filter(Boolean))].sort().reverse();
  const cfSelProp = cf.propId ? S.topology.properties.find(p=>p.id===cf.propId) : null;
  const cfSelZone = cf.zoneId && cfSelProp ? (cfSelProp.zones||[]).find(z=>z.id===cf.zoneId) : null;
  // "bien" est stocke en texte libre "Prop - Zone - SousZone" - un filtre par
  // bien seul doit aussi remonter les chantiers situes sur une de ses zones.
  const cfBienStr = cfSelZone ? cfSelProp.name+' - '+cfSelZone.name : (cfSelProp ? cfSelProp.name : '');
  const chantiers=chantiersAll.filter(c=>{
    if(cf.status!=='all'&&(c.statut||'ouvert')!==cf.status)return false;
    if(cf.year&&(!c.date_debut||!c.date_debut.startsWith(cf.year)))return false;
    if(cfBienStr){
      const cb=(c.bien||'').trim();
      if(cb!==cfBienStr&&!cb.startsWith(cfBienStr+' - '))return false;
    }
    return true;
  });
  const filterBar=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:10px">
    <div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Bien immobilier</div>
      <select id="chantier-filter-prop" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
        <option value="">Tous les biens</option>
        ${S.topology.properties.map(p=>`<option value="${p.id}" ${cf.propId===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select>
    </div>
    ${cfSelProp?`<div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Zone</div>
      <select id="chantier-filter-zone" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
        <option value="">Toutes les zones</option>
        ${(cfSelProp.zones||[]).map(z=>`<option value="${z.id}" ${cf.zoneId===z.id?'selected':''}>${z.name}</option>`).join('')}
      </select>
    </div>`:''}
    <div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:3px">Année</div>
      <select id="chantier-filter-year" style="width:100%;padding:6px 8px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px">
        <option value="">Toutes années</option>
        ${chantierYears.map(y=>`<option value="${y}" ${cf.year===y?'selected':''}>${y}</option>`).join('')}
      </select>
    </div>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
    <span class="pill ${cf.status==='ouvert'?'active':''}" data-chantier-status="ouvert">Ouverts</span>
    <span class="pill ${cf.status==='termine'?'active':''}" data-chantier-status="termine">Terminés</span>
    <span class="pill ${cf.status==='all'?'active':''}" data-chantier-status="all">Tous</span>
  </div>`;
  const html=chantiers.map(c=>{
    const wos=S.workOrders.filter(w=>w.chantier_id===c.id);
    const factsDirectes=S.factures.filter(f=>f.chantier_id===c.id&&!f.wo_id);
    const devisDirects=(S.devis||[]).filter(d=>d.chantier_id===c.id&&!d.wo_id);
    const totalDevis=wos.reduce((s,w)=>s+parseFloat(w.devis_montant||0),0)
      +devisDirects.filter(d=>d.retenu).reduce((s,d)=>s+parseFloat(d.montant_ttc||0),0);
    const totalReel=wos.reduce((s,w)=>s+S.factures.filter(f=>f.wo_id===w.id).reduce((ss,f)=>ss+parseFloat(f.montant_ttc||0),0),0)
      +factsDirectes.reduce((s,f)=>s+parseFloat(f.montant_ttc||0),0);
    const ecart=totalReel-totalDevis;
    const periode=[c.date_debut?dateLabel(c.date_debut):'',c.date_fin?dateLabel(c.date_fin):''].filter(Boolean).join(' → ');
    return `<div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
        <div>
          <div style="font-size:15px;font-weight:600">🏗️ ${c.nom}</div>
          ${c.bien?`<div style="font-size:11px;color:var(--text2);margin-top:1px">🏠 ${c.bien}</div>`:''}
          ${periode?`<div style="font-size:11px;color:var(--text2);margin-top:1px">📅 ${periode}</div>`:''}
          ${c.description?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${c.description}</div>`:''}
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <span class="badge ${c.statut==='termine'?'bgreen':'bamber'}">${c.statut==='termine'?'Terminé':'Ouvert'}</span>
          ${isAdmin()?`<button class="btn btn-sm" data-edit-chantier="${c.id}">✎</button>`:''}
          ${isAdmin()?`<button class="btn btn-d btn-sm" data-del-chantier="${c.id}">✕</button>`:''}
        </div>
      </div>
      ${(totalDevis>0||totalReel>0)?`<div style="display:flex;gap:16px;flex-wrap:wrap;padding:10px;background:var(--bg2);border-radius:var(--radius);margin-bottom:10px;font-size:12px">
        <div><span style="color:var(--text2)">Devis cumulé :</span> <b>${totalDevis.toFixed(2)} €</b></div>
        <div><span style="color:var(--text2)">Factures reçues :</span> <b>${totalReel.toFixed(2)} €</b></div>
        <div><span style="color:var(--text2)">Écart :</span> <b style="color:${ecart>0?'var(--red)':'var(--green)'}">${ecart>0?'+':''}${ecart.toFixed(2)} €</b></div>
      </div>`:''}
      <div class="sec" style="margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
        <span>Bons de travaux (${wos.length})</span>
        ${(canEdit()||isAdmin())?`<button class="btn btn-sm btn-p" data-add-wo-chantier="${c.id}">+ BT</button>`:''}
      </div>
      ${wos.map(w=>{
        const totalFactWo=S.factures.filter(f=>f.wo_id===w.id).reduce((s,f)=>s+parseFloat(f.montant_ttc||0),0);
        return `<div class="row">
          <div class="fg">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="fgs">${w.title}</span>
              <span class="badge ${w.status==='done'?'bgreen':'bamber'}" style="font-size:10px">${w.status==='done'?'Terminé':'Ouvert'}</span>
            </div>
            <div class="fgsub">${w.devis_montant>0?`Devis ${parseFloat(w.devis_montant).toFixed(2)}€ · `:''}Reçu ${totalFactWo.toFixed(2)}€</div>
          </div>
          <button class="btn btn-sm" data-view-wo="${w.id}">👁</button>
          ${(canEdit()||isAdmin())?`<button class="btn btn-sm" data-edit-wo="${w.id}">✎</button>`:''}
        </div>`;
      }).join('')}
      ${wos.length===0?`<div style="font-size:12px;color:var(--text2)">Aucun bon de travaux rattaché — depuis "Bons de travaux", associez-en un à ce chantier en le modifiant.</div>`:''}
      ${factsDirectes.length>0?`<div class="sec" style="margin:10px 0 6px">Factures liées directement (${factsDirectes.length}, sans BT)</div>
        ${factsDirectes.map(f=>`<div class="row">
          <div class="fg"><div class="fgs">${f.fournisseur||'—'}${f.description?' — '+f.description:''}</div><div class="fgsub">${parseFloat(f.montant_ttc||0).toFixed(2)}€${f.date?' · '+dateLabel(f.date):''}</div></div>
          ${(f.drive_url||f.document_url)?`<a href="${f.drive_url||f.document_url}" target="_blank" class="btn btn-sm">👁 Voir</a>`:''}
          ${canEdit()?`<button class="btn btn-sm" data-edit-fact="${f.id}">✎</button>`:''}
          ${isAdmin()?`<button class="btn btn-d btn-sm" data-del-fact="${f.id}" style="margin-left:4px">✕</button>`:''}
        </div>`).join('')}`:''}
      ${devisDirects.length>0?`<div class="sec" style="margin:10px 0 6px">Devis liés directement (${devisDirects.length}, sans BT)</div>
        ${devisDirects.map(d=>`<div class="row">
          <div class="fg"><div class="fgs">${d.entreprise||'—'}${d.retenu?' <span class=\"badge bgreen\" style=\"font-size:9px\">retenu</span>':''}</div><div class="fgsub">${parseFloat(d.montant_ttc||0).toFixed(2)}€${d.date_devis?' · '+dateLabel(d.date_devis):''}</div></div>
          ${d.document_url?`<a href="${d.document_url}" target="_blank" class="btn btn-sm">👁 Voir</a>`:''}
          <button class="btn btn-sm" data-link-devis-bt="${d.id}" data-chantier-id="${c.id}" title="Associer ce devis à un bon de travaux">✎</button>
        </div>`).join('')}`:''}
    </div>`;
  }).join('');
  return tabBar+filterBar+html+(chantiers.length===0?'<div style="text-align:center;padding:30px;color:var(--text2)">Aucun chantier pour ce filtre.</div>':'');
}

function renderTools(){
  const cats = ['all',...new Set(S.tools.map(t=>t.category).filter(Boolean))];
  const filtered = S.tools.filter(t=>{
    const c = S.filter.cat==='all'||!S.filter.cat||t.category===S.filter.cat;
    const s = !S.filter.search||t.name.toLowerCase().includes(S.filter.search.toLowerCase());
    return c&&s;
  });
  return `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <input id="tool-search" placeholder="Rechercher..." value="${S.filter.search}" style="flex:1;min-width:140px;padding:7px 9px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px">
    ${cats.map(c=>`<span class="pill ${S.filter.cat===c||(!S.filter.cat&&c==='all')?'active':''}" data-fcat="${c}">${c==='all'?'Tous':c}</span>`).join('')}
  </div>
  <div class="card"><div style="overflow-x:auto"><table>
    <thead><tr><th>Outil</th><th>Catégorie</th><th>Rangement</th><th>Statut</th><th></th></tr></thead>

      const loan = S.loans.find(l=>l.tool_id===t.id&&!l.returned);

      return `<tr>
        <td><div style="font-weight:500">${t.name}</div><div style="font-size:11px;color:var(--text2)">${t.description||''}</div></td>
        <td><span class="badge bgray">${t.category||''}</span></td>
        <td style="font-size:12px">${rngLabel(t.location)}${t.location_detail?`<div style="font-size:10px;color:var(--text3)">${t.location_detail}</div>`:''}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="tool-dot ${effStatus==='available'?'dot-green':effStatus==='loaned'?'dot-amber':'dot-red'}"></div>
            <span style="font-size:12px">${effStatus==='available'?'Disponible':effStatus==='loaned'?'Prêté':'Maintenance'}</span>
          </div>
          ${loan?`<div style="font-size:11px;color:var(--text3)">→ ${loan.borrower} · retour ${dateLabel(loan.expected_return)}</div>`:''}
        </td>
        <td style="white-space:nowrap">
          ${canEdit()&&effStatus==='available'?`<button class="btn btn-sm" data-lend-tool="${t.id}">Prêter</button> `:''}
          ${canEdit()&&effStatus==='loaned'?`<button class="btn btn-sm" data-return-tool="${t.id}">Retour</button> `:''}
          <button class="btn btn-sm" data-print-label="${t.id}" title="Étiquette QR">🖨</button>
          ${isAdmin()?`<button class="btn btn-sm" data-edit-tool="${t.id}">✎</button> <button class="btn btn-d btn-sm" data-del-tool="${t.id}">✕</button>`:''}
        </td>
      </tr>`;
    }).join('')}
    ${filtered.length===0?'<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text2)">Aucun outil.</td></tr>':''}
    </tbody>
  </table></div></div>`;
}

    <div class="sec">Prêts en cours (${active.length})</div>

      const tool = S.tools.find(t=>t.id===l.tool_id);
      const days = daysUntil(l.expected_return);
      return `<div class="row">
        <div class="fg"><div class="fgs">${tool?.name||'Outil inconnu'}</div><div class="fgsub">Emprunté par <b>${l.borrower}</b> depuis le ${dateLabel(l.date)}</div><div style="font-size:11px;color:var(--text3)">${l.notes||''}</div></div>

        ${canEdit()?`<button class="btn btn-sm" data-return-tool="${l.tool_id}">✓ Rendu</button>`:''}
      </div>`;
    }).join('')}

  </div>
  <div class="card">
    <div class="sec">Historique (${past.length})</div>
    ${past.slice().reverse().slice(0,10).map(l=>{
      const tool = S.tools.find(t=>t.id===l.tool_id);
      return `<div class="row"><div class="fg"><div class="fgs">${tool?.name||'—'}</div><div class="fgsub">${l.borrower} · ${dateLabel(l.date)}</div></div><span class="badge bgreen">Rendu</span></div>`;
