// Biens visibles dans Topologie pour un utilisateur restreint a certains
// equipements (visible_assets) : un bien est visible des qu'au moins un de
// ses noeuds (bien/zone/sous-zone) a un asset autorise.
function getFilteredProperties(){
  const all=S.topology.properties||[];
  if(isAdmin())return all;
  const va=S.currentUser?.visible_assets||S.currentUser?.assets||[];
  if(va.length===0)return all;
  return all.filter(p=>{
    const ids=[p.assetId,...(p.zones||[]).flatMap(z=>[z.assetId,...(z.subZones||[]).map(s=>s.assetId)])].filter(Boolean);
    return ids.some(id=>va.includes(id));
  });
}
function renderTopology(){
  const ts = S.topoState;
  const prop = getFilteredProperties().find(p=>p.id===ts.propId);
  const zone = prop?.zones?.find(z=>z.id===ts.zoneId);
  const subZone = zone?.subZones?.find(s=>s.id===ts.subZoneId);
  const trade = subZone?.trades?.find(t=>t.id===ts.tradeId)
             || zone?.trades?.find(t=>t.id===ts.tradeId);

  // Breadcrumb
  function breadcrumb(){
    const parts = [];
    if(prop) parts.push(`<span style="cursor:pointer;color:var(--blue)" data-topo-prop="${prop.id}">${prop.name}</span>`);
    if(zone) parts.push(`<span style="cursor:pointer;color:var(--blue)" data-topo-zone="${zone.id}">${zone.name}</span>`);
    if(subZone) parts.push(`<span style="cursor:pointer;color:var(--blue)" data-topo-subzone="${subZone.id}">${subZone.name}</span>`);
    if(trade) parts.push(`<span>${trade.icon||''} ${trade.name}</span>`);
    return parts.length ? `<div style="font-size:12px;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${parts.join('<span style="color:var(--text3)">›</span>')}</div>` : '';
  }

  function treeNodeZone(z, propId){
    const exp = ts.expanded[z.id];
    const hasSub = z.subZones&&z.subZones.length>0;
    const hasTrades = z.trades&&z.trades.length>0;
    const hasChildren = hasSub||hasTrades;
    const isSel = ts.zoneId===z.id&&!ts.subZoneId;
    return `<div>
      <div class="tree-row ${isSel?'selected':''}" data-topo-zone="${z.id}">
        ${hasChildren?`<span class="tree-toggle" data-topo-toggle="${z.id}">${exp?'▾':'▸'}</span>`:'<span class="tree-toggle"></span>'}
        <span>📁</span><span style="flex:1">${z.name}</span>
        ${isAdmin()?`<span style="font-size:11px;color:var(--text3);cursor:pointer;padding:0 3px" data-add-sub="${z.id}" title="Ajouter sous-zone">+</span>`:''}
        ${isAdmin()?`<span style="font-size:11px;color:#E24B4A;cursor:pointer;padding:0 3px" data-del-zone="${z.id}" data-del-zone-prop="${propId}">✕</span>`:''}
      </div>
      ${hasChildren&&exp?`<div class="tree-children">
        ${(z.subZones||[]).map(s=>treeNodeSub(s,z.id,propId)).join('')}
        ${(z.trades||[]).map(t=>treeNodeTrade(t,z.id,null,propId)).join('')}
      </div>`:''}
    </div>`;
  }

  function treeNodeSub(s, zoneId, propId){
    const exp = ts.expanded[s.id];
    const hasTrades = s.trades&&s.trades.length>0;
    const isSel = ts.subZoneId===s.id;
    return `<div>
      <div class="tree-row ${isSel?'selected':''}" data-topo-subzone="${s.id}" data-topo-subzone-zone="${zoneId}">
        ${hasTrades?`<span class="tree-toggle" data-topo-toggle="${s.id}">${exp?'▾':'▸'}</span>`:'<span class="tree-toggle"></span>'}
        <span>📂</span><span style="flex:1">${s.name}</span>
        ${isAdmin()?`<span style="font-size:11px;color:var(--text3);cursor:pointer;padding:0 3px" data-add-trade="${s.id}" data-add-trade-zone="${zoneId}" title="Ajouter corps de métier">+</span>`:''}
        ${isAdmin()?`<span style="font-size:11px;color:#E24B4A;cursor:pointer;padding:0 3px" data-del-sub="${s.id}" data-del-sub-zone="${zoneId}" data-del-sub-prop="${propId}">✕</span>`:''}
      </div>
      ${hasTrades&&exp?`<div class="tree-children">${s.trades.map(t=>treeNodeTrade(t,zoneId,s.id,propId)).join('')}</div>`:''}
    </div>`;
  }

  function treeNodeTrade(t, zoneId, subId, propId){
    const isSel = ts.tradeId===t.id;
    return `<div class="tree-row ${isSel?'selected':''}" data-topo-trade="${t.id}" data-topo-trade-zone="${zoneId}" data-topo-trade-sub="${subId||''}">
      <span class="tree-toggle"></span>
      <span>${t.icon||'🔧'}</span><span style="flex:1">${t.name}</span>
      ${isAdmin()?`<span style="font-size:11px;color:#E24B4A;cursor:pointer;padding:0 3px" data-del-trade="${t.id}" data-del-trade-zone="${zoneId}" data-del-trade-sub="${subId||''}" data-del-trade-prop="${propId}">✕</span>`:''}
    </div>`;
  }

  // Determine what to show in right panel

  function topoAssetPanel(nodeAssetId, nodeName, bienStr){
    if(!nodeAssetId && !nodeName) return '';
    const asset = nodeAssetId ? S.assets.find(a=>a.id===nodeAssetId) : null;
    const ts = S.topoState;
    const docs = (S.bienDocuments||[]).filter(d=>normBienSep(d.bien)===normBienSep(bienStr));
    const logFiche = bienStr?findLogementFiche(bienStr):null;
    // Baux/diagnostics generes depuis la fiche locataire (voir bail-form) -
    // le champ logement du locataire utilise un tiret cadratin (—) alors que
    // bienStr (chemin topologique) utilise un tiret simple, d'ou la
    // normalisation avant comparaison. Correspondance par prefixe : la vue
    // "bien" doit remonter les documents de tous les locataires en dessous.
    const normBien=normBienSep(bienStr);
    const matchingTenants=(S.tenants||[]).filter(t=>{
      const normLog=normBienSep(t.logement);
      return normLog&&(normLog===normBien||normLog.startsWith(normBien+' - '));
    }).sort((a,b)=>new Date(b.date_entree||b.created_at||0)-new Date(a.date_entree||a.created_at||0));
    const tenantDocs=[];
    matchingTenants.forEach(t=>{
      if(t.bail_url)tenantDocs.push({type:'Bail — '+t.nom,date:t.date_entree,document_url:t.bail_url,fromTenant:true});
      Object.entries(DIAG_LABELS).forEach(([k,label])=>{
        const dd=t.bail_data?.['diag_'+k];
        // Rouge des que l'echeance reglementaire est depassee, meme sans
        // changement de locataire en vue - permet d'anticiper la commande
        // du renouvellement plutot que de le decouvrir a la relocation.
        if(dd?.url)tenantDocs.push({type:label+' — '+t.nom,date:dd.date,document_url:dd.url,fromTenant:true,expired:diagIsExpired(dd.date,k),tenantId:t.id,diagKey:k});
      });
    });
    const allDocs=[...docs.map(d=>({...d,expired:d.date_expiry?new Date(d.date_expiry)<new Date():false})),...tenantDocs];
    // Find WOs linked to this topo node (by assetId OR by topo_ref matching current node)
    const wos = S.workOrders.filter(w=>{
      if(nodeAssetId && w.asset_id===nodeAssetId) return true;
      if(!w.topo_ref) return false;
      if(ts.subZoneId && w.topo_ref.subId===ts.subZoneId) return true;
      if(!ts.subZoneId && ts.zoneId && w.topo_ref.zoneId===ts.zoneId && !w.topo_ref.subId) return true;
      if(!ts.subZoneId && !ts.zoneId && ts.propId && w.topo_ref.propId===ts.propId && !w.topo_ref.zoneId) return true;
      return false;
    });
    const hist = asset?.history||[];
    const openWos = wos.filter(w=>w.status==='open');
    return `<div style="margin-top:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="card" style="padding:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div class="sec" style="margin:0">Bons de travaux (${wos.length})</div>
            ${canEdit()?`<button class="btn btn-sm btn-p" data-topo-add-wo="${nodeAssetId}">+ Bon</button>`:''}
          </div>
          ${openWos.map(w=>`<div class="row">
            <div class="fg"><div class="fgs" style="font-size:12px">${w.title}</div><div class="fgsub">${dateLabel(w.date)} · ${w.category||''}</div></div>
            <span class="badge ${w.status==='done'?'bgreen':'bamber'}" style="font-size:10px">${w.status==='done'?'Terminé':'Ouvert'}</span>
          </div>`).join('')}
          ${wos.filter(w=>w.status==='done').length>0&&openWos.length===0?`<div style="font-size:11px;color:var(--text2)">${wos.length} bon(s) terminé(s)</div>`:''}
          ${wos.length===0?'<div style="font-size:11px;color:var(--text2)">Aucun bon de travaux.</div>':''}
        </div>
        <div class="card" style="padding:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div class="sec" style="margin:0">Historique (${hist.length})</div>
            ${canEdit()?`<button class="btn btn-sm btn-p" data-topo-add-hist="${nodeAssetId}">+ Intervention</button>`:''}
          </div>
          ${hist.slice().reverse().slice(0,3).map(h=>`<div class="row">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:3px"></div>
            <div class="fg"><div class="fgs" style="font-size:12px">${h.type} — ${dateLabel(h.date)}</div><div class="fgsub">${h.desc}</div></div>
          </div>`).join('')}
          ${hist.length===0?'<div style="font-size:11px;color:var(--text2)">Aucune intervention.</div>':''}
        </div>
      </div>
      ${bienStr?`<div class="card" style="padding:12px;margin-top:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="sec" style="margin:0">🏠 Fiche du logement</div>
          ${canEdit()?`<button class="btn btn-sm btn-p" data-edit-logement-fiche="${bienStr.replace(/"/g,'&quot;')}">✎ ${logFiche?'Modifier':'Renseigner'}</button>`:''}
        </div>
        ${logFiche?`<div style="font-size:12px;line-height:1.7">
          ${logFiche.adresse||bienStr}${logFiche.appt?', '+logFiche.appt:''}${logFiche.etage?' · '+logFiche.etage:''}<br>
          ${logFiche.type_logement?logFiche.type_logement+' · ':''}${logFiche.type_habitat||'—'} · ${logFiche.regime||'—'} · Construit : ${logFiche.periode_construction||'—'}<br>
          ${logFiche.surface?logFiche.surface+' m²':'Surface —'} · ${logFiche.nb_pieces||'—'} pièce(s) · Chauffage ${logFiche.chauffage||'—'} · Eau chaude ${logFiche.eau_chaude||'—'}<br>
          Gaz : ${logFiche.gaz_present===true?'Oui':logFiche.gaz_present===false?'Non (diag. gaz non requis)':'Inconnu'}<br>
          ${logFiche.annexes?'Annexes : '+logFiche.annexes+'<br>':''}
          ${logFiche.equipements?'Équipements : '+logFiche.equipements+'<br>':''}
          ${logFiche.parties_communes?'Parties communes : '+logFiche.parties_communes+'<br>':''}
          ${logFiche.tic?'TIC : '+logFiche.tic:''}
        </div>`:'<div style="font-size:11px;color:var(--text2)">Non renseignée — nécessaire pour générer un bail sans ressaisir ces informations à chaque locataire.</div>'}
      </div>`:''}
      ${bienStr?`<div class="card" style="padding:12px;margin-top:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="sec" style="margin:0">📄 Documents (${allDocs.length})</div>
          ${canEdit()?`<button class="btn btn-sm btn-p" data-add-bien-doc="${bienStr.replace(/"/g,'&quot;')}">+ Document</button>`:''}
        </div>
        ${allDocs.map(d=>`<div class="row">
          <div class="fg"><div class="fgs" style="font-size:12px${d.expired?';color:var(--red)':''}">${d.type||'Document'}${d.expired?' <span class="badge bred" style="font-size:9px">À revalider</span>':''}</div><div class="fgsub">${d.date?dateLabel(d.date):''}${d.date_expiry?' · expire '+dateLabel(d.date_expiry):''}${d.notes?' · '+d.notes:''}${d.fromTenant?' · fiche locataire':''}</div></div>
          ${d.document_url?`<a href="${d.document_url}" target="_blank" class="btn btn-sm">👁 Voir</a>`:''}
          ${canEdit()&&!d.fromTenant?`<button class="btn btn-d btn-sm" data-del-bien-doc="${d.id}">✕</button>`:''}
          ${canEdit()&&d.diagKey?`<button class="btn btn-d btn-sm" data-del-tenant-diag="${d.tenantId}" data-diag-key="${d.diagKey}" title="Diagnostic issu d'un ancien bail (avant la fiche du logement)">✕</button>`:''}
        </div>`).join('')}
        ${allDocs.length===0?'<div style="font-size:11px;color:var(--text2)">Aucun document (DPE, diagnostic amiante/plomb...).</div>':''}
      </div>`:''}
      ${bienStr?`<div class="card" style="padding:12px;margin-top:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="sec" style="margin:0">🕐 Historique des locataires (${matchingTenants.length})</div>
          ${canEdit()?`<button class="btn btn-sm btn-p" data-add-tenant-for="${bienStr.replace(/ - /g,' — ').replace(/"/g,'&quot;')}">+ Nouveau locataire</button>`:''}
        </div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:6px">Un locataire qui part ne doit jamais être modifié pour en accueillir un nouveau : passez-le en "Parti" puis utilisez ce bouton pour créer une fiche séparée, sinon son bail et son historique sont perdus.</div>
        ${matchingTenants.map(t=>`<div class="row">
          <div class="fg">
            <div class="fgs" style="font-size:12px">${t.nom}${t.actif!==false?' <span class="badge bgreen" style="font-size:9px">Actuel</span>':' <span class="badge bgray" style="font-size:9px">Parti</span>'}</div>
            <div class="fgsub">${t.date_entree?'Entrée '+dateLabel(t.date_entree):''}${t.date_sortie?' · Sortie '+dateLabel(t.date_sortie):''}</div>
          </div>
          ${t.bail_url?`<a href="${t.bail_url}" target="_blank" class="btn btn-sm">📄 Bail</a>`:''}
          ${canEdit()?`<button class="btn btn-sm" data-edit-tenant="${t.id}">✎</button>`:''}
        </div>`).join('')}
        ${matchingTenants.length===0?'<div style="font-size:11px;color:var(--text2)">Aucun locataire enregistré pour ce logement.</div>':''}
      </div>`:''}
    </div>`;
  }

  let rightPanel = '';
  if(!prop){
    rightPanel = '<div style="padding:20px;color:var(--text2)">Sélectionnez un bien.</div>';
  } else if(trade){
    // Show trade elements
    const items = trade.items||[];
    rightPanel = `<div class="card">
      ${breadcrumb()}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:14px;font-weight:500">${trade.icon||'🔧'} ${trade.name}</div>
        ${isAdmin()?`<button class="btn btn-sm btn-p" id="btn-add-topo-item">+ Élément</button>`:''}
      </div>
      ${items.map(item=>`<div class="row">
        <div class="fg"><div class="fgs">${item.name}</div>${item.notes?`<div class="fgsub">${item.notes}</div>`:''}</div>
        ${isAdmin()?`<button class="btn btn-d btn-sm" data-del-topo-item="${item.id}">✕</button>`:''}
      </div>`).join('')}
      ${items.length===0?'<div style="font-size:12px;color:var(--text2)">Aucun élément. Cliquez "+ Élément" pour commencer.</div>':''}
    </div>`;
  } else if(subZone){
    // Show trades of subzone
    const trades = subZone.trades||[];
    rightPanel = `<div class="card">
      ${breadcrumb()}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:14px;font-weight:500">📂 ${subZone.name}</div>
        ${isAdmin()?`<button class="btn btn-sm btn-p" id="btn-add-trade-here" data-for-sub="${subZone.id}" data-for-zone="${zone.id}">+ Corps de métier</button>`:''}
      </div>
      <div class="g3">${trades.map(t=>`<div class="card" style="cursor:pointer;text-align:center;padding:14px" data-topo-trade="${t.id}" data-topo-trade-zone="${zone.id}" data-topo-trade-sub="${subZone.id}">
        <div style="font-size:22px;margin-bottom:4px">${t.icon||'🔧'}</div>
        <div style="font-size:13px;font-weight:500">${t.name}</div>
        <div style="font-size:11px;color:var(--text2)">${t.items?.length||0} élément(s)</div>
      </div>`).join('')}</div>
      ${trades.length===0?'<div style="font-size:12px;color:var(--text2)">Aucun corps de métier.</div>':''}
    </div>
    ${!subZone.assetId&&canEdit()?`<div style="margin-top:10px"><button class="btn btn-p" style="width:100%" data-link-node="${subZone.id}" data-link-name="${subZone.name}" data-link-type="Sous-zone">🔗 Lier un équipement à cette sous-zone</button></div>`:''}
    ${topoAssetPanel(subZone.assetId, subZone.name, [prop.name,zone.name,subZone.name].filter(Boolean).join(' - '))}`;
  } else if(zone){
    // Show subzones + direct trades
    const subs = zone.subZones||[];
    const trades = zone.trades||[];
    rightPanel = `<div class="card">
      ${breadcrumb()}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:14px;font-weight:500">📁 ${zone.name}</div>
        <div style="display:flex;gap:6px">
          ${isAdmin()?`<button class="btn btn-sm" id="btn-add-sub-here" data-for-zone="${zone.id}">+ Sous-zone</button>`:''}
          ${isAdmin()?`<button class="btn btn-sm btn-p" id="btn-add-trade-direct" data-for-zone="${zone.id}">+ Corps de métier</button>`:''}
        </div>
      </div>
      ${subs.length>0?`<div class="sec">Sous-zones</div>
        <div class="g3">${subs.map(s=>`<div class="card" style="cursor:pointer;text-align:center;padding:14px" data-topo-subzone="${s.id}" data-topo-subzone-zone="${zone.id}">
          <div style="font-size:22px;margin-bottom:4px">📂</div>
          <div style="font-size:13px;font-weight:500">${s.name}</div>
          <div style="font-size:11px;color:var(--text2)">${(s.trades||[]).length} corps de métier</div>
        </div>`).join('')}</div>`:''}
      ${trades.length>0?`<div class="sec" style="margin-top:${subs.length>0?'12px':'0'}">Corps de métier directs</div>
        <div class="g3">${trades.map(t=>`<div class="card" style="cursor:pointer;text-align:center;padding:14px" data-topo-trade="${t.id}" data-topo-trade-zone="${zone.id}" data-topo-trade-sub="">
          <div style="font-size:22px;margin-bottom:4px">${t.icon||'🔧'}</div>
          <div style="font-size:13px;font-weight:500">${t.name}</div>
          <div style="font-size:11px;color:var(--text2)">${t.items?.length||0} élément(s)</div>
        </div>`).join('')}</div>`:''}
      ${subs.length===0&&trades.length===0?'<div style="font-size:12px;color:var(--text2)">Zone vide. Ajoutez une sous-zone ou un corps de métier directement.</div>':''}
    </div>
    ${!zone.assetId&&canEdit()?`<div style="margin-top:10px"><button class="btn btn-p" style="width:100%" data-link-node="${zone.id}" data-link-name="${zone.name}" data-link-type="Zone">🔗 Lier un équipement à cette zone</button></div>`:''}
    ${topoAssetPanel(zone.assetId, zone.name, [prop.name,zone.name].filter(Boolean).join(' - '))}`;
  } else {
    // Show zones of property
    const zones = prop.zones||[];
    rightPanel = `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-size:14px;font-weight:500">🏠 ${prop.name}</div>
        ${isAdmin()?`<button class="btn btn-sm btn-p" id="btn-add-zone-here">+ Zone</button>`:''}
      </div>
      <div class="g3">${zones.map(z=>`<div class="card" style="cursor:pointer;text-align:center;padding:14px" data-topo-zone="${z.id}">
        <div style="font-size:22px;margin-bottom:4px">📁</div>
        <div style="font-size:13px;font-weight:500">${z.name}</div>
        <div style="font-size:11px;color:var(--text2)">${(z.subZones||[]).length} sous-zone(s) · ${(z.trades||[]).length} corps de métier</div>
      </div>`).join('')}</div>
      ${zones.length===0?'<div style="font-size:12px;color:var(--text2)">Aucune zone. Commencez par ajouter une zone (ex: Appartement 1er gauche, RDC, Cave...).</div>':''}
    </div>
    ${!prop.assetId&&canEdit()?`<div style="margin-top:10px"><button class="btn btn-p" style="width:100%" data-link-node="${prop.id}" data-link-name="${prop.name}" data-link-type="Bien immobilier">🔗 Lier un équipement à ce bien</button></div>`:''}
    ${topoAssetPanel(prop.assetId, prop.name, prop.name)}`;
  }

  return `<div class="split ${prop?'has-prop':''}">
    <div class="split-left">
      <div class="card" style="padding:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="sec" style="margin:0">Biens</div>
          ${isAdmin()?`<button class="btn btn-sm btn-p" id="btn-add-prop">+</button>`:''}
        </div>
        ${getFilteredProperties().map(p=>`<div class="tree-row ${ts.propId===p.id?'selected':''}" data-topo-prop="${p.id}">
          <span>🏠</span><span style="flex:1;font-size:13px">${p.name}</span>
          ${isAdmin()?`<span style="font-size:11px;cursor:pointer;color:var(--text3);padding:0 3px" data-add-zone-prop="${p.id}" title="Ajouter zone">+</span>`:''}
          ${isAdmin()?`<span style="font-size:11px;color:#E24B4A;cursor:pointer;padding:0 3px" data-del-prop="${p.id}">✕</span>`:''}
        </div>`).join('')}
      </div>
      ${prop?`<div class="card" style="padding:10px;margin-top:10px">
        <div class="sec" style="margin-bottom:8px">${prop.name}</div>
        ${(prop.zones||[]).map(z=>treeNodeZone(z, prop.id)).join('')}
        ${(prop.zones||[]).length===0?'<div style="font-size:11px;color:var(--text3)">Aucune zone.</div>':''}
      </div>`:''}
    </div>
    <div class="split-right">${prop?`<div class="mobile-back" data-topo-prop="">← Tous les biens</div>`:''}${rightPanel}</div>
  </div>`;
}

function renderVehicles(){
  // Regroupe voitures, bateaux et velos : categorie 'Bateau' repliee ici avec
  // 'Vehicule' (categorie unique desormais, voir add-asset), distingues par
  // icone selon le champ libre .type.
  const vehicles = S.assets.filter(a=>a.category==='Véhicule'||a.category==='Bateau');
  const vehIcon=v=>{
    const t=(v.type||'')+' '+(v.category||'');
    if(/bateau|rigide|zodiac|boat|voilier/i.test(t))return '⛵';
    if(/v[ée]lo|bike|cargo/i.test(t))return '🚴';
    return '🚗';
  };
  return `<div class="g2">
    ${vehicles.map(v=>{
      const sb = v.status==='ok'?'bgreen':v.status==='attention'?'bamber':'bred';
      const days = daysUntil(v.next_maint);
      const wos = S.workOrders.filter(w=>w.asset_id===v.id);
      const mts = S.maintenanceTemplates.filter(m=>m.asset_id===v.id);
      return `<div class="card" style="cursor:pointer" data-goto-asset="${v.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
          <div>
            <div style="font-size:16px;margin-bottom:4px">${vehIcon(v)}</div>
            <div style="font-weight:500;font-size:14px">${v.name}</div>
            <div style="font-size:11px;color:var(--text2)">${v.location||''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <span class="badge ${sb}">${v.status==='ok'?'OK':v.status==='attention'?'Attention':'Urgent'}</span>
            ${v.carte_grise?.immat?`<span style="font-family:monospace;font-size:12px;font-weight:700;background:#1a3a6b;color:#fff;padding:2px 8px;border-radius:4px;letter-spacing:.08em">${v.carte_grise.immat}</span>`:''}
          </div>
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${v.description||'—'}</div>

            <div style="font-weight:500;margin-top:2px">${dateLabel(v.next_maint)}</div>
          </div>
          <div style="background:var(--bg2);padding:6px 8px;border-radius:var(--radius)">
            <div style="color:var(--text3)">Gammes / Bons</div>
            <div style="font-weight:500;margin-top:2px">${mts.length} / ${wos.length}</div>
          </div>
        </div>

          ${days!==null?`<span class="badge ${days<0?'bred':days<=30?'bamber':'bgray'}">${days<0?`${-days}j retard`:`${days}j`}</span>`:''}
        </div>

    }).join('')}
    ${vehicles.length===0?`<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2)">
      <div style="font-size:32px;margin-bottom:10px">🚗</div>
      <div>Aucun véhicule. Ajoutez un équipement de catégorie <b>Véhicule</b> (voiture, bateau, vélo...).</div>
    </div>`:''}
  </div>`;
}function renderReservations(){
  const taux=S.taxeSejourTaux||5;const plafond=S.taxeSejourPlafond||4.60;
  const fmt=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n||0);
  const year=S.resaYear||new Date().getFullYear();
  const yearBar='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">'
    +[2024,2025,2026,2027].map(y=>'<span class="pill '+(year===y?'active':'')+'" data-resa-year="'+y+'">'+y+'</span>').join("")
    +'<span class="pill '+(year===0?'active':'')+'" data-resa-year="0">Tout</span></div>';
  const allResa=[...new Map((S.reservations||[]).map(r=>[r.id,r])).values()];
  const resas=allResa.filter(r=>year===0||(r.date_arrivee||"").startsWith(String(year)));
  const srcBadge=s=>s==="airbnb"?'<span class="badge" style="background:#FF5A5F;color:#fff;font-size:9px">Airbnb</span>'
    :s==="booking"?'<span class="badge" style="background:#003580;color:#fff;font-size:9px">Booking</span>'
    :'<span class="badge" style="background:#00B4D8;color:#fff;font-size:9px">Lodgify</span>';
  function roomTable(items,room){
    const total=items.reduce((s,r)=>s+(r.montant_total||0),0);
    const nuits=items.reduce((s,r)=>s+(r.nb_nuits||0),0);
    const rows=items.map(function(r){
      const isFerme=r.statut==='ferme';
      const incomplete=!isFerme&&!r.montant_total;
      const menagePresta=r.menage_prestataire!==false;
      return '<tr style="'+(isFerme?'background:#f5f5f5;opacity:0.6':incomplete?'background:#FFF9E6':'')+'">'
        +'<td style="font-size:11px">'+dateLabel(r.date_arrivee)+'</td>'
        +'<td style="font-size:11px">'+dateLabel(r.date_depart)+'</td>'
        +'<td style="text-align:center">'+( r.nb_nuits||"-")+'</td>'
        +'<td>'+( r.guest_name&&!r.guest_name.includes("***")?r.guest_name:'<span style="color:var(--text3)">Anonyme</span>')+'</td>'
        +'<td style="text-align:right">'+( r.montant_nuits?fmt(r.montant_nuits):"—")+'</td>'
        +'<td style="text-align:right">'+( r.frais_menage?fmt(r.frais_menage):"—")+'</td>'
        +'<td style="text-align:center">'  
          +'<button class="btn btn-sm" data-toggle-menage="'+r.id+'" '
            +'style="font-size:10px;padding:2px 6px;background:'+(menagePresta?'#1D9E75':'var(--amber)')+';color:#fff" '
            +'title="'+(menagePresta?'Prestataire — cliquer si vous faites vous-même':'Vous — cliquer si prestataire')+'">'
            +(menagePresta?'🧹 Presta':'🙋 Moi')
          +'</button>'
        +'</td>'
        +'<td style="text-align:right;font-weight:600">'+( r.montant_total?fmt(r.montant_total):'<span style="color:var(--amber)">⚠ à compléter</span>')+'</td>'
        +'<td>'+srcBadge(r.source)+'</td>'
        +'<td style="white-space:nowrap">'
          +(isFerme
            ?'<button class="btn btn-sm" data-toggle-ferme="'+r.id+'" style="font-size:10px;padding:2px 5px;background:var(--green);color:#fff">&#9745; Ouvrir</button>'
            :'<button class="btn btn-sm" data-edit-resa="'+r.id+'" style="font-size:10px;padding:2px 5px">&#9998;</button>'
             +'<button class="btn btn-sm" data-toggle-ferme="'+r.id+'" style="font-size:10px;padding:2px 5px;margin-left:2px;background:#95a5a6;color:#fff" title="Fermer logement">&#128683;</button>')
          +(r.montant_total?'<button class="btn btn-sm btn-p" data-facture-resa="'+r.id+'" style="font-size:10px;padding:2px 5px;margin-left:3px">&#128438; Facture</button>':'')
          +(isAdmin()?'<button class="btn btn-d btn-sm" data-del-resa="'+r.id+'" style="font-size:10px;padding:2px 5px;margin-left:3px">&#10005;</button>':"")
        +'</td></tr>';
    }).join("");
    return '<div class="card" style="margin-bottom:16px">'
      +'<div style="display:flex;justify-content:space-between;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--blue)">'
        +'<div style="font-size:14px;font-weight:700;color:var(--blue)">'+room+'</div>'
        +'<div style="font-size:12px;color:var(--text2)">'+items.length+' résa — '+nuits+' nuits — '+fmt(total)+'</div>'
      +'</div>'
      +(items.length?'<div style="overflow-x:auto"><table style="min-width:600px"><thead><tr>'
        +'<th style="font-size:10px">Arrivée</th><th style="font-size:10px">Départ</th>'
        +'<th style="font-size:10px;text-align:center">Nuits</th><th style="font-size:10px">Hôte</th>'
        +'<th style="font-size:10px;text-align:right">Nuits €</th><th style="font-size:10px;text-align:right">Ménage</th>'
        +'<th style="font-size:10px;text-align:right">Vers. hôte</th><th style="font-size:10px">Source</th><th></th>'
        +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
        :'<div style="color:var(--text2);font-size:12px">Aucune réservation pour cette période</div>')
      +'</div>';
  }
  // Taxe séjour section - Lodgify direct only
  const resasLodgify=(S.reservations||[]).filter(r=>r.source==='lodgify'&&(S.resaYear===0||(r.date_arrivee||'').startsWith(String(S.resaYear||new Date().getFullYear()))));
  function taxeAuto(r){const t=S.taxeSejourTaux||5;const p=S.taxeSejourPlafond||4.60;const pn=r.montant_nuits&&r.nb_nuits?r.montant_nuits/r.nb_nuits:0;return Math.round(Math.min(pn*t/100,p)*(r.nb_adultes||1)*(r.nb_nuits||1)*100)/100;}
  const rooms=['Studio','T2'];
  const taxeTable=rooms.map(function(room){
    const items=resasLodgify.filter(r=>r.room===room);
    if(!items.length)return '';
    // Group by month
    const byMonth={};
    items.forEach(function(r){
      const mo=r.date_arrivee?r.date_arrivee.slice(0,7):'?';
      if(!byMonth[mo])byMonth[mo]=[];
      byMonth[mo].push(r);
    });
    const rows=Object.keys(byMonth).sort().map(function(mo){
      const mrs=byMonth[mo];
      const nbResa=mrs.length;
      const nbNuits=mrs.reduce((s,r)=>s+(r.nb_nuits||0),0);
      const nbAdultes=mrs.reduce((s,r)=>s+(r.nb_adultes||0),0);
      const taxeDue=mrs.reduce((s,r)=>s+taxeAuto(r),0);
      const label=new Date(mo+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
      return '<tr><td>'+label+'</td><td style="text-align:center">'+nbResa+'</td><td style="text-align:center">'+nbNuits+'</td><td style="text-align:center">'+(nbAdultes||'?')+'</td><td style="text-align:right;font-weight:600">'+fmt(taxeDue)+'</td></tr>';
    }).join('');
    const totalTaxe=items.reduce((s,r)=>s+taxeAuto(r),0);
    return '<div class="card" style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid #1D9E75">'
        +'<div style="font-size:13px;font-weight:700;color:#1D9E75">&#127968; '+room+' — Taxe de séjour (Lodgify direct)</div>'
        +'<div style="font-size:12px;font-weight:600">Total : '+fmt(totalTaxe)+'</div>'
      +'</div>'
      +'<div style="overflow-x:auto"><table><thead><tr>'
        +'<th style="font-size:10px">Mois</th><th style="font-size:10px;text-align:center">Résa</th>'
        +'<th style="font-size:10px;text-align:center">Nuits</th><th style="font-size:10px;text-align:center">Adultes</th>'
        +'<th style="font-size:10px;text-align:right">Taxe due</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div style="margin-top:8px;font-size:11px;color:var(--text2)">&#9432; '+taux+'% plafonné à '+plafond+'€/j/adulte '
        +'<a href="#" onclick="S.view=\'settings\';render();return false;" style="color:var(--blue);text-decoration:none">⚙️ Modifier les paramètres</a>'
      +'</div>'
    +'</div>';
  }).join('');

// Tableau ménage
  const menageTable=rooms.map(function(room2){
    const allForRoom=(S.reservations||[]).filter(r=>(S.resaYear===0||(r.date_arrivee||'').startsWith(String(S.resaYear||year)))&&r.room===room2);
    if(!allForRoom.length)return '';
    const byMoM={};
    allForRoom.forEach(function(r){
      const mo=r.date_arrivee?r.date_arrivee.slice(0,7):'?';
      if(!byMoM[mo])byMoM[mo]=[];
      byMoM[mo].push(r);
    });
    const rowsM=Object.keys(byMoM).sort().map(function(mo){
      const mrs=byMoM[mo];
      const nbResa=mrs.length;
      const nbPresta=mrs.filter(r=>r.menage_prestataire!==false).length;
      const montantPresta=mrs.filter(r=>r.menage_prestataire!==false).reduce((s,r)=>s+(r.frais_menage||(r.room==='T2'?35:30)),0);
      const montantClient=mrs.reduce((s,r)=>s+(r.frais_menage||(r.room==='T2'?35:30)),0);
      const label=new Date(mo+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
      return '<tr><td>'+label+'</td>'
        +'<td style="text-align:center">'+nbResa+'</td>'
        +'<td style="text-align:center">'+(nbPresta>0?'<span style="color:var(--green);font-weight:600">'+nbPresta+'</span>':'<span style="color:var(--amber)">0</span>')+'</td>'
        +'<td style="text-align:right">'+fmt(montantPresta)+'</td>'
        +'<td style="text-align:right;color:var(--text2)">'+fmt(montantClient)+'</td>'
        +'</tr>';
    }).join('');
    return '<div class="card" style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid var(--amber)">'
        +'<div style="font-size:13px;font-weight:700;color:var(--amber)">&#129529; '+room2+' — Suivi ménage</div>'
      +'</div>'
      +'<div style="overflow-x:auto"><table><thead><tr>'
        +'<th style="font-size:10px">Mois</th>'
        +'<th style="font-size:10px;text-align:center">Résa</th>'
        +'<th style="font-size:10px;text-align:center">Prestations prestataire</th>'
        +'<th style="font-size:10px;text-align:right">Ménage prestataire (€)</th>'
        +'<th style="font-size:10px;text-align:right">Ménage facturé client (€)</th>'
      +'</tr></thead><tbody>'+rowsM+'</tbody></table></div>'
    +'</div>';
  }).join('');

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<h2 style="margin:0">Réservations courte durée</h2>'
    +'<button class="btn btn-p" id="btn-sync-lodgify">🔄 Sync Lodgify</button>'
  +'</div>'
  +yearBar
  +roomTable(resas.filter(r=>r.room==="Studio"),"Studio")
  +roomTable(resas.filter(r=>r.room==="T2"),"T2")
  +(menageTable?'<h3 style="margin:20px 0 10px">Suivi ménage</h3>'+menageTable:'')
  +(resasLodgify.length?'<h3 style="margin:20px 0 10px">Déclaration taxe de séjour</h3>'+taxeTable:'');
}

// Mode terrain : habillage alternatif de l'app sans barre laterale, pense
// pour une tablette sur le terrain (visite locataire) - reutilise
// integralement les memes modals (bail-form/edl-form/edl-config-pieces) et
// le meme etat S que la vue desktop, uniquement une coquille differente.
// Voir openBailFormFor/openEdlEntreeFor/openEdlSortieFor (pres de
// findLogementEdlEntree) pour la logique d'ouverture, partagee avec le
// modal edit-tenant classique.
function renderFieldApp(){
  const search=(S.fieldSearch||'').toLowerCase().trim();
  const tenants=(S.tenants||[]).filter(t=>t.actif!==false).filter(t=>{
    if(!search)return true;
    return (t.nom||'').toLowerCase().includes(search)||(t.logement||'').toLowerCase().includes(search);
  }).sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  const card=t=>{
    const entree=findLogementEdlEntree(t.logement,t.id);
    return `<div style="background:var(--bg);border:0.5px solid var(--border2);border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="font-size:16px;font-weight:700;margin-bottom:2px">${t.nom}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px">📍 ${t.logement||'—'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" data-field-bail="${t.id}" style="flex:1;min-width:110px;padding:14px 8px;border:none;border-radius:12px;background:#185FA5;color:#fff;font-size:13px;font-weight:600">📝 Bail</button>
        <button type="button" data-field-edl-entree="${t.id}" style="flex:1;min-width:110px;padding:14px 8px;border:none;border-radius:12px;background:${entree?'#7F8C8D':'#1D9E75'};color:#fff;font-size:13px;font-weight:600">📋 Entrée</button>
        <button type="button" data-field-edl-sortie="${t.id}" ${!entree?'disabled':''} style="flex:1;min-width:110px;padding:14px 8px;border:none;border-radius:12px;background:${entree?'#E67E22':'#ccc'};color:#fff;font-size:13px;font-weight:600">📋 Sortie</button>
        <button type="button" data-field-docs="${t.id}" style="flex:1;min-width:110px;padding:14px 8px;border:none;border-radius:12px;background:#8E44AD;color:#fff;font-size:13px;font-weight:600">📄 Documents</button>
      </div>
    </div>`;
  };
  return `<div style="padding:16px;max-width:600px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <button type="button" onclick="S.fieldMode=false;render()" style="padding:10px 14px;border:none;border-radius:12px;background:var(--bg2);color:var(--text);font-size:14px;font-weight:600">← Quitter</button>
      <div style="font-size:17px;font-weight:700">📋 Baux & États des lieux</div>
    </div>
    <input id="field-search" placeholder="Rechercher un locataire ou un logement..." value="${(S.fieldSearch||'').replace(/"/g,'&quot;')}" oninput="S.fieldSearch=this.value;render()" style="width:100%;padding:14px;font-size:15px;border-radius:12px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);margin-bottom:16px">
    ${tenants.length===0?'<div style="text-align:center;color:var(--text2);padding:30px">Aucun locataire trouvé.</div>':tenants.map(card).join('')}
    ${S.modal?renderModal():''}
  </div>`;
}
